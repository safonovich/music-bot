<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Тишина</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #0c0b09;
      --card-active: #17130a;
      --line: #221d13;
      --accent: #d0a94e;
      --accent-soft: rgba(208, 169, 78, 0.24);
      --text: #ece3cf;
      --text-dim: #7c756a;
      --radius: 18px;
      /* Отступ под вырез, «остров» и панель Telegram сверху */
      --top: max(env(safe-area-inset-top, 0px), 12px);
      --bottom: max(env(safe-area-inset-bottom, 0px), 10px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Шапку опускаем ниже системных элементов телефона */
    header {
      text-align: center;
      padding: calc(var(--top) + 46px) 16px 12px;
      position: relative;
    }
    header .title {
      font-size: 15px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: lowercase;
    }
    header .slogan {
      margin-top: 6px;
      font-size: 12.5px;
      color: var(--text-dim);
      letter-spacing: 0.3px;
    }

    #lang {
      position: absolute;
      top: calc(var(--top) + 44px);
      right: 14px;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: transparent;
      font-size: 16px; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, transform 0.1s;
    }
    #lang:active { transform: scale(0.9); }

    /* ── Вкладки категорий ── */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px 14px 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0;
      padding: 9px 15px 11px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      letter-spacing: 0.3px;
      cursor: pointer;
      position: relative;
      transition: color 0.25s;
    }
    .tab.active { color: var(--accent); }
    .tab::after {
      content: '';
      position: absolute;
      left: 15px; right: 15px; bottom: 4px;
      height: 1.5px;
      background: var(--accent);
      border-radius: 1px;
      opacity: 0;
      transform: scaleX(0.4);
      transition: opacity 0.25s, transform 0.25s;
    }
    .tab.active::after { opacity: 1; transform: scaleX(1); }

    .tabs-line { height: 1px; background: var(--line); margin: 0 14px 2px; }

    /* ── Свои миксы ── */
    .mixes {
      display: flex;
      gap: 8px;
      padding: 10px 14px 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .mixes::-webkit-scrollbar { display: none; }

    .mix-btn {
      flex-shrink: 0;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
      position: relative;
      padding-right: 28px;
    }
    .mix-btn:active { transform: scale(0.95); }
    .mix-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .mix-btn .del {
      position: absolute; right: 6px; top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; line-height: 1;
      color: var(--text-dim);
      background: rgba(255,255,255,0.05);
    }
    .mix-btn .del:active { background: #7a2c2c; color: #fff; }

    .mix-btn.add {
      padding: 7px 13px;
      font-size: 14px;
      line-height: 1;
      color: var(--accent);
      border-style: dashed;
    }

    /* ── Атмосферы: крупные карточки вместо ползунков ── */
    .scenes { padding: 10px 14px 0; display: flex; flex-direction: column; gap: 9px; }

    .scene {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card);
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: border-color 0.25s, background 0.25s, transform 0.1s;
      position: relative;
    }
    .scene:active { transform: scale(0.99); }
    .scene.active {
      background: var(--card-active);
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-soft);
    }
    .scene.blocked { opacity: 0.5; }

    .scene .ic {
      width: 26px; height: 26px;
      flex-shrink: 0;
      color: var(--text-dim);
      transition: color 0.25s;
    }
    .scene.active .ic { color: var(--accent); }
    .scene .ic svg { width: 100%; height: 100%; }

    .scene .txt { flex: 1; min-width: 0; }
    .scene .nm {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.2px;
    }
    .scene.active .nm { color: var(--accent); }
    .scene .ds {
      font-size: 11.5px;
      color: var(--text-dim);
      margin-top: 2px;
      line-height: 1.35;
    }
    .scene .lk {
      width: 12px; height: 12px;
      flex-shrink: 0;
      color: var(--text-dim);
      opacity: 0.5;
    }

    /* ── Сетка звуков ── */
    .pane { display: none; }
    .pane.active { display: block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px;
      padding: 10px 14px 0;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 15px 9px 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: border-color 0.35s, background 0.35s, box-shadow 0.35s, opacity 0.3s;
      user-select: none;
      position: relative;
    }
    .card.active {
      background: var(--card-active);
      border-color: var(--accent);
      box-shadow: 0 0 22px var(--accent-soft);
    }
    .card.blocked { opacity: 0.45; }

    .card-icon {
      width: 25px; height: 25px;
      color: var(--text-dim);
      transition: color 0.35s, transform 0.35s;
      display: flex; align-items: center; justify-content: center;
    }
    .card-icon svg { width: 100%; height: 100%; }
    .card.active .card-icon { color: var(--accent); transform: scale(1.06); }

    .card.loading .card-icon { opacity: 0.15; }
    .card .spinner {
      display: none;
      position: absolute; top: 15px;
      width: 21px; height: 21px;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .card.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .card .badge {
      position: absolute; top: 7px; right: 8px;
      width: 11px; height: 11px;
      color: var(--text-dim);
      opacity: 0.5;
    }
    .card.active .badge { color: var(--accent); opacity: 1; }

    .card-name {
      font-size: 10.5px;
      color: var(--text-dim);
      text-align: center;
      font-weight: 500;
      letter-spacing: 0.2px;
      transition: color 0.35s;
      line-height: 1.25;
      min-height: 26px;
      display: flex;
      align-items: center;
    }
    .card.active .card-name { color: var(--text); }

    .slider-wrap { width: 100%; padding: 0 2px; }

    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 3px;
      border-radius: 2px; outline: none; cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.35s;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--val, 0%), var(--line) var(--val, 0%), var(--line) 100%);
    }
    .card.active input[type=range] { opacity: 1; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--accent); cursor: pointer;
      box-shadow: 0 0 6px var(--accent-soft);
    }
    input[type=range]::-moz-range-thumb {
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
    }

    /* ── Подсказка про фон на iPhone ── */
    #hint {
      display: none;
      margin: 14px 14px 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--text-dim);
    }
    #hint.show { display: block; }
    #hint b { color: var(--text); font-weight: 500; }
    #hint .row { display: flex; gap: 8px; margin-top: 10px; }
    #hint button {
      flex: 1;
      padding: 9px 0;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text-dim);
      font-size: 11.5px;
      font-family: inherit;
      cursor: pointer;
    }
    #hint button.main { background: var(--accent); color: #000; border-color: var(--accent); }

    #timer-display {
      text-align: center;
      font-size: 12px;
      color: var(--accent);
      height: 18px;
      margin-top: 12px;
      letter-spacing: 1px;
    }
    #timer-display.fading { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .controls {
      display: flex;
      gap: 8px;
      padding: 8px 14px calc(var(--bottom) + 16px);
      justify-content: center;
      margin-top: auto;
    }

    .btn {
      flex: 1;
      max-width: 110px;
      padding: 12px 0;
      border: 1px solid var(--line);
      border-radius: 13px;
      font-size: 12.5px;
      font-weight: 500;
      font-family: inherit;
      letter-spacing: 0.2px;
      cursor: pointer;
      background: transparent;
      color: var(--text-dim);
      transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.1s, opacity 0.25s;
    }
    .btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.35; cursor: default; }

    .timer-wrap { position: relative; flex: 1; max-width: 110px; display: flex; }
    .timer-wrap .btn { width: 100%; max-width: none; }

    .timer-menu {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #0c0b09;
      border: 1px solid var(--line);
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,0.6);
      z-index: 100;
      min-width: 140px;
    }
    .timer-menu.open { display: block; }
    .timer-option {
      padding: 12px 20px;
      font-size: 14px;
      cursor: pointer;
      color: var(--text);
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }
    .timer-option:hover, .timer-option:active { background: var(--accent); color: #000; }
    .timer-option.cancel-opt { color: var(--text-dim); border-top: 1px solid var(--line); }

    #modal {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 300;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    #modal.open { display: flex; }
    .modal-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px 20px 18px;
      width: 100%; max-width: 320px;
    }
    .modal-title { font-size: 14px; color: var(--text); margin-bottom: 4px; font-weight: 500; }
    .modal-hint { font-size: 11.5px; color: var(--text-dim); margin-bottom: 14px; line-height: 1.4; }
    #preset-name {
      width: 100%;
      padding: 11px 13px;
      background: #000;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      margin-bottom: 14px;
    }
    #preset-name:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions .btn { max-width: none; }

    /* ── Первый экран: выбор состояния ── */
    #intro {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 400;
      display: none;
      flex-direction: column;
      justify-content: center;
      padding: calc(var(--top) + 40px) 26px calc(var(--bottom) + 30px);
      animation: fadeIn 0.5s ease;
    }
    #intro.show { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #intro .brand {
      font-size: 15px;
      color: var(--accent);
      letter-spacing: 3px;
      text-align: center;
      text-transform: lowercase;
      margin-bottom: 40px;
    }
    #intro .ask {
      font-size: 21px;
      color: var(--text);
      text-align: center;
      line-height: 1.35;
      font-weight: 400;
      margin-bottom: 6px;
    }
    #intro .sub {
      font-size: 12.5px;
      color: var(--text-dim);
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .goals { display: flex; flex-direction: column; gap: 10px; }
    .goal {
      padding: 17px 20px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.1s;
    }
    .goal:active { transform: scale(0.98); }
    .goal:hover { border-color: var(--accent); }
    .goal small {
      display: block;
      margin-top: 3px;
      font-size: 11.5px;
      font-weight: 400;
      color: var(--text-dim);
    }
    #intro .skip {
      margin-top: 24px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      opacity: 0.7;
    }

    /* ── Экран подписки ── */
    #pay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 350;
      align-items: flex-end;
      justify-content: center;
    }
    #pay.open { display: flex; }

    .pay-box {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--line);
      border-bottom: none;
      border-radius: 22px 22px 0 0;
      padding: 26px 22px calc(var(--bottom) + 20px);
      animation: rise 0.3s ease;
    }
    @keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

    .pay-title {
      font-size: 19px;
      color: var(--text);
      font-weight: 500;
      margin-bottom: 6px;
    }
    .pay-sub {
      font-size: 12.5px;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .pay-list { display: flex; flex-direction: column; gap: 11px; margin-bottom: 22px; }
    .pay-row { display: flex; gap: 11px; align-items: flex-start; }
    .pay-row .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent);
      margin-top: 7px;
      flex-shrink: 0;
    }
    .pay-row .rt { font-size: 13px; color: var(--text); line-height: 1.4; }
    .pay-row .rt small {
      display: block;
      font-size: 11.5px;
      color: var(--text-dim);
      margin-top: 1px;
    }

    .pay-cta {
      width: 100%;
      padding: 15px 0;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: #000;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .pay-cta:active { transform: scale(0.98); }
    .pay-note {
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 11px;
      line-height: 1.4;
    }
    .pay-close {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 10px 0;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 12.5px;
      font-family: inherit;
      cursor: pointer;
    }

    #toast {
      position: fixed;
      bottom: calc(var(--bottom) + 78px);
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--accent);
      color: #000;
      padding: 10px 22px;
      border-radius: 22px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 200;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <div class="title" id="brand">тишина</div>
    <div class="slogan" id="slogan"></div>
    <button id="lang"></button>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="tabs-line"></div>

  <div class="mixes" id="mixes">
    <button class="mix-btn add" id="btn-save-mix">＋</button>
  </div>

  <div id="panes"></div>

  <div id="hint">
    <span id="hint-text"></span>
    <div class="row">
      <button id="hint-open" class="main"></button>
      <button id="hint-close"></button>
    </div>
  </div>

  <div id="timer-display"></div>

  <div class="controls">
    <button class="btn" id="btn-animate"></button>
    <div class="timer-wrap">
      <button class="btn" id="btn-timer"></button>
      <div class="timer-menu" id="timer-menu">
        <div class="timer-option" data-min="15"></div>
        <div class="timer-option" data-min="30"></div>
        <div class="timer-option" data-min="45"></div>
        <div class="timer-option" data-min="60"></div>
        <div class="timer-option cancel-opt" data-min="0"></div>
      </div>
    </div>
    <button class="btn" id="btn-stop" disabled></button>
    <button class="btn" id="btn-share"></button>
  </div>

  <div id="modal">
    <div class="modal-box">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-hint" id="modal-hint"></div>
      <input type="text" id="preset-name" maxlength="18" autocomplete="off">
      <div class="modal-actions">
        <button class="btn" id="modal-cancel"></button>
        <button class="btn active" id="modal-ok"></button>
      </div>
    </div>
  </div>

  <div id="intro">
    <div class="brand" id="intro-brand">тишина</div>
    <div class="ask" id="intro-ask"></div>
    <div class="sub" id="intro-sub"></div>
    <div class="goals" id="goals"></div>
    <button class="skip" id="intro-skip"></button>
  </div>

  <div id="pay">
    <div class="pay-box">
      <div class="pay-title" id="pay-title"></div>
      <div class="pay-sub" id="pay-sub"></div>
      <div class="pay-list" id="pay-list"></div>
      <button class="pay-cta" id="pay-cta"></button>
      <div class="pay-note" id="pay-note"></div>
      <button class="pay-close" id="pay-close"></button>
    </div>
  </div>

  <div id="toast"></div>

  <script>
  (() => {
    'use strict';

    const TG = window.Telegram?.WebApp;
    if (TG) {
      TG.expand();
      try { TG.setBackgroundColor('#000000'); TG.setHeaderColor('#000000'); } catch (e) {}
      try { TG.disableVerticalSwipes(); } catch (e) {}
    }

    const QS = new URLSearchParams(location.search);
    const UID = TG?.initDataUnsafe?.user?.id || 0;
    const PRO_KEY = 'tishina_pro';

    const IS_PRO = (() => {
      const f = QS.get('pro');
      if (f === '1') { try { localStorage.setItem(PRO_KEY, String(UID)); } catch (e) {} return true; }
      if (f === '0') { try { localStorage.removeItem(PRO_KEY); } catch (e) {} return false; }
      try { const s = localStorage.getItem(PRO_KEY); if (s !== null && String(UID) === s) return true; } catch (e) {}
      return false;
    })();

    // ───────────────────────────────────────── Языки
    const I18N = {
      ru: {
        slogan: 'Включи фоновое спокойствие',
        scenes: 'Атмосферы',
        nature: 'Природа', city: 'Город', transport: 'Транспорт', tones: 'Тона',
        sc: {
          paris:  ['Парижское кафе', 'Гул зала, улица за дверью, дождь'],
          night:  ['Ночной поезд',   'Стук колёс, дождь в окно, редкие голоса'],

    const SOUNDS = CATS.flatMap(c => c.sounds.map(s => ({ ...s, cat: c.id, file: s.id + '.mp3' })));
    const allowed = s => !!s.free || IS_PRO;
    const FADE = 0.4, TIMER_FADE = 30;

    // ───────────────────────────────────────── Звук (медиаэлементы)
    const els = {}, state = {}, fades = {};
    let masterVol = 1;

    const canAAC = (() => {
      const a = document.createElement('audio');
      return !!a.canPlayType('audio/mp4; codecs="mp4a.40.2"');
    })();

    function ensureEl(id) {
      if (els[id]) return els[id];
      const s = SOUNDS.find(x => x.id === id);
      const el = new Audio();
      el.src = canAAC ? id + '.m4a' : s.file;
      el.loop = true;
      el.preload = 'auto';
      el.volume = 0;
      el.setAttribute('playsinline', '');
      el.addEventListener('playing', () => setCardLoading(id, false));
      el.addEventListener('canplaythrough', () => setCardLoading(id, false));
      el.addEventListener('error', () => {
        if (!el.dataset.fb && el.src.endsWith('.m4a')) {
          el.dataset.fb = '1'; el.src = s.file; el.load();
          if (state[id].active) el.play().catch(() => {});
          return;
        }
        setCardLoading(id, false); showToast(t('loadFail'));
      });
      els[id] = el;
      return el;
    }

    function fadeTo(id, target, seconds, onDone) {
      const el = els[id];
      if (!el) return;
      clearInterval(fades[id]);
      const from = el.volume, steps = Math.max(1, Math.round(seconds * 20));
      let i = 0;
      fades[id] = setInterval(() => {
        i++;
        try { el.volume = Math.max(0, Math.min(1, from + (target-from)*(i/steps))); } catch (e) {}
        if (i >= steps) { clearInterval(fades[id]); delete fades[id]; if (onDone) onDone(); }
      }, seconds * 1000 / steps);
    }

    async function startSound(id) {
      const el = ensureEl(id);
      scheduleHint();
      setCardLoading(id, true);
      try {
        el.volume = 0;
        await el.play();
        setCardLoading(id, false);
        fadeTo(id, state[id].volume * masterVol, FADE);
      } catch (e) { setCardLoading(id, false); }
      updateMediaSession();
    }

    function stopSound(id, fade = FADE) {
      const el = els[id];
      if (!el) return;
      fadeTo(id, 0, fade, () => { try { el.pause(); el.currentTime = 0; } catch (e) {} });
      updateMediaSession();
    }

    function setVolume(id, v, ramp = 0.08) {
      state[id].volume = v;
      if (els[id] && !els[id].paused) fadeTo(id, v * masterVol, ramp);
    }

    function setMasterVolume(v, seconds) {
      const from = masterVol, steps = Math.max(1, Math.round(seconds * 10));
      let i = 0;
      clearInterval(setMasterVolume._t);
      setMasterVolume._t = setInterval(() => {
        i++;
        masterVol = from + (v - from) * (i / steps);
        SOUNDS.forEach(s => {
          const el = els[s.id];
          if (el && !el.paused && !fades[s.id]) {
            try { el.volume = Math.max(0, Math.min(1, state[s.id].volume * masterVol)); } catch (e) {}
          }
        });
        if (i >= steps) clearInterval(setMasterVolume._t);
      }, seconds * 1000 / steps);
    }

    setInterval(() => {
      SOUNDS.forEach(s => {
        const el = els[s.id];
        if (state[s.id].active && el && el.paused) el.play().catch(() => {});
      });
    }, 3000);

    // ───────────────────────────────────────── Вкладки и сетки
    const tabsBox = document.getElementById('tabs');
    const panesBox = document.getElementById('panes');
    let activeCat = 0;

    // Первая вкладка — атмосферы, дальше склад звуков по категориям
    const TABS = [{ id: 'scenes' }, ...CATS];

    TABS.forEach((c, i) => {
      const tab = document.createElement('button');
      tab.className = 'tab' + (i === 0 ? ' active' : '');
      tab.dataset.cat = c.id;
      tab.addEventListener('click', () => showCat(i));
      tabsBox.appendChild(tab);

      const pane = document.createElement('div');
      pane.className = 'pane' + (i === 0 ? ' active' : '');

      if (c.id === 'scenes') {
        const box = document.createElement('div');
        box.className = 'scenes';
        SCENES.forEach(sc => {
          // Доступна, если открыт хотя бы один непустой слой сверх бесплатных
          const full = Object.keys(sc.mix).every(id => {
            const snd = SOUNDS.find(x => x.id === id);
            return snd && (snd.free || IS_PRO);
          });
          const b = document.createElement('button');
          b.className = 'scene' + (full ? '' : ' blocked');
          b.dataset.scene = sc.id;
          b.innerHTML =
            '<span class="ic">' + IC[sc.ic] + '</span>' +
            '<span class="txt"><span class="nm" data-sn="' + sc.id + '"></span>' +
            '<span class="ds" data-sd="' + sc.id + '"></span></span>' +
            (full ? '' : LOCK.replace('class="badge"', 'class="lk"'));
          b.addEventListener('click', () => playScene(sc, b, full));
          box.appendChild(b);
        });
        pane.appendChild(box);
        panesBox.appendChild(pane);
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'grid';
      pane.appendChild(grid);
      panesBox.appendChild(pane);

      c.sounds.forEach(s => {
        state[s.id] = { active: false, volume: s.def };
        const card = document.createElement('div');
        card.className = 'card' + (allowed(s) ? '' : ' blocked');
        card.id = 'card-' + s.id;
        const badge = !allowed(s) ? LOCK : (s.hp ? HP : '');
        card.innerHTML =
          '<div class="spinner"></div>' + badge +
          '<div class="card-icon">' + IC[s.id] + '</div>' +
          '<div class="card-name" data-name="' + s.id + '"></div>' +
          '<div class="slider-wrap"><input type="range" min="0" max="100" value="' +
            Math.round(s.def*100) + '" id="slider-' + s.id +
            '" style="--val: ' + Math.round(s.def*100) + '%"></div>';
        const sl = card.querySelector('input');
        sl.addEventListener('input', e => onSlider(s.id, e.target));
        sl.addEventListener('click', e => e.stopPropagation());
        sl.addEventListener('touchstart', e => e.stopPropagation());
        card.addEventListener('click', () => toggleSound(s.id));
        grid.appendChild(card);
      });
    });

    function showCat(i) {
      activeCat = Math.max(0, Math.min(TABS.length - 1, i));
      tabsBox.querySelectorAll('.tab').forEach((el, k) => el.classList.toggle('active', k === activeCat));
      panesBox.querySelectorAll('.pane').forEach((el, k) => el.classList.toggle('active', k === activeCat));
      const tab = tabsBox.children[activeCat];
      if (tab) tab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    // Листание свайпом
    let tx = 0, ty = 0;
    panesBox.addEventListener('touchstart', e => {
      tx = e.touches[0].clientX; ty = e.touches[0].clientY;
    }, { passive: true });
    panesBox.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tx;
      const dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.8) {
        showCat(activeCat + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });

    let activeScene = null;

    function playScene(sc, btn, full) {
      if (!full && !IS_PRO) {
        // Часть слоёв закрыта: даём послушать урезанную версию,
        // а через пару секунд показываем, чего не хватает
        setTimeout(() => { if (activeScene === sc.id) showPaywall(); }, 2500);
      }
      const same = activeScene === sc.id;
      document.querySelectorAll('.scene').forEach(x => x.classList.remove('active'));
      clearMixHighlight();
      if (same) { activeScene = null; stopAll(); return; }
      activeScene = sc.id;
      btn.classList.add('active');
      applyMix(sc.mix);
    }

    const setCardLoading = (id, on) => document.getElementById('card-'+id)?.classList.toggle('loading', on);
    const setCardActive  = (id, on) => document.getElementById('card-'+id)?.classList.toggle('active', on);

    function toggleSound(id) {
      const s = SOUNDS.find(x => x.id === id);
      if (!allowed(s)) { showPaywall(); return; }
      clearMixHighlight(); clearSceneHighlight();
      const st = state[id];
      st.active = !st.active;
      setCardActive(id, st.active);
      if (st.active) startSound(id); else stopSound(id);
      refreshStopBtn();
      saveLastMix();
    }

    let saveDebounce = null;
    function onSlider(id, el) {
      const s = SOUNDS.find(x => x.id === id);
      if (!allowed(s)) { el.value = 0; el.style.setProperty('--val','0%'); showPaywall(); return; }
      clearMixHighlight(); clearSceneHighlight();
      const v = el.value / 100;
      el.style.setProperty('--val', el.value + '%');
      setVolume(id, v);
      if (!state[id].active && v > 0) {
        state[id].active = true;
        setCardActive(id, true);
        startSound(id);
        refreshStopBtn();
      }
      clearTimeout(saveDebounce);
      saveDebounce = setTimeout(saveLastMix, 600);
    }

    // ───────────────────────────────────────── Свои миксы
    const STORE_KEY = 'tishina_v1', MAX_MIXES = 8;
    const loadStore = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {presets:[],last:null}; } catch(e){ return {presets:[],last:null}; } };
    const saveStore = d => { try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch(e){} };
    const saveLastMix = () => { const s = loadStore(); s.last = currentMix(); saveStore(s); };

    let activeMix = null;
    const clearMixHighlight = () => {
      activeMix = null;
      document.querySelectorAll('.mix-btn').forEach(b => b.classList.remove('active'));
    };

    function clearSceneHighlight() {
      activeScene = null;
      document.querySelectorAll('.scene').forEach(x => x.classList.remove('active'));
    }

    function currentMix() {
      const m = {};
      SOUNDS.forEach(s => { if (state[s.id].active) m[s.id] = Math.round(state[s.id].volume*100); });
      return m;
    }

    function applyMix(mix) {
      SOUNDS.forEach(s => {
        const vol = allowed(s) ? (mix[s.id] || 0) / 100 : 0;
        const sl = document.getElementById('slider-' + s.id);
        sl.value = Math.round(vol*100);
        sl.style.setProperty('--val', Math.round(vol*100) + '%');
        if (vol > 0) {
          state[s.id].volume = vol;
          if (!state[s.id].active) {
            state[s.id].active = true; setCardActive(s.id, true); startSound(s.id);
          } else setVolume(s.id, vol, FADE);
        } else if (state[s.id].active) {
          state[s.id].active = false; setCardActive(s.id, false); stopSound(s.id);
        }
      });
      refreshStopBtn();
      saveLastMix();
    }

    const mixesBox = document.getElementById('mixes');
    const addBtn = document.getElementById('btn-save-mix');

    function renderMixes() {
      mixesBox.querySelectorAll('.mix-btn:not(.add)').forEach(el => el.remove());
      loadStore().presets.forEach((p, i) => {
        const b = document.createElement('button');
        b.className = 'mix-btn';
        b.innerHTML = '<span></span><span class="del">×</span>';
        b.querySelector('span').textContent = p.name;
        b.addEventListener('click', e => {
          if (e.target.classList.contains('del')) {
            e.stopPropagation();
            const s = loadStore(); s.presets.splice(i,1); saveStore(s);
            renderMixes(); showToast(t('deleted')); return;
          }
          if (activeMix === i) { stopAll(); return; }
          document.querySelectorAll('.mix-btn').forEach(x => x.classList.remove('active'));
          activeMix = i; b.classList.add('active');
          applyMix(p.mix);
        });
        mixesBox.insertBefore(b, addBtn);
      });
    }

    const modal = document.getElementById('modal');
    const nameInput = document.getElementById('preset-name');

    addBtn.addEventListener('click', () => {
      if (!Object.keys(currentMix()).length) { showToast(t('needSounds')); return; }
      if (loadStore().presets.length >= MAX_MIXES) { showToast(t('maxPresets')); return; }
      document.getElementById('modal-hint').textContent =
        SOUNDS.filter(s => state[s.id].active).map(s => t('names')[s.id]).join(', ');
      nameInput.value = '';
      modal.classList.add('open');
      setTimeout(() => nameInput.focus(), 50);
    });

    const closeModal = () => modal.classList.remove('open');
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.getElementById('modal-ok').addEventListener('click', doSave);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSave(); });

    function doSave() {
      const name = nameInput.value.trim() || (lang === 'ru' ? 'Мой микс' : 'My mix');
      const s = loadStore();
      s.presets.push({ name, mix: currentMix() });
      saveStore(s);
      renderMixes(); closeModal();
      showToast(t('saved') + ': ' + name);
    }

    // ───────────────────────────────────────── Оживить
    let animateInterval = null;
    const btnAnimate = document.getElementById('btn-animate');
    btnAnimate.addEventListener('click', () => {
      if (animateInterval) {
        clearInterval(animateInterval); animateInterval = null;
        btnAnimate.classList.remove('active');
      } else {
        animateInterval = setInterval(animateStep, 4000);
        btnAnimate.classList.add('active');
        animateStep();
      }
    });

    function animateStep() {
      SOUNDS.forEach(s => {
        if (!state[s.id].active) return;
        const next = Math.min(0.98, Math.max(0.05, state[s.id].volume + (Math.random()-0.5)*0.35));
        setVolume(s.id, next, 3.5);
        const el = document.getElementById('slider-'+s.id);
        el.value = Math.round(next*100);
        el.style.setProperty('--val', Math.round(next*100) + '%');
      });
    }

    // ───────────────────────────────────────── Таймер
    let timerTimeout=null, fadeTimeout=null, timerTick=null, timerEnd=null;
    const btnTimer = document.getElementById('btn-timer');
    const timerMenu = document.getElementById('timer-menu');
    const timerDisplay = document.getElementById('timer-display');

    btnTimer.addEventListener('click', e => { e.stopPropagation(); timerMenu.classList.toggle('open'); });
    timerMenu.querySelectorAll('.timer-option').forEach(o => {
      o.addEventListener('click', () => {
        const m = parseInt(o.dataset.min, 10);
        timerMenu.classList.remove('open');
        if (m === 0) cancelTimer(); else setTimer(m);
      });
    });

    function setTimer(min) {
      clearTimers();
      const ms = min * 60000;
      timerEnd = Date.now() + ms;
      fadeTimeout = setTimeout(() => {
        timerDisplay.classList.add('fading');
        setMasterVolume(0.0001, TIMER_FADE);
      }, Math.max(0, ms - TIMER_FADE*1000));
      timerTimeout = setTimeout(() => {
        stopAll(); masterVol = 1; showToast(t('timerDone'));
      }, ms);
      btnTimer.classList.add('active');
      updateTimerDisplay();
      timerTick = setInterval(updateTimerDisplay, 1000);
    }

    function clearTimers() {
      [timerTimeout, fadeTimeout].forEach(x => x && clearTimeout(x));
      if (timerTick) clearInterval(timerTick);
      timerTimeout = fadeTimeout = timerTick = null;
    }

    function cancelTimer() {
      clearTimers();
      timerEnd = null;
      btnTimer.classList.remove('active');
      timerDisplay.textContent = '';
      timerDisplay.classList.remove('fading');
      if (masterVol < 1) setMasterVolume(1, 0.5);
    }

    function updateTimerDisplay() {
      if (!timerEnd) return;
      const left = timerEnd - Date.now();
      if (left <= 0) { timerDisplay.textContent = ''; return; }
      const m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
      timerDisplay.textContent = m + ':' + String(s).padStart(2,'0');
    }

    // ───────────────────────────────────────── Стоп / Поделиться
    const btnStop = document.getElementById('btn-stop');
    btnStop.addEventListener('click', stopAll);

    function stopAll() {
      SOUNDS.forEach(s => {
        if (state[s.id].active) {
          state[s.id].active = false; setCardActive(s.id, false); stopSound(s.id);
        }
      });
      if (animateInterval) { clearInterval(animateInterval); animateInterval = null; btnAnimate.classList.remove('active'); }
      clearMixHighlight(); clearSceneHighlight();
      cancelTimer();
      refreshStopBtn();
      saveLastMix();
    }

    const refreshStopBtn = () => { btnStop.disabled = !SOUNDS.some(s => state[s.id].active); };

    document.getElementById('btn-share').addEventListener('click', () => {
      const p = new URLSearchParams();
      SOUNDS.forEach(s => { if (state[s.id].active) p.set(s.id, Math.round(state[s.id].volume*100)); });
      const url = location.origin + location.pathname + (p.toString() ? '?' + p : '');
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(url).then(() => showToast(t('copied')), () => showToast(t('linkReady')));
      } else showToast(t('linkReady'));
    });

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2500);
    }

    // ───────────────────────────────────────── Шторка уведомлений
    function updateMediaSession() {
      if (!('mediaSession' in navigator)) return;
      const playing = SOUNDS.some(s => state[s.id].active);
      navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
      if (playing) {
        const brand = lang === 'ru' ? 'Тишина' : 'Tishina';
        const names = SOUNDS.filter(s => state[s.id].active).map(s => t('names')[s.id]).join(' · ');
        navigator.mediaSession.metadata = new MediaMetadata({
          title: names || brand, artist: brand, album: t('slogan')
        });
        try {
          navigator.mediaSession.setActionHandler('pause', stopAll);
          navigator.mediaSession.setActionHandler('stop', stopAll);
        } catch (e) {}
      }
    }

    function wake() {
      SOUNDS.forEach(s => {
        const el = els[s.id];
        if (state[s.id].active && el && el.paused) el.play().catch(() => {});
      });
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
    window.addEventListener('focus', wake);
    window.addEventListener('pageshow', wake);

    // ───────────────────────────────────────── Подсказка про фон на iPhone
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
               || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const inTelegram = !!TG?.initData || !!TG?.platform;
    const HINT_KEY = 'tishina_hint_bg';
    const hint = document.getElementById('hint');

    let hintTimer = null;
    function scheduleHint() {
      if (hintTimer || !isIOS || !inTelegram) return;
      try { if (localStorage.getItem(HINT_KEY)) return; } catch (e) {}
      hintTimer = setTimeout(() => {
        if (SOUNDS.some(s => state[s.id].active)) hint.classList.add('show');
      }, 20000);
    }

    function hideHint(forever) {
      hint.classList.remove('show');
      if (forever) { try { localStorage.setItem(HINT_KEY, '1'); } catch (e) {} }
    }

    document.getElementById('hint-close').addEventListener('click', () => hideHint(true));
    document.getElementById('hint-open').addEventListener('click', () => {
      const p = new URLSearchParams();
      SOUNDS.forEach(s => { if (state[s.id].active) p.set(s.id, Math.round(state[s.id].volume*100)); });
      if (IS_PRO) p.set('pro','1');
      p.set('lang', lang);
      const url = location.origin + location.pathname + '?' + p;
      hideHint(true);
      if (TG?.openLink) TG.openLink(url, { try_instant_view: false });
      else window.open(url, '_blank');
    });

    // ───────────────────────────────────────── Экран подписки
    //
    // Показываем в тот момент, когда человек упёрся в замок — тогда он
    // уже понимает, чего именно ему не хватает. Счёт открывается прямо
    // здесь: ссылку на него бот кладёт в адрес приложения.

    const INVOICE = QS.get('inv') || '';
    const payBox = document.getElementById('pay');

    function showPaywall() {
      const list = document.getElementById('pay-list');
      list.innerHTML = '';
      t('payRows').forEach(([head, sub]) => {
        const row = document.createElement('div');
        row.className = 'pay-row';
        row.innerHTML = '<span class="dot"></span><span class="rt"></span>';
        const rt = row.querySelector('.rt');
        rt.textContent = head;
        const sm = document.createElement('small');
        sm.textContent = sub;
        rt.appendChild(sm);
        list.appendChild(row);
      });
      document.getElementById('pay-title').textContent = t('payTitle');
      document.getElementById('pay-sub').textContent   = t('paySub');
      document.getElementById('pay-cta').textContent   = t('payCta');
      document.getElementById('pay-note').textContent  = t('payNote');
      document.getElementById('pay-close').textContent = t('payClose');
      payBox.classList.add('open');
    }

    const hidePaywall = () => payBox.classList.remove('open');
    document.getElementById('pay-close').addEventListener('click', hidePaywall);
    payBox.addEventListener('click', e => { if (e.target === payBox) hidePaywall(); });

    document.getElementById('pay-cta').addEventListener('click', () => {
      if (!INVOICE || !TG?.openInvoice) { showToast(t('payNoLink')); return; }
      TG.openInvoice(INVOICE, status => {
        if (status === 'paid') {
          hidePaywall();
          showToast('✓ Premium');
          // Открываем всё сразу, не дожидаясь перезапуска
          try { localStorage.setItem(PRO_KEY, String(UID)); } catch (e) {}
          setTimeout(() => location.reload(), 900);
        }
      });
    });

    // ───────────────────────────────────────── Первый экран
    //
    // Вместо шестнадцати ползунков человек видит один вопрос и через
    // пару секунд слышит результат. Показываем только новым — тем, у кого
    // ещё нет ни сохранённых миксов, ни прошлого состояния.

    const INTRO_KEY = 'tishina_intro';

    // Каждый сценарий — готовая атмосфера. Платные слои у бесплатных
    // просто не включатся, базовые останутся.
    const GOALS = [
      { id:'focus', mix:{ rain:48, cafe:34, softnoise:30, alpha:26, ambient:20 } },
      { id:'sleep', mix:{ rain:45, waves:38, deepnoise:32, delta:26 }, timer:45 },
      { id:'relax', mix:{ fire:40, bowl:42, waves:20, drone432:26, handpan:30 } },
      // Дождь здесь обязателен: без него у бесплатных сценарий молчит
      { id:'place', mix:{ train:50, window:32, rain:30, crowd:18 } },
    ];

    const intro = document.getElementById('intro');
    const goalsBox = document.getElementById('goals');

    GOALS.forEach(g => {
      const b = document.createElement('button');
      b.className = 'goal';
      b.dataset.goal = g.id;
      b.innerHTML = '<span></span><small></small>';
      b.addEventListener('click', () => {
        closeIntro();
        applyMix(g.mix);
        if (g.timer) setTimer(g.timer);
        // Показываем вкладку, где лежит первый звук сценария
        const first = Object.keys(g.mix).find(id => {
          const s = SOUNDS.find(x => x.id === id);
          return s && allowed(s);
        });
        if (first) {
          const s = SOUNDS.find(x => x.id === first);
          const ci = CATS.findIndex(c => c.id === s.cat);
          if (ci >= 0) showCat(ci);
        }
      });
      goalsBox.appendChild(b);
    });

    function closeIntro() {
      intro.classList.remove('show');
      try { localStorage.setItem(INTRO_KEY, '1'); } catch (e) {}
    }
    document.getElementById('intro-skip').addEventListener('click', closeIntro);

    function maybeShowIntro() {
      // ?intro=1 — показать принудительно, чтобы можно было проверить
      if (QS.get('intro') === '1') { intro.classList.add('show'); return true; }
      try { if (localStorage.getItem(INTRO_KEY)) return false; } catch (e) {}
      const st = loadStore();
      if (st.presets.length || (st.last && Object.keys(st.last).length)) return false;
      intro.classList.add('show');
      return true;
    }

    // ───────────────────────────────────────── Язык
    function applyLang() {
      document.documentElement.lang = lang;
      document.getElementById('brand').textContent = lang === 'ru' ? 'тишина' : 'tishina';
      document.title = lang === 'ru' ? 'Тишина' : 'Tishina';
      document.getElementById('slogan').textContent = t('slogan');
      const lb = document.getElementById('lang');
      lb.textContent = lang === 'ru' ? '🇺🇸' : '🪆';
      lb.title = lang === 'ru' ? 'English' : 'Русский';

      tabsBox.querySelectorAll('.tab').forEach(el => { el.textContent = t(el.dataset.cat); });
      document.querySelectorAll('[data-sn]').forEach(el => { el.textContent = t('sc')[el.dataset.sn][0]; });
      document.querySelectorAll('[data-sd]').forEach(el => { el.textContent = t('sc')[el.dataset.sd][1]; });
      document.querySelectorAll('[data-name]').forEach(el => { el.textContent = t('names')[el.dataset.name]; });

      btnAnimate.textContent = t('animate');
      btnTimer.textContent   = t('timer');
      btnStop.textContent    = t('stop');
      document.getElementById('btn-share').textContent = t('share');

      timerMenu.querySelectorAll('.timer-option').forEach(o => {
        o.textContent = o.dataset.min === '0' ? t('cancel') : o.dataset.min + ' ' + t('min');
      });

      document.getElementById('intro-brand').textContent = lang === 'ru' ? 'тишина' : 'tishina';
      document.getElementById('intro-ask').textContent   = t('ask');
      document.getElementById('intro-sub').innerText     = t('askSub');
      document.getElementById('intro-skip').textContent  = t('skip');
      goalsBox.querySelectorAll('.goal').forEach(b => {
        const k = b.dataset.goal;
        const cap = k.charAt(0).toUpperCase() + k.slice(1);
        b.querySelector('span').textContent  = t('go' + cap);
        b.querySelector('small').textContent = t('go' + cap + 'Sub');
      });

      document.getElementById('hint-text').innerHTML    = t('hintText');
      document.getElementById('hint-open').textContent  = t('hintOpen');
      document.getElementById('hint-close').textContent = t('hintClose');

      document.getElementById('modal-title').textContent  = t('saveTitle');
      document.getElementById('modal-cancel').textContent = t('cancel');
      document.getElementById('modal-ok').textContent     = t('save');
      nameInput.placeholder = t('namePh');
    }

    document.getElementById('lang').addEventListener('click', () => {
      lang = lang === 'ru' ? 'en' : 'ru';
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
      applyLang();
      updateMediaSession();
    });

    applyLang();
    renderMixes();

    // ───────────────────────────────────────── Восстановление
    let shown = false;
    (() => {
      let mix = {}, fromUrl = false;
      SOUNDS.forEach(s => {
        const v = QS.get(s.id);
        if (v === null) return;
        const n = Math.max(0, Math.min(100, parseInt(v,10) || 0));
        if (n > 0) { mix[s.id] = n; fromUrl = true; }
      });
      if (!fromUrl) {
        const last = loadStore().last;
        if (last && Object.keys(last).length) mix = last;
      }
      if (!Object.keys(mix).length) return;
      shown = true;

      let firstCat = -1;
      SOUNDS.forEach(s => {
        const v = (mix[s.id] || 0) / 100;
        if (v <= 0 || !allowed(s)) return;
        state[s.id] = { active: true, volume: v };
        const sl = document.getElementById('slider-' + s.id);
        sl.value = Math.round(v*100);
        sl.style.setProperty('--val', Math.round(v*100) + '%');
        setCardActive(s.id, true);
        const ci = CATS.findIndex(c => c.id === s.cat);
        if (firstCat < 0 || ci < firstCat) firstCat = ci;
      });
      if (firstCat > 0) showCat(firstCat);
      refreshStopBtn();

      document.addEventListener('pointerdown', () => {
        SOUNDS.forEach(s => { if (state[s.id].active) startSound(s.id); });
        refreshStopBtn();
      }, { once: true });

      showToast(fromUrl ? t('tapToStart') : t('lastMix'));
      shown = true;
    })();

    // Новому человеку показываем вопрос вместо пустой сетки
    if (!shown || QS.get('intro') === '1') maybeShowIntro();

    document.addEventListener('click', e => {
      if (!e.target.closest('.timer-wrap')) timerMenu.classList.remove('open');
    });

  })();
  </script>
</body>
</html>
