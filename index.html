<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Тишина</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #0c0b09;
      --card-active: #17130a;
      --line: #221d13;
      --accent: #d0a94e;
      --accent-soft: rgba(208, 169, 78, 0.24);
      --text: #ece3cf;
      --text-dim: #7c756a;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 26px 16px 14px;
      position: relative;
    }
    header .title {
      font-size: 15px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: lowercase;
    }
    header .slogan {
      margin-top: 6px;
      font-size: 12.5px;
      color: var(--text-dim);
      letter-spacing: 0.3px;
    }

    /* Переключатель языка */
    #lang {
      position: absolute;
      top: 18px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: transparent;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, transform 0.1s;
    }
    #lang:active { transform: scale(0.9); }
    #lang:hover { border-color: var(--accent); }

    .presets {
      display: flex;
      gap: 8px;
      padding: 8px 14px 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .presets::-webkit-scrollbar { display: none; }

    .preset-btn {
      flex-shrink: 0;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: transparent;
      color: var(--text-dim);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.2px;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
    }
    .preset-btn:active { transform: scale(0.95); }
    .preset-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .preset-btn.custom { padding-right: 30px; position: relative; }
    .preset-btn.custom .del {
      position: absolute; right: 7px; top: 50%;
      transform: translateY(-50%);
      width: 17px; height: 17px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; line-height: 1;
      color: var(--text-dim);
      background: rgba(255,255,255,0.05);
      transition: background 0.2s, color 0.2s;
    }
    .preset-btn.custom .del:active { background: #7a2c2c; color: #fff; }

    .preset-btn.add {
      padding: 8px 14px;
      font-size: 15px;
      line-height: 1;
      color: var(--accent);
      border-style: dashed;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px;
      padding: 10px 14px 0;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 16px 9px 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.35s, background 0.35s, box-shadow 0.35s, opacity 0.3s;
      user-select: none;
      position: relative;
    }
    .card.active {
      background: var(--card-active);
      border-color: var(--accent);
      box-shadow: 0 0 22px var(--accent-soft);
    }
    .card.blocked { opacity: 0.5; }

    .card-icon {
      width: 26px; height: 26px;
      color: var(--text-dim);
      transition: color 0.35s, transform 0.35s;
      display: flex; align-items: center; justify-content: center;
    }
    .card-icon svg { width: 100%; height: 100%; }
    .card.active .card-icon { color: var(--accent); transform: scale(1.06); }

    .card.loading .card-icon { opacity: 0.15; }
    .card .spinner {
      display: none;
      position: absolute; top: 16px;
      width: 22px; height: 22px;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .card.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Значки: наушники и замок */
    .card .badge {
      position: absolute; top: 7px; right: 8px;
      width: 11px; height: 11px;
      color: var(--text-dim);
      opacity: 0.55;
    }
    .card.active .badge { color: var(--accent); opacity: 1; }

    .card-name {
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      font-weight: 500;
      letter-spacing: 0.2px;
      transition: color 0.35s;
      line-height: 1.2;
      min-height: 26px;
      display: flex;
      align-items: center;
    }
    .card.active .card-name { color: var(--text); }

    .slider-wrap { width: 100%; padding: 0 2px; }

    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 3px;
      border-radius: 2px; outline: none; cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.35s;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--val, 0%), var(--line) var(--val, 0%), var(--line) 100%);
    }
    .card.active input[type=range] { opacity: 1; }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--accent); cursor: pointer;
      box-shadow: 0 0 6px var(--accent-soft);
    }
    input[type=range]::-moz-range-thumb {
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
    }

    /* Полоса, раскрывающая дополнительные звуки */
    .more-bar {
      margin: 16px 14px 0;
      padding: 11px 0;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 11.5px;
      letter-spacing: 0.3px;
      opacity: 0.7;
      transition: opacity 0.25s, color 0.25s;
      user-select: none;
    }
    .more-bar:hover { opacity: 1; color: var(--text); }
    .more-bar svg {
      width: 13px; height: 13px;
      transition: transform 0.3s;
    }
    .more-bar.open svg { transform: rotate(180deg); }

    #extra {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }
    #extra.open { max-height: 900px; }

    #timer-display {
      text-align: center;
      font-size: 12px;
      color: var(--accent);
      height: 18px;
      margin-top: 12px;
      letter-spacing: 1px;
    }
    #timer-display.fading { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .controls {
      display: flex;
      gap: 8px;
      padding: 8px 14px 26px;
      justify-content: center;
      margin-top: auto;
    }

    .btn {
      flex: 1;
      max-width: 110px;
      padding: 12px 0;
      border: 1px solid var(--line);
      border-radius: 13px;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.2px;
      cursor: pointer;
      background: transparent;
      color: var(--text-dim);
      transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.1s, opacity 0.25s;
    }
    .btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.35; cursor: default; }

    .timer-wrap { position: relative; flex: 1; max-width: 110px; display: flex; }
    .timer-wrap .btn { width: 100%; max-width: none; }

    .timer-menu {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #0c0b09;
      border: 1px solid var(--line);
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,0.6);
      z-index: 100;
      min-width: 140px;
    }
    .timer-menu.open { display: block; }

    .timer-option {
      padding: 12px 20px;
      font-size: 14px;
      cursor: pointer;
      color: var(--text);
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }
    .timer-option:hover, .timer-option:active { background: var(--accent); color: #000; }
    .timer-option.cancel-opt { color: var(--text-dim); border-top: 1px solid var(--line); }
    .timer-option.cancel-opt:hover { background: var(--line); color: var(--text); }

    #modal {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 300;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    #modal.open { display: flex; }

    .modal-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px 20px 18px;
      width: 100%; max-width: 320px;
    }
    .modal-title { font-size: 14px; color: var(--text); margin-bottom: 4px; font-weight: 500; }
    .modal-hint { font-size: 11.5px; color: var(--text-dim); margin-bottom: 14px; line-height: 1.4; }
    #preset-name {
      width: 100%;
      padding: 11px 13px;
      background: #000;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      margin-bottom: 14px;
    }
    #preset-name:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions .btn { max-width: none; }

    /* Подсказка про фоновое воспроизведение на iOS */
    #hint {
      display: none;
      margin: 0 14px 10px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--text-dim);
      position: relative;
    }
    #hint.show { display: block; }
    #hint b { color: var(--text); font-weight: 500; }
    #hint .row { display: flex; gap: 8px; margin-top: 10px; }
    #hint button {
      flex: 1;
      padding: 9px 0;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text-dim);
      font-size: 11.5px;
      font-family: inherit;
      cursor: pointer;
    }
    #hint button.main { background: var(--accent); color: #000; border-color: var(--accent); }

    #toast {
      position: fixed;
      bottom: 92px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--accent);
      color: #000;
      padding: 10px 22px;
      border-radius: 22px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 200;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <div class="title" id="brand">тишина</div>
    <div class="slogan" id="slogan"></div>
    <button id="lang" title="Language"></button>
  </header>

  <div class="presets" id="presets">
    <button class="preset-btn" data-preset="focus"></button>
    <button class="preset-btn" data-preset="sleep"></button>
    <button class="preset-btn" data-preset="meditation"></button>
    <button class="preset-btn" data-preset="cafe"></button>
    <button class="preset-btn" data-preset="deep"></button>
    <span id="custom-slot"></span>
    <button class="preset-btn add" id="btn-save-preset">＋</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="more-bar" id="more-bar">
    <span id="more-label"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </div>
  <div id="extra"><div class="grid" id="grid-extra"></div></div>

  <div id="hint">
    <span id="hint-text"></span>
    <div class="row">
      <button id="hint-open" class="main"></button>
      <button id="hint-close"></button>
    </div>
  </div>

  <div id="timer-display"></div>

  <div class="controls">
    <button class="btn" id="btn-animate"></button>
    <div class="timer-wrap">
      <button class="btn" id="btn-timer"></button>
      <div class="timer-menu" id="timer-menu">
        <div class="timer-option" data-min="15"></div>
        <div class="timer-option" data-min="30"></div>
        <div class="timer-option" data-min="45"></div>
        <div class="timer-option" data-min="60"></div>
        <div class="timer-option cancel-opt" data-min="0"></div>
      </div>
    </div>
    <button class="btn" id="btn-stop" disabled></button>
    <button class="btn" id="btn-share"></button>
  </div>

  <div id="modal">
    <div class="modal-box">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-hint" id="modal-hint"></div>
      <input type="text" id="preset-name" maxlength="18" autocomplete="off">
      <div class="modal-actions">
        <button class="btn" id="modal-cancel"></button>
        <button class="btn active" id="modal-ok"></button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
  (() => {
    'use strict';

    const TG = window.Telegram?.WebApp;
    if (TG) {
      TG.expand();
      try { TG.setBackgroundColor('#000000'); TG.setHeaderColor('#000000'); } catch (e) {}
      try { TG.disableVerticalSwipes(); } catch (e) {}
    }

    // Платные звуки открывает бот через ?pro=1. Запоминаем это,
    // потому что Telegram может открыть приложение из кэша — без параметра.
    const QS = new URLSearchParams(location.search);
    const UID = TG?.initDataUnsafe?.user?.id || 0;
    const PRO_KEY = 'tishina_pro';

    const IS_PRO = (() => {
      const flag = QS.get('pro');

      if (flag === '1') {
        try { localStorage.setItem(PRO_KEY, String(UID)); } catch (e) {}
        return true;
      }
      if (flag === '0') {          // бот сказал: доступа больше нет
        try { localStorage.removeItem(PRO_KEY); } catch (e) {}
        return false;
      }
      // Параметра нет — открыли из кэша. Вспоминаем прошлый ответ бота.
      try {
        const saved = localStorage.getItem(PRO_KEY);
        if (saved !== null && String(UID) === saved) return true;
      } catch (e) {}
      return false;
    })();

    // ───────────────────────────────────────── Языки
    const I18N = {
      ru: {
        slogan: 'Включи фоновое спокойствие',
        focus: 'Фокус', sleep: 'Сон', meditation: 'Медитация',
        cafe: 'Кафе', deep: 'Глубокий фокус',
        animate: 'Оживить', timer: 'Таймер', stop: 'Стоп', share: 'Поделиться',
        min: 'мин', cancel: 'Отмена', save: 'Сохранить',
        saveTitle: 'Сохранить микс', namePh: 'Например: Вечер',
        more: 'Ещё звуки', less: 'Свернуть',
        copied: '✓ Ссылка скопирована', linkReady: '✓ Ссылка готова',
        saved: '✓ Сохранено', deleted: 'Пресет удалён',
        needSounds: 'Сначала включите звуки', maxPresets: 'Максимум 8 пресетов',
        loadFail: 'Не удалось загрузить звук',
        timerDone: 'Таймер завершён',
        tapToStart: 'Коснитесь экрана для запуска',
        lastMix: 'Ваш последний микс — коснитесь экрана',
        locked: 'Доступно по подписке',
        headphones: 'Нужны наушники',
        hintText: 'Внутри Telegram на iPhone звук выключается, когда гаснет экран — так устроена сама система. <b>Откройте в браузере</b>, и он продолжит играть с заблокированным экраном.',
        hintOpen: 'Открыть в браузере',
        hintClose: 'Не сейчас',
        names: {
          rain:'Дождь', thunder:'Гром', waves:'Волны', wind:'Ветер', fire:'Огонь',
          birds:'Птицы', handpan:'Хендпан', didgeridoo:'Диджериду', ambient:'Эмбиент',
          softnoise:'Мягкий шум', deepnoise:'Низкий гул', bowl:'Чаша', drone432:'432 Гц',
          alpha:'Альфа 10 Гц', theta:'Тета 6 Гц', delta:'Дельта 2 Гц'
        }
      },
      en: {
        slogan: 'Turn on background calm',
        focus: 'Focus', sleep: 'Sleep', meditation: 'Meditation',
        cafe: 'Cafe', deep: 'Deep focus',
        animate: 'Animate', timer: 'Timer', stop: 'Stop', share: 'Share',
        min: 'min', cancel: 'Cancel', save: 'Save',
        saveTitle: 'Save mix', namePh: 'For example: Evening',
        more: 'More sounds', less: 'Collapse',
        copied: '✓ Link copied', linkReady: '✓ Link ready',
        saved: '✓ Saved', deleted: 'Preset deleted',
        needSounds: 'Turn on some sounds first', maxPresets: 'Maximum 8 presets',
        loadFail: 'Could not load sound',
        timerDone: 'Timer finished',
        tapToStart: 'Tap the screen to start',
        lastMix: 'Your last mix — tap to play',
        locked: 'Available with subscription',
        headphones: 'Headphones needed',
        hintText: 'Inside Telegram on iPhone the sound stops when the screen turns off — that is how the system works. <b>Open in a browser</b> and it will keep playing with the screen locked.',
        hintOpen: 'Open in browser',
        hintClose: 'Not now',
        names: {
          rain:'Rain', thunder:'Thunder', waves:'Waves', wind:'Wind', fire:'Fire',
          birds:'Birds', handpan:'Handpan', didgeridoo:'Didgeridoo', ambient:'Ambient',
          softnoise:'Soft noise', deepnoise:'Deep hum', bowl:'Singing bowl', drone432:'432 Hz',
          alpha:'Alpha 10 Hz', theta:'Theta 6 Hz', delta:'Delta 2 Hz'
        }
      }
    };

    const LANG_KEY = 'tishina_lang';
    function detectLang() {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved && I18N[saved]) return saved;
      const code = TG?.initDataUnsafe?.user?.language_code || navigator.language || 'en';
      return code.startsWith('ru') ? 'ru' : 'en';
    }
    let lang = detectLang();
    const t = k => I18N[lang][k];

    // ───────────────────────────────────────── Иконки
    const IC = {
      rain:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5a3.8 3.8 0 0 1 .7-7.5A5 5 0 0 1 17 5.2a3.4 3.4 0 0 1 1 6.6"/><path d="M8 16l-1 2.5M12 16l-1 2.5M16 16l-1 2.5"/></svg>',
      thunder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12a3.8 3.8 0 0 1 .7-7.5A5 5 0 0 1 17 4.7a3.4 3.4 0 0 1 1 6.6"/><path d="M12 13l-2.2 3.2h2.8L10.4 20"/></svg>',
      waves: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10c1.8 0 1.8-2 3.7-2s1.9 2 3.7 2 1.8-2 3.7-2 1.9 2 3.7 2"/><path d="M3 15c1.8 0 1.8-2 3.7-2s1.9 2 3.7 2 1.8-2 3.7-2 1.9 2 3.7 2"/></svg>',
      wind:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h9a2.4 2.4 0 1 0-2.4-2.4"/><path d="M4 12h13a2.4 2.4 0 1 1-2.4 2.4"/><path d="M4 16h7"/></svg>',
      fire:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3.2 3.2 4.8 5.8 4.8 8.7A4.8 4.8 0 0 1 7.2 12c0-1.7.8-3 1.9-4 .1 1.3.8 2.2 1.7 2.6.3-2.4-.8-4.9 1.2-7.6z"/></svg>',
      birds: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10c1.6-2.2 3.2-2.2 4.8 0"/><path d="M13 8c1.8-2.4 3.4-2.4 5.2 0"/></svg>',
      handpan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="1.4"/><path d="M12 5.5v1.6M12 16.9v1.6M5.5 12h1.6M16.9 12h1.6"/></svg>',
      didgeridoo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5 16 8a2.1 2.1 0 0 1 3 3L7.5 22.5"/><path d="M13.5 10.5l3 3M15.5 8.5l3 3"/></svg>',
      ambient:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.3"/><circle cx="12" cy="12" r="6.6" opacity="0.5"/></svg>',
      softnoise:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 12h2M7 9v6M11 6.5v11M15 9v6M19 11v2"/></svg>',
      deepnoise:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 12h2M7 10.5v3M11 8v8M15 5v14M19 9.5v5"/></svg>',
      bowl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10c0 5 3.6 8 8 8s8-3 8-8"/><path d="M2.5 10h19"/><path d="M9 5.5c1-1.5 5-1.5 6 0" opacity="0.5"/></svg>',
      drone432:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.4M12 18.1v2.4M3.5 12h2.4M18.1 12h2.4" opacity="0.6"/><circle cx="12" cy="12" r="8" opacity="0.3"/></svg>',
      alpha:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c1.5-4 3-4 4.5 0s3 4 4.5 0 3-4 4.5 0 3 4 4.5 0"/></svg>',
      theta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2.5-5 5-5 7.5 0s5 5 7.5 0"/><path d="M18 12c1 2 2 2 3 0" opacity="0.5"/></svg>',
      delta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c4-7 8-7 12 0s6 5 8 0"/></svg>'
    };

    const HP_ICON = '<svg class="badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13.5" width="4" height="7" rx="1.6"/><rect x="17.5" y="13.5" width="4" height="7" rx="1.6"/></svg>';
    const LOCK_ICON = '<svg class="badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="11" rx="2.2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>';

    // free — девять базовых, остальные под раскрывающейся полосой
    const SOUNDS = [
      { id: 'rain',       file: 'rain.mp3',       icon: IC.rain,       def: 0.70, free: true },
      { id: 'thunder',    file: 'thunder.mp3',    icon: IC.thunder,    def: 0.50, free: true },
      { id: 'waves',      file: 'waves.mp3',      icon: IC.waves,      def: 0.60, free: true },
      { id: 'wind',       file: 'wind.mp3',       icon: IC.wind,       def: 0.50, free: true },
      { id: 'fire',       file: 'fire.mp3',       icon: IC.fire,       def: 0.60, free: true },
      { id: 'birds',      file: 'birds.mp3',      icon: IC.birds,      def: 0.55, free: true },
      { id: 'handpan',    file: 'handpan.mp3',    icon: IC.handpan,    def: 0.50, free: true },
      { id: 'didgeridoo', file: 'didgeridoo.mp3', icon: IC.didgeridoo, def: 0.20, free: true },
      { id: 'ambient',    file: 'ambient.mp3',    icon: IC.ambient,    def: 0.25, free: true },

      { id: 'softnoise',  file: 'softnoise.mp3',  icon: IC.softnoise,  def: 0.45 },
      { id: 'deepnoise',  file: 'deepnoise.mp3',  icon: IC.deepnoise,  def: 0.40 },
      { id: 'bowl',       file: 'bowl.mp3',       icon: IC.bowl,       def: 0.35 },
      { id: 'drone432',   file: 'drone432.mp3',   icon: IC.drone432,   def: 0.30 },
      { id: 'alpha',      file: 'alpha.mp3',      icon: IC.alpha,      def: 0.35, headphones: true },
      { id: 'theta',      file: 'theta.mp3',      icon: IC.theta,      def: 0.35, headphones: true },
      { id: 'delta',      file: 'delta.mp3',      icon: IC.delta,      def: 0.35, headphones: true },
    ];

    const isFree = s => !!s.free;
    const allowed = s => isFree(s) || IS_PRO;

    const PRESETS = {
      focus:      { rain: 55, wind: 18, birds: 25, ambient: 30, softnoise: 40, alpha: 30 },
      sleep:      { rain: 50, thunder: 12, waves: 40, ambient: 45, deepnoise: 35, delta: 30 },
      meditation: { waves: 20, fire: 18, handpan: 50, didgeridoo: 25, bowl: 45, drone432: 35, theta: 28 },
      cafe:       { rain: 40, wind: 15, fire: 55, birds: 35, handpan: 20, ambient: 25 },
      deep:       { deepnoise: 55, softnoise: 25, drone432: 20, alpha: 35 },
    };
    const PRESET_ICON = { focus:'🎯', sleep:'🌙', meditation:'🧘', cafe:'☕', deep:'🎧' };

    const FADE = 0.4, TIMER_FADE = 30;

    // ───────────────────────────────────────── Аудио
    // Воспроизведение — на обычных медиаэлементах, а не Web Audio.
    // iOS приостанавливает Web Audio при блокировке экрана, а <audio>
    // считает медиаплеером и продолжает играть с погашенным экраном.
    const els = {}, state = {}, fades = {};
    let masterVol = 1;                // общая громкость (нужна таймеру)

    // Safari лупит AAC без разрыва, mp3 оставляем как запасной вариант
    const canAAC = (() => {
      const a = document.createElement('audio');
      return !!a.canPlayType('audio/mp4; codecs="mp4a.40.2"');
    })();
    const fileFor = s => canAAC ? s.file.replace('.mp3', '.m4a') : s.file;

    function ensureEl(id) {
      if (els[id]) return els[id];
      const s = SOUNDS.find(x => x.id === id);
      const el = new Audio();
      el.src = fileFor(s);
      el.loop = true;
      el.preload = 'auto';
      el.volume = 0;
      el.setAttribute('playsinline', '');
      el.addEventListener('waiting', () => setCardLoading(id, true));
      el.addEventListener('playing', () => setCardLoading(id, false));
      el.addEventListener('canplaythrough', () => setCardLoading(id, false));
      el.addEventListener('error', () => {
        // AAC мог не залиться — молча пробуем mp3, и только потом сдаёмся
        if (!el.dataset.fellBack && el.src.endsWith('.m4a')) {
          el.dataset.fellBack = '1';
          el.src = s.file;
          el.load();
          if (state[id].active) el.play().catch(() => {});
          return;
        }
        setCardLoading(id, false);
        showToast(t('loadFail'));
      });
      els[id] = el;
      return el;
    }

    /** Плавное изменение громкости. Через setInterval, потому что
        requestAnimationFrame в фоне останавливается. */
    function fadeTo(id, target, seconds, onDone) {
      const el = els[id];
      if (!el) return;
      clearInterval(fades[id]);
      const from = el.volume, steps = Math.max(1, Math.round(seconds * 20));
      let i = 0;
      fades[id] = setInterval(() => {
        i++;
        const v = from + (target - from) * (i / steps);
        try { el.volume = Math.max(0, Math.min(1, v)); } catch (e) {}
        if (i >= steps) {
          clearInterval(fades[id]);
          delete fades[id];
          if (onDone) onDone();
        }
      }, seconds * 1000 / steps);
    }

    const ensureCtx = () => {};   // осталось от прежнего движка, вызовы безвредны

    async function startSound(id) {
      const el = ensureEl(id);
      setCardLoading(id, true);
      try {
        el.volume = 0;
        await el.play();
        setCardLoading(id, false);
        fadeTo(id, state[id].volume * masterVol, FADE);
      } catch (e) {
        setCardLoading(id, false);
      }
      updateMediaSession();
    }

    function stopSound(id, fade = FADE) {
      const el = els[id];
      if (!el) return;
      fadeTo(id, 0, fade, () => { try { el.pause(); el.currentTime = 0; } catch (e) {} });
      updateMediaSession();
    }

    function setVolume(id, v, ramp = 0.08) {
      state[id].volume = v;
      if (els[id] && !els[id].paused) fadeTo(id, v * masterVol, ramp);
    }

    /** Общая громкость — для плавного затухания по таймеру. */
    function setMasterVolume(v, seconds) {
      const from = masterVol, steps = Math.max(1, Math.round(seconds * 10));
      let i = 0;
      clearInterval(setMasterVolume._t);
      setMasterVolume._t = setInterval(() => {
        i++;
        masterVol = from + (v - from) * (i / steps);
        SOUNDS.forEach(s => {
          const el = els[s.id];
          if (el && !el.paused && !fades[s.id]) {
            try { el.volume = Math.max(0, Math.min(1, state[s.id].volume * masterVol)); } catch (e) {}
          }
        });
        if (i >= steps) clearInterval(setMasterVolume._t);
      }, seconds * 1000 / steps);
    }

    // Если система всё же приостановила воспроизведение — возвращаем
    setInterval(() => {
      SOUNDS.forEach(s => {
        const el = els[s.id];
        if (state[s.id].active && el && el.paused) el.play().catch(() => {});
      });
    }, 3000);

    // ───────────────────────────────────────── Сетки
    const gridFree  = document.getElementById('grid');
    const gridExtra = document.getElementById('grid-extra');

    SOUNDS.forEach(s => {
      state[s.id] = { active: false, volume: s.def };

      const card = document.createElement('div');
      card.className = 'card' + (allowed(s) ? '' : ' blocked');
      card.id = 'card-' + s.id;

      const badge = !allowed(s) ? LOCK_ICON : (s.headphones ? HP_ICON : '');
      card.innerHTML =
        '<div class="spinner"></div>' + badge +
        '<div class="card-icon">' + s.icon + '</div>' +
        '<div class="card-name" data-name="' + s.id + '"></div>' +
        '<div class="slider-wrap">' +
          '<input type="range" min="0" max="100" value="' + Math.round(s.def*100) + '"' +
          ' id="slider-' + s.id + '" style="--val: ' + Math.round(s.def*100) + '%">' +
        '</div>';

      const slider = card.querySelector('input');
      slider.addEventListener('input', e => onSlider(s.id, e.target));
      slider.addEventListener('click', e => e.stopPropagation());
      slider.addEventListener('touchstart', e => e.stopPropagation());

      card.addEventListener('click', () => toggleSound(s.id));
      (isFree(s) ? gridFree : gridExtra).appendChild(card);
    });

    const setCardLoading = (id, on) => document.getElementById('card-'+id).classList.toggle('loading', on);
    const setCardActive  = (id, on) => document.getElementById('card-'+id).classList.toggle('active', on);

    function toggleSound(id) {
      const s = SOUNDS.find(x => x.id === id);
      if (!allowed(s)) { showToast(t('locked')); return; }
      clearPresetHighlight();
      const st = state[id];
      st.active = !st.active;
      setCardActive(id, st.active);
      if (st.active) startSound(id); else stopSound(id);
      refreshStopBtn();
      saveLastMix();
    }

    let saveDebounce = null;
    function onSlider(id, el) {
      const s = SOUNDS.find(x => x.id === id);
      if (!allowed(s)) { el.value = 0; el.style.setProperty('--val','0%'); showToast(t('locked')); return; }
      clearPresetHighlight();
      const v = el.value / 100;
      el.style.setProperty('--val', el.value + '%');
      setVolume(id, v);
      if (!state[id].active && v > 0) {
        state[id].active = true;
        setCardActive(id, true);
        startSound(id);
        refreshStopBtn();
      }
      clearTimeout(saveDebounce);
      saveDebounce = setTimeout(saveLastMix, 600);
    }

    // ───────────────────────────────────────── Полоса «Ещё звуки»
    const moreBar = document.getElementById('more-bar');
    const extra = document.getElementById('extra');
    moreBar.addEventListener('click', () => {
      const open = extra.classList.toggle('open');
      moreBar.classList.toggle('open', open);
      document.getElementById('more-label').textContent = open ? t('less') : t('more');
    });

    // ───────────────────────────────────────── Пресеты
    let activePreset = null;

    function applyMix(mix) {
      ensureCtx();
      SOUNDS.forEach(s => {
        const raw = mix[s.id] || 0;
        const vol = allowed(s) ? raw / 100 : 0;   // платные молчат без подписки
        const slider = document.getElementById('slider-' + s.id);
        slider.value = Math.round(vol * 100);
        slider.style.setProperty('--val', Math.round(vol * 100) + '%');

        if (vol > 0) {
          state[s.id].volume = vol;
          if (!state[s.id].active) {
            state[s.id].active = true;
            setCardActive(s.id, true);
            startSound(s.id);
          } else setVolume(s.id, vol, FADE);
        } else if (state[s.id].active) {
          state[s.id].active = false;
          setCardActive(s.id, false);
          stopSound(s.id);
        }
      });
      refreshStopBtn();
      saveLastMix();
    }

    function currentMix() {
      const mix = {};
      SOUNDS.forEach(s => { if (state[s.id].active) mix[s.id] = Math.round(state[s.id].volume * 100); });
      return mix;
    }

    function clearPresetHighlight() {
      activePreset = null;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    }

    document.querySelectorAll('.preset-btn[data-preset]').forEach(btn => {
      btn.addEventListener('click', () => {
        const name = btn.dataset.preset;
        if (activePreset === name) { stopAll(); return; }
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        activePreset = name;
        btn.classList.add('active');
        applyMix(PRESETS[name]);
      });
    });

    // ───────────────────────────────────────── Свои пресеты
    const STORE_KEY = 'tishina_v1', MAX_PRESETS = 8;
    const loadStore = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {presets:[],last:null}; } catch(e){ return {presets:[],last:null}; } };
    const saveStore = d => { try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch(e){} };
    function saveLastMix() { const s = loadStore(); s.last = currentMix(); saveStore(s); }

    function renderCustomPresets() {
      const slot = document.getElementById('custom-slot');
      slot.innerHTML = '';
      loadStore().presets.forEach((p, i) => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn custom';
        btn.innerHTML = '<span class="lbl"></span><span class="del">×</span>';
        btn.querySelector('.lbl').textContent = p.name;
        btn.addEventListener('click', e => {
          if (e.target.classList.contains('del')) {
            e.stopPropagation();
            const s = loadStore(); s.presets.splice(i,1); saveStore(s);
            renderCustomPresets(); showToast(t('deleted')); return;
          }
          if (activePreset === 'custom-'+i) { stopAll(); return; }
          document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
          activePreset = 'custom-'+i;
          btn.classList.add('active');
          applyMix(p.mix);
        });
        slot.appendChild(btn);
      });
    }

    const modal = document.getElementById('modal');
    const nameInput = document.getElementById('preset-name');

    document.getElementById('btn-save-preset').addEventListener('click', () => {
      const mix = currentMix();
      if (!Object.keys(mix).length) { showToast(t('needSounds')); return; }
      if (loadStore().presets.length >= MAX_PRESETS) { showToast(t('maxPresets')); return; }
      document.getElementById('modal-hint').textContent =
        SOUNDS.filter(s => state[s.id].active).map(s => t('names')[s.id]).join(', ');
      nameInput.value = '';
      modal.classList.add('open');
      setTimeout(() => nameInput.focus(), 50);
    });

    const closeModal = () => modal.classList.remove('open');
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.getElementById('modal-ok').addEventListener('click', doSave);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSave(); });

    function doSave() {
      const name = nameInput.value.trim() || (lang === 'ru' ? 'Мой микс' : 'My mix');
      const s = loadStore();
      s.presets.push({ name, mix: currentMix() });
      saveStore(s);
      renderCustomPresets();
      closeModal();
      showToast(t('saved') + ': ' + name);
    }

    // ───────────────────────────────────────── Оживить
    let animateInterval = null;
    const btnAnimate = document.getElementById('btn-animate');
    btnAnimate.addEventListener('click', () => {
      if (animateInterval) {
        clearInterval(animateInterval); animateInterval = null;
        btnAnimate.classList.remove('active');
      } else {
        animateInterval = setInterval(animateStep, 4000);
        btnAnimate.classList.add('active');
        animateStep();
      }
    });

    function animateStep() {
      SOUNDS.forEach(s => {
        if (!state[s.id].active) return;
        const next = Math.min(0.98, Math.max(0.05, state[s.id].volume + (Math.random()-0.5)*0.35));
        setVolume(s.id, next, 3.5);
        const el = document.getElementById('slider-'+s.id);
        el.value = Math.round(next*100);
        el.style.setProperty('--val', Math.round(next*100) + '%');
      });
    }

    // ───────────────────────────────────────── Таймер
    let timerTimeout=null, fadeTimeout=null, timerTick=null, timerEnd=null;
    const btnTimer = document.getElementById('btn-timer');
    const timerMenu = document.getElementById('timer-menu');
    const timerDisplay = document.getElementById('timer-display');

    btnTimer.addEventListener('click', e => { e.stopPropagation(); timerMenu.classList.toggle('open'); });
    timerMenu.querySelectorAll('.timer-option').forEach(opt => {
      opt.addEventListener('click', () => {
        const m = parseInt(opt.dataset.min, 10);
        timerMenu.classList.remove('open');
        if (m === 0) cancelTimer(); else setTimer(m);
      });
    });

    function setTimer(min) {
      clearTimers();
      const ms = min * 60000;
      timerEnd = Date.now() + ms;
      fadeTimeout = setTimeout(() => {
        timerDisplay.classList.add('fading');
        setMasterVolume(0.0001, TIMER_FADE);
      }, Math.max(0, ms - TIMER_FADE*1000));
      timerTimeout = setTimeout(() => {
        stopAll();
        masterVol = 1;
        showToast(t('timerDone'));
      }, ms);
      btnTimer.classList.add('active');
      updateTimerDisplay();
      timerTick = setInterval(updateTimerDisplay, 1000);
    }

    function clearTimers() {
      [timerTimeout, fadeTimeout].forEach(x => x && clearTimeout(x));
      if (timerTick) clearInterval(timerTick);
      timerTimeout = fadeTimeout = timerTick = null;
    }

    function cancelTimer() {
      clearTimers();
      timerEnd = null;
      btnTimer.classList.remove('active');
      timerDisplay.textContent = '';
      timerDisplay.classList.remove('fading');
      if (masterVol < 1) setMasterVolume(1, 0.5);
    }

    function updateTimerDisplay() {
      if (!timerEnd) return;
      const left = timerEnd - Date.now();
      if (left <= 0) { timerDisplay.textContent = ''; return; }
      const m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
      timerDisplay.textContent = m + ':' + String(s).padStart(2,'0');
    }

    // ───────────────────────────────────────── Стоп / Поделиться
    const btnStop = document.getElementById('btn-stop');
    btnStop.addEventListener('click', stopAll);

    function stopAll() {
      SOUNDS.forEach(s => {
        if (state[s.id].active) {
          state[s.id].active = false;
          setCardActive(s.id, false);
          stopSound(s.id);
        }
      });
      if (animateInterval) { clearInterval(animateInterval); animateInterval = null; btnAnimate.classList.remove('active'); }
      clearPresetHighlight();
      cancelTimer();
      refreshStopBtn();
      saveLastMix();
    }

    const refreshStopBtn = () => { btnStop.disabled = !SOUNDS.some(s => state[s.id].active); };

    document.getElementById('btn-share').addEventListener('click', () => {
      const p = new URLSearchParams();
      SOUNDS.forEach(s => { if (state[s.id].active) p.set(s.id, Math.round(state[s.id].volume*100)); });
      const url = location.origin + location.pathname + (p.toString() ? '?' + p : '');
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(url).then(() => showToast(t('copied')), () => showToast(t('linkReady')));
      } else showToast(t('linkReady'));
    });

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2500);
    }

    // ───────────────────────────────────────── Фоновое воспроизведение
    function updateMediaSession() {
      const playing = SOUNDS.some(s => state[s.id].active);
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
      if (playing) {
        const brand = lang === 'ru' ? 'Тишина' : 'Tishina';
        const names = SOUNDS.filter(s => state[s.id].active).map(s => t('names')[s.id]).join(' · ');
        navigator.mediaSession.metadata = new MediaMetadata({
          title: names || brand, artist: brand, album: t('slogan')
        });
        try {
          navigator.mediaSession.setActionHandler('pause', stopAll);
          navigator.mediaSession.setActionHandler('stop', stopAll);
        } catch (e) {}
      }
    }

    // Вернулись в приложение — убеждаемся, что всё ещё звучит
    function wake() {
      SOUNDS.forEach(s => {
        const el = els[s.id];
        if (state[s.id].active && el && el.paused) el.play().catch(() => {});
      });
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
    window.addEventListener('focus', wake);
    window.addEventListener('pageshow', wake);

    // ───────────────────────────────────────── Фон на iPhone
    //
    // Внутри Telegram страница живёт в WKWebView, а Apple с iOS 13 глушит
    // там звук при блокировке экрана — это ограничение системы, из веба
    // не обходится. В обычном Safari фон работает, поэтому предлагаем
    // перейти туда. Показываем один раз и только тем, кого это касается.

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
               || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const inTelegram = !!TG?.initData || !!TG?.platform;
    const HINT_KEY = 'tishina_hint_bg';

    const hint = document.getElementById('hint');

    function maybeShowHint() {
      if (!isIOS || !inTelegram) return;
      try { if (localStorage.getItem(HINT_KEY)) return; } catch (e) {}
      hint.classList.add('show');
    }

    function hideHint(forever) {
      hint.classList.remove('show');
      if (forever) { try { localStorage.setItem(HINT_KEY, '1'); } catch (e) {} }
    }

    document.getElementById('hint-close').addEventListener('click', () => hideHint(true));

    document.getElementById('hint-open').addEventListener('click', () => {
      // Переносим текущий микс и доступ, чтобы в браузере всё было как здесь
      const p = new URLSearchParams();
      SOUNDS.forEach(s => { if (state[s.id].active) p.set(s.id, Math.round(state[s.id].volume*100)); });
      if (IS_PRO) p.set('pro', '1');
      p.set('lang', lang);
      const url = location.origin + location.pathname + '?' + p;

      hideHint(true);
      if (TG?.openLink) TG.openLink(url, { try_instant_view: false });
      else window.open(url, '_blank');
    });

    // ───────────────────────────────────────── Применение языка
    function applyLang() {
      document.documentElement.lang = lang;
      document.getElementById('brand').textContent = lang === 'ru' ? 'тишина' : 'tishina';
      document.title = lang === 'ru' ? 'Тишина' : 'Tishina';
      document.getElementById('slogan').textContent = t('slogan');
      document.getElementById('lang').textContent = lang === 'ru' ? '🇺🇸' : '🪆';
      document.getElementById('lang').title = lang === 'ru' ? 'English' : 'Русский';

      document.querySelectorAll('.preset-btn[data-preset]').forEach(b => {
        const k = b.dataset.preset;
        b.textContent = PRESET_ICON[k] + ' ' + t(k);
      });

      document.querySelectorAll('[data-name]').forEach(el => {
        el.textContent = t('names')[el.dataset.name];
      });

      btnAnimate.textContent = t('animate');
      btnTimer.textContent   = t('timer');
      btnStop.textContent    = t('stop');
      document.getElementById('btn-share').textContent = t('share');

      timerMenu.querySelectorAll('.timer-option').forEach(o => {
        const m = o.dataset.min;
        o.textContent = m === '0' ? t('cancel') : m + ' ' + t('min');
      });

      document.getElementById('more-label').textContent =
        extra.classList.contains('open') ? t('less') : t('more');

      document.getElementById('modal-title').textContent  = t('saveTitle');
      document.getElementById('modal-cancel').textContent = t('cancel');
      document.getElementById('modal-ok').textContent     = t('save');
      nameInput.placeholder = t('namePh');
    }

    document.getElementById('lang').addEventListener('click', () => {
      lang = lang === 'ru' ? 'en' : 'ru';
      localStorage.setItem(LANG_KEY, lang);
      applyLang();
      updateMediaSession();
    });

    applyLang();
    renderCustomPresets();

    // ───────────────────────────────────────── Восстановление микса
    (() => {
      let mix = {}, fromUrl = false;
      SOUNDS.forEach(s => {
        const v = QS.get(s.id);
        if (v === null) return;
        const n = Math.max(0, Math.min(100, parseInt(v,10) || 0));
        if (n > 0) { mix[s.id] = n; fromUrl = true; }
      });
      if (!fromUrl) {
        const last = loadStore().last;
        if (last && Object.keys(last).length) mix = last;
      }
      if (!Object.keys(mix).length) return;

      let anyExtra = false;
      SOUNDS.forEach(s => {
        const v = (mix[s.id] || 0) / 100;
        if (v <= 0 || !allowed(s)) return;
        state[s.id] = { active: true, volume: v };
        const sl = document.getElementById('slider-' + s.id);
        sl.value = Math.round(v*100);
        sl.style.setProperty('--val', Math.round(v*100) + '%');
        setCardActive(s.id, true);
        if (!isFree(s)) anyExtra = true;
      });
      if (anyExtra) { extra.classList.add('open'); moreBar.classList.add('open'); applyLang(); }
      refreshStopBtn();

      document.addEventListener('pointerdown', () => {
        SOUNDS.forEach(s => { if (state[s.id].active) startSound(s.id); });
        refreshStopBtn();
      }, { once: true });

      showToast(fromUrl ? t('tapToStart') : t('lastMix'));
    })();

    document.addEventListener('click', e => {
      if (!e.target.closest('.timer-wrap')) timerMenu.classList.remove('open');
    });

  })();
  </script>
</body>
</html>
