<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Тишина — фоновое спокойствие</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #0c0b09;
      --card-active: #17130a;
      --line: #221d13;
      --accent: #d0a94e;
      --accent-soft: rgba(208, 169, 78, 0.24);
      --text: #ece3cf;
      --text-dim: #7c756a;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 26px 16px 14px;
    }
    header .title {
      font-size: 15px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: lowercase;
    }
    header .slogan {
      margin-top: 6px;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.3px;
    }

    .presets {
      display: flex;
      gap: 8px;
      padding: 8px 14px 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .presets::-webkit-scrollbar { display: none; }

    .preset-btn {
      flex-shrink: 0;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: transparent;
      color: var(--text-dim);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.2px;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
    }
    .preset-btn:active { transform: scale(0.95); }
    .preset-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Свои пресеты */
    .preset-btn.custom { padding-right: 30px; position: relative; }
    .preset-btn.custom .del {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      line-height: 1;
      color: var(--text-dim);
      background: rgba(255,255,255,0.05);
      transition: background 0.2s, color 0.2s;
    }
    .preset-btn.custom .del:active { background: #7a2c2c; color: #fff; }

    .preset-btn.add {
      padding: 8px 14px;
      font-size: 15px;
      line-height: 1;
      color: var(--accent);
      border-style: dashed;
    }

    /* Модалка сохранения */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #modal.open { display: flex; }

    .modal-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px 20px 18px;
      width: 100%;
      max-width: 320px;
    }
    .modal-title {
      font-size: 14px;
      color: var(--text);
      margin-bottom: 4px;
      font-weight: 500;
    }
    .modal-hint {
      font-size: 11.5px;
      color: var(--text-dim);
      margin-bottom: 14px;
      line-height: 1.4;
    }
    #preset-name {
      width: 100%;
      padding: 11px 13px;
      background: #000;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      margin-bottom: 14px;
    }
    #preset-name:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions .btn { max-width: none; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px;
      padding: 10px 14px 0;
      flex: 1;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 16px 9px 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.35s, background 0.35s, box-shadow 0.35s;
      user-select: none;
      position: relative;
    }
    .card.active {
      background: var(--card-active);
      border-color: var(--accent);
      box-shadow: 0 0 22px var(--accent-soft);
    }

    .card-icon {
      width: 26px;
      height: 26px;
      color: var(--text-dim);
      transition: color 0.35s, transform 0.35s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-icon svg { width: 100%; height: 100%; }
    .card.active .card-icon { color: var(--accent); transform: scale(1.06); }

    /* Спиннер загрузки поверх иконки */
    .card.loading .card-icon { opacity: 0.15; }
    .card .spinner {
      display: none;
      position: absolute;
      top: 16px;
      width: 22px;
      height: 22px;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .card.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Метка «нужны наушники» для бинауральных ритмов */
    .card .hp {
      position: absolute;
      top: 7px;
      right: 8px;
      width: 11px;
      height: 11px;
      color: var(--text-dim);
      opacity: 0.55;
    }
    .card.active .hp { color: var(--accent); opacity: 1; }

    .card-name {
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      font-weight: 500;
      letter-spacing: 0.2px;
      transition: color 0.35s;
      line-height: 1.2;
    }
    .card.active .card-name { color: var(--text); }

    .slider-wrap { width: 100%; padding: 0 2px; }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.35s;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--val, 0%), var(--line) var(--val, 0%), var(--line) 100%);
    }
    .card.active input[type=range] { opacity: 1; }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 6px var(--accent-soft);
    }
    input[type=range]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
    }

    #timer-display {
      text-align: center;
      font-size: 12px;
      color: var(--accent);
      height: 18px;
      margin-top: 12px;
      letter-spacing: 1px;
    }
    #timer-display.fading { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .controls {
      display: flex;
      gap: 8px;
      padding: 8px 14px 26px;
      justify-content: center;
    }

    .btn {
      flex: 1;
      max-width: 110px;
      padding: 12px 0;
      border: 1px solid var(--line);
      border-radius: 13px;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.2px;
      cursor: pointer;
      background: transparent;
      color: var(--text-dim);
      transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.1s, opacity 0.25s;
    }
    .btn.active { background: var(--accent); color: #000000; border-color: var(--accent); }
    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.35; cursor: default; }

    .timer-wrap { position: relative; flex: 1; max-width: 110px; display: flex; }
    .timer-wrap .btn { width: 100%; max-width: none; }

    .timer-menu {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #0c0b09;
      border: 1px solid var(--line);
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,0.6);
      z-index: 100;
      min-width: 140px;
    }
    .timer-menu.open { display: block; }

    .timer-option {
      padding: 12px 20px;
      font-size: 14px;
      cursor: pointer;
      color: var(--text);
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }
    .timer-option:hover, .timer-option:active { background: var(--accent); color: #000000; }
    .timer-option.cancel-opt { color: var(--text-dim); border-top: 1px solid var(--line); }
    .timer-option.cancel-opt:hover { background: var(--line); color: var(--text); }

    #toast {
      position: fixed;
      bottom: 92px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--accent);
      color: #000000;
      padding: 10px 22px;
      border-radius: 22px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 200;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <div class="title">тишина</div>
    <div class="slogan">Включи фоновое спокойствие</div>
  </header>

  <div class="presets" id="presets">
    <button class="preset-btn" data-preset="focus">🎯 Фокус</button>
    <button class="preset-btn" data-preset="sleep">🌙 Сон</button>
    <button class="preset-btn" data-preset="meditation">🧘 Медитация</button>
    <button class="preset-btn" data-preset="cafe">☕ Кафе</button>
    <button class="preset-btn" data-preset="deep">🎧 Глубокий фокус</button>
    <span id="custom-slot"></span>
    <button class="preset-btn add" id="btn-save-preset" title="Сохранить свой микс">＋</button>
  </div>

  <div class="grid" id="grid"></div>
  <div id="timer-display"></div>

  <div class="controls">
    <button class="btn" id="btn-animate">Оживить</button>
    <div class="timer-wrap">
      <button class="btn" id="btn-timer">Таймер</button>
      <div class="timer-menu" id="timer-menu">
        <div class="timer-option" data-min="15">15 мин</div>
        <div class="timer-option" data-min="30">30 мин</div>
        <div class="timer-option" data-min="45">45 мин</div>
        <div class="timer-option" data-min="60">60 мин</div>
        <div class="timer-option cancel-opt" data-min="0">Отмена</div>
      </div>
    </div>
    <button class="btn" id="btn-stop" disabled>Стоп</button>
    <button class="btn" id="btn-share">Поделиться</button>
  </div>

  <div id="modal">
    <div class="modal-box">
      <div class="modal-title">Сохранить микс</div>
      <div class="modal-hint" id="modal-hint"></div>
      <input type="text" id="preset-name" maxlength="18" placeholder="Например: Вечер" autocomplete="off">
      <div class="modal-actions">
        <button class="btn" id="modal-cancel">Отмена</button>
        <button class="btn active" id="modal-ok">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
  (() => {
    'use strict';

    if (window.Telegram?.WebApp) {
      Telegram.WebApp.expand();
      try {
        Telegram.WebApp.setBackgroundColor('#000000');
        Telegram.WebApp.setHeaderColor('#000000');
      } catch (e) {}
      try { Telegram.WebApp.disableVerticalSwipes(); } catch (e) {}
    }

    // ───────────────────────────────────────── Иконки
    const IC = {
      rain:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5a3.8 3.8 0 0 1 .7-7.5A5 5 0 0 1 17 5.2a3.4 3.4 0 0 1 1 6.6"/><path d="M8 16l-1 2.5M12 16l-1 2.5M16 16l-1 2.5"/></svg>',
      thunder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12a3.8 3.8 0 0 1 .7-7.5A5 5 0 0 1 17 4.7a3.4 3.4 0 0 1 1 6.6"/><path d="M12 13l-2.2 3.2h2.8L10.4 20"/></svg>',
      waves: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10c1.8 0 1.8-2 3.7-2s1.9 2 3.7 2 1.8-2 3.7-2 1.9 2 3.7 2"/><path d="M3 15c1.8 0 1.8-2 3.7-2s1.9 2 3.7 2 1.8-2 3.7-2 1.9 2 3.7 2"/></svg>',
      wind:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h9a2.4 2.4 0 1 0-2.4-2.4"/><path d="M4 12h13a2.4 2.4 0 1 1-2.4 2.4"/><path d="M4 16h7"/></svg>',
      fire:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3.2 3.2 4.8 5.8 4.8 8.7A4.8 4.8 0 0 1 7.2 12c0-1.7.8-3 1.9-4 .1 1.3.8 2.2 1.7 2.6.3-2.4-.8-4.9 1.2-7.6z"/></svg>',
      birds: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10c1.6-2.2 3.2-2.2 4.8 0"/><path d="M13 8c1.8-2.4 3.4-2.4 5.2 0"/></svg>',
      handpan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="1.4"/><path d="M12 5.5v1.6M12 16.9v1.6M5.5 12h1.6M16.9 12h1.6"/></svg>',
      didgeridoo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5 16 8a2.1 2.1 0 0 1 3 3L7.5 22.5"/><path d="M13.5 10.5l3 3M15.5 8.5l3 3"/></svg>',
      ambient:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.3"/><circle cx="12" cy="12" r="6.6" opacity="0.5"/></svg>',
      softnoise:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 12h2M7 9v6M11 6.5v11M15 9v6M19 11v2"/></svg>',
      deepnoise:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 12h2M7 10.5v3M11 8v8M15 5v14M19 9.5v5"/></svg>',
      alpha:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c1.5-4 3-4 4.5 0s3 4 4.5 0 3-4 4.5 0 3 4 4.5 0"/></svg>',
      theta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2.5-5 5-5 7.5 0s5 5 7.5 0"/><path d="M18 12c1 2 2 2 3 0" opacity="0.5"/></svg>',
      delta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c4-7 8-7 12 0s6 5 8 0"/></svg>',
      drone432:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.4M12 18.1v2.4M3.5 12h2.4M18.1 12h2.4" opacity="0.6"/><circle cx="12" cy="12" r="8" opacity="0.3"/></svg>',
      bowl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10c0 5 3.6 8 8 8s8-3 8-8"/><path d="M2.5 10h19"/><path d="M9 5.5c1-1.5 5-1.5 6 0" opacity="0.5"/></svg>'
    };

    const SOUNDS = [
      { id: 'rain',       name: 'Дождь',      file: 'rain.mp3',       icon: IC.rain,       def: 0.70 },
      { id: 'thunder',    name: 'Гром',       file: 'thunder.mp3',    icon: IC.thunder,    def: 0.50 },
      { id: 'waves',      name: 'Волны',      file: 'waves.mp3',      icon: IC.waves,      def: 0.60 },
      { id: 'wind',       name: 'Ветер',      file: 'wind.mp3',       icon: IC.wind,       def: 0.50 },
      { id: 'fire',       name: 'Огонь',      file: 'fire.mp3',       icon: IC.fire,       def: 0.60 },
      { id: 'birds',      name: 'Птицы',      file: 'birds.mp3',      icon: IC.birds,      def: 0.55 },
      { id: 'handpan',    name: 'Хендпан',    file: 'handpan.mp3',    icon: IC.handpan,    def: 0.50 },
      { id: 'didgeridoo', name: 'Диджериду',  file: 'didgeridoo.mp3', icon: IC.didgeridoo, def: 0.20 },
      { id: 'ambient',    name: 'Эмбиент',    file: 'ambient.mp3',    icon: IC.ambient,    def: 0.25 },

      // Синтезированные — идеально ровный фон без «швов» и случайных событий
      { id: 'softnoise',  name: 'Мягкий шум', file: 'softnoise.mp3',  icon: IC.softnoise,  def: 0.45 },
      { id: 'deepnoise',  name: 'Низкий гул', file: 'deepnoise.mp3',  icon: IC.deepnoise,  def: 0.40 },
      { id: 'bowl',       name: 'Чаша',       file: 'bowl.mp3',       icon: IC.bowl,       def: 0.35 },
      { id: 'drone432',   name: '432 Гц',     file: 'drone432.mp3',   icon: IC.drone432,   def: 0.30 },

      // Бинауральные ритмы — только в наушниках, оба уха слышат разную частоту
      { id: 'alpha',      name: 'Альфа 10 Гц', file: 'alpha.mp3',     icon: IC.alpha,      def: 0.35, headphones: true },
      { id: 'theta',      name: 'Тета 6 Гц',   file: 'theta.mp3',     icon: IC.theta,      def: 0.35, headphones: true },
      { id: 'delta',      name: 'Дельта 2 Гц', file: 'delta.mp3',     icon: IC.delta,      def: 0.35, headphones: true },
    ];

    const PRESETS = {
      focus:      { rain: 55, wind: 18, birds: 25, ambient: 30, softnoise: 40, alpha: 30 },
      sleep:      { rain: 50, thunder: 12, waves: 40, ambient: 45, deepnoise: 35, delta: 30 },
      meditation: { waves: 20, fire: 18, handpan: 50, didgeridoo: 25, bowl: 45, drone432: 35, theta: 28 },
      cafe:       { rain: 40, wind: 15, fire: 55, birds: 35, handpan: 20, ambient: 25 },
      deep:       { deepnoise: 55, softnoise: 25, drone432: 20, alpha: 35 },
    };

    const FADE = 0.4;        // фейд вкл/выкл, сек
    const TIMER_FADE = 30;   // затухание перед концом таймера, сек

    // ───────────────────────────────────────── Аудиодвижок (Web Audio API)
    let ctx = null;
    let master = null;
    const buffers = {};   // id -> AudioBuffer
    const nodes = {};     // id -> { src, gain }
    const loading = {};   // id -> Promise
    const state = {};     // id -> { active, volume }

    function ensureCtx() {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain();
        master.gain.value = 1;
        master.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    // Загружаем и декодируем mp3 в AudioBuffer (кешируется)
    function loadBuffer(id, file) {
      if (buffers[id]) return Promise.resolve(buffers[id]);
      if (loading[id]) return loading[id];

      setCardLoading(id, true);
      loading[id] = fetch(file)
        .then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.arrayBuffer();
        })
        .then(ab => ensureCtx().decodeAudioData(ab))
        .then(buf => {
          buffers[id] = buf;
          setCardLoading(id, false);
          delete loading[id];
          return buf;
        })
        .catch(err => {
          setCardLoading(id, false);
          delete loading[id];
          showToast('Не удалось загрузить звук');
          throw err;
        });
      return loading[id];
    }

    // Запуск звука. AudioBufferSourceNode с loop=true даёт бесшовный цикл.
    async function startSound(id) {
      const s = SOUNDS.find(x => x.id === id);
      ensureCtx();
      const buf = await loadBuffer(id, s.file);
      if (!state[id].active) return;   // успели выключить пока грузилось
      if (nodes[id]) return;           // уже играет

      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.loop = true;

      const gain = ctx.createGain();
      gain.gain.value = 0;
      gain.gain.linearRampToValueAtTime(state[id].volume, ctx.currentTime + FADE);

      src.connect(gain).connect(master);
      src.start(0);
      nodes[id] = { src, gain };
      updateMediaSession();
    }

    function stopSound(id, fade = FADE) {
      const n = nodes[id];
      if (!n) return;
      const t = ctx.currentTime;
      n.gain.gain.cancelScheduledValues(t);
      n.gain.gain.setValueAtTime(n.gain.gain.value, t);
      n.gain.gain.linearRampToValueAtTime(0, t + fade);
      const src = n.src;
      setTimeout(() => { try { src.stop(); } catch (e) {} }, (fade + 0.05) * 1000);
      delete nodes[id];
      updateMediaSession();
    }

    function setVolume(id, v, ramp = 0.08) {
      state[id].volume = v;
      const n = nodes[id];
      if (!n) return;
      const t = ctx.currentTime;
      n.gain.gain.cancelScheduledValues(t);
      n.gain.gain.setValueAtTime(n.gain.gain.value, t);
      n.gain.gain.linearRampToValueAtTime(v, t + ramp);
    }

    // ───────────────────────────────────────── UI: сетка
    const grid = document.getElementById('grid');

    SOUNDS.forEach(s => {
      state[s.id] = { active: false, volume: s.def };

      const card = document.createElement('div');
      card.className = 'card';
      card.id = 'card-' + s.id;
      const hpBadge = s.headphones
        ? '<svg class="hp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13.5" width="4" height="7" rx="1.6"/><rect x="17.5" y="13.5" width="4" height="7" rx="1.6"/></svg>'
        : '';

      card.innerHTML =
        '<div class="spinner"></div>' + hpBadge +
        '<div class="card-icon">' + s.icon + '</div>' +
        '<div class="card-name">' + s.name + '</div>' +
        '<div class="slider-wrap">' +
          '<input type="range" min="0" max="100" value="' + Math.round(s.def * 100) + '"' +
          ' id="slider-' + s.id + '" style="--val: ' + Math.round(s.def * 100) + '%">' +
        '</div>';

      const slider = card.querySelector('input');
      slider.addEventListener('input', e => onSlider(s.id, e.target));
      slider.addEventListener('click', e => e.stopPropagation());
      slider.addEventListener('touchstart', e => e.stopPropagation());

      card.addEventListener('click', () => toggleSound(s.id));
      grid.appendChild(card);
    });

    function setCardLoading(id, on) {
      document.getElementById('card-' + id).classList.toggle('loading', on);
    }

    function setCardActive(id, on) {
      document.getElementById('card-' + id).classList.toggle('active', on);
    }

    function toggleSound(id) {
      clearPresetHighlight();
      const s = state[id];
      s.active = !s.active;
      setCardActive(id, s.active);
      if (s.active) startSound(id); else stopSound(id);
      refreshStopBtn();
      saveLastMix();
    }

    function onSlider(id, el) {
      clearPresetHighlight();
      const v = el.value / 100;
      el.style.setProperty('--val', el.value + '%');
      setVolume(id, v);
      if (!state[id].active && v > 0) {
        state[id].active = true;
        setCardActive(id, true);
        startSound(id);
        refreshStopBtn();
      }
      clearTimeout(saveDebounce);
      saveDebounce = setTimeout(saveLastMix, 600);
    }
    let saveDebounce = null;

    // ───────────────────────────────────────── Пресеты
    let activePreset = null;

    function clearPresetHighlight() {
      activePreset = null;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    }

    // Применяет микс вида { rain: 65, wind: 20, ... } (значения 0–100)
    function applyMix(mix) {
      ensureCtx();
      SOUNDS.forEach(s => {
        const vol = (mix[s.id] || 0) / 100;
        const slider = document.getElementById('slider-' + s.id);
        slider.value = Math.round(vol * 100);
        slider.style.setProperty('--val', Math.round(vol * 100) + '%');

        if (vol > 0) {
          state[s.id].volume = vol;
          if (!state[s.id].active) {
            state[s.id].active = true;
            setCardActive(s.id, true);
            startSound(s.id);
          } else {
            setVolume(s.id, vol, FADE);
          }
        } else if (state[s.id].active) {
          state[s.id].active = false;
          setCardActive(s.id, false);
          stopSound(s.id);
        }
      });
      refreshStopBtn();
      saveLastMix();
    }

    // Текущее состояние в виде микса
    function currentMix() {
      const mix = {};
      SOUNDS.forEach(s => {
        if (state[s.id].active) mix[s.id] = Math.round(state[s.id].volume * 100);
      });
      return mix;
    }

    document.querySelectorAll('.preset-btn[data-preset]').forEach(btn => {
      btn.addEventListener('click', () => {
        const name = btn.dataset.preset;
        if (activePreset === name) { stopAll(); return; }
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        activePreset = name;
        btn.classList.add('active');
        applyMix(PRESETS[name]);
      });
    });

    // ───────────────────────────────────────── Свои пресеты (localStorage)
    const STORE_KEY = 'tishina_v1';
    const MAX_PRESETS = 8;

    function loadStore() {
      try {
        return JSON.parse(localStorage.getItem(STORE_KEY)) || { presets: [], last: null };
      } catch (e) {
        return { presets: [], last: null };
      }
    }

    function saveStore(data) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
    }

    function saveLastMix() {
      const store = loadStore();
      store.last = currentMix();
      saveStore(store);
    }

    function renderCustomPresets() {
      const slot = document.getElementById('custom-slot');
      slot.innerHTML = '';
      const store = loadStore();

      store.presets.forEach((p, i) => {
        const btn = document.createElement('button');
        btn.className = 'preset-btn custom';
        btn.innerHTML = '<span class="lbl"></span><span class="del">×</span>';
        btn.querySelector('.lbl').textContent = p.name;
        btn.dataset.custom = i;

        btn.addEventListener('click', e => {
          if (e.target.classList.contains('del')) {
            e.stopPropagation();
            const s = loadStore();
            s.presets.splice(i, 1);
            saveStore(s);
            renderCustomPresets();
            showToast('Пресет удалён');
            return;
          }
          if (activePreset === 'custom-' + i) { stopAll(); return; }
          document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
          activePreset = 'custom-' + i;
          btn.classList.add('active');
          applyMix(p.mix);
        });

        slot.appendChild(btn);
      });
    }

    // Модалка сохранения
    const modal = document.getElementById('modal');
    const nameInput = document.getElementById('preset-name');

    document.getElementById('btn-save-preset').addEventListener('click', () => {
      const mix = currentMix();
      if (!Object.keys(mix).length) {
        showToast('Сначала включите звуки');
        return;
      }
      const store = loadStore();
      if (store.presets.length >= MAX_PRESETS) {
        showToast('Максимум ' + MAX_PRESETS + ' пресетов');
        return;
      }
      const names = SOUNDS.filter(s => state[s.id].active).map(s => s.name).join(', ');
      document.getElementById('modal-hint').textContent = names;
      nameInput.value = '';
      modal.classList.add('open');
      setTimeout(() => nameInput.focus(), 50);
    });

    function closeModal() { modal.classList.remove('open'); }

    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

    document.getElementById('modal-ok').addEventListener('click', doSavePreset);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSavePreset(); });

    function doSavePreset() {
      const name = nameInput.value.trim() || 'Мой микс';
      const store = loadStore();
      store.presets.push({ name, mix: currentMix() });
      saveStore(store);
      renderCustomPresets();
      closeModal();
      showToast('✓ Сохранено: ' + name);
    }

    // ───────────────────────────────────────── Оживить
    let animateInterval = null;
    const btnAnimate = document.getElementById('btn-animate');

    btnAnimate.addEventListener('click', () => {
      if (animateInterval) {
        clearInterval(animateInterval);
        animateInterval = null;
        btnAnimate.classList.remove('active');
      } else {
        animateInterval = setInterval(animateStep, 4000);
        btnAnimate.classList.add('active');
        animateStep();
      }
    });

    function animateStep() {
      SOUNDS.forEach(s => {
        if (!state[s.id].active) return;
        const cur = state[s.id].volume;
        const next = Math.min(0.98, Math.max(0.05, cur + (Math.random() - 0.5) * 0.35));
        setVolume(s.id, next, 3.5);   // плавный дрейф вместо скачка
        const el = document.getElementById('slider-' + s.id);
        el.value = Math.round(next * 100);
        el.style.setProperty('--val', Math.round(next * 100) + '%');
      });
    }

    // ───────────────────────────────────────── Таймер
    let timerTimeout = null, fadeTimeout = null, timerTick = null, timerEnd = null;
    const btnTimer = document.getElementById('btn-timer');
    const timerMenu = document.getElementById('timer-menu');
    const timerDisplay = document.getElementById('timer-display');

    btnTimer.addEventListener('click', e => {
      e.stopPropagation();
      timerMenu.classList.toggle('open');
    });

    timerMenu.querySelectorAll('.timer-option').forEach(opt => {
      opt.addEventListener('click', () => {
        const min = parseInt(opt.dataset.min, 10);
        timerMenu.classList.remove('open');
        if (min === 0) cancelTimer(); else setTimer(min);
      });
    });

    function setTimer(min) {
      clearTimers();
      const ms = min * 60000;
      timerEnd = Date.now() + ms;

      // Плавное затухание за TIMER_FADE секунд до конца
      const fadeAt = Math.max(0, ms - TIMER_FADE * 1000);
      fadeTimeout = setTimeout(() => {
        if (!ctx) return;
        timerDisplay.classList.add('fading');
        const t = ctx.currentTime;
        master.gain.cancelScheduledValues(t);
        master.gain.setValueAtTime(master.gain.value, t);
        master.gain.linearRampToValueAtTime(0.0001, t + TIMER_FADE);
      }, fadeAt);

      timerTimeout = setTimeout(() => {
        stopAll();
        if (master) master.gain.value = 1;
        showToast('Таймер завершён');
      }, ms);

      btnTimer.classList.add('active');
      updateTimerDisplay();
      timerTick = setInterval(updateTimerDisplay, 1000);
    }

    function clearTimers() {
      if (timerTimeout) clearTimeout(timerTimeout);
      if (fadeTimeout) clearTimeout(fadeTimeout);
      if (timerTick) clearInterval(timerTick);
      timerTimeout = fadeTimeout = timerTick = null;
    }

    function cancelTimer() {
      clearTimers();
      timerEnd = null;
      btnTimer.classList.remove('active');
      timerDisplay.textContent = '';
      timerDisplay.classList.remove('fading');
      if (ctx && master) {
        const t = ctx.currentTime;
        master.gain.cancelScheduledValues(t);
        master.gain.setValueAtTime(master.gain.value, t);
        master.gain.linearRampToValueAtTime(1, t + 0.5);
      }
    }

    function updateTimerDisplay() {
      if (!timerEnd) return;
      const left = timerEnd - Date.now();
      if (left <= 0) { timerDisplay.textContent = ''; return; }
      const m = Math.floor(left / 60000);
      const s = Math.floor((left % 60000) / 1000);
      timerDisplay.textContent = m + ':' + String(s).padStart(2, '0');
    }

    // ───────────────────────────────────────── Стоп всё
    const btnStop = document.getElementById('btn-stop');
    btnStop.addEventListener('click', stopAll);

    function stopAll() {
      SOUNDS.forEach(s => {
        if (state[s.id].active) {
          state[s.id].active = false;
          setCardActive(s.id, false);
          stopSound(s.id);
        }
      });
      if (animateInterval) {
        clearInterval(animateInterval);
        animateInterval = null;
        btnAnimate.classList.remove('active');
      }
      clearPresetHighlight();
      cancelTimer();
      refreshStopBtn();
      saveLastMix();
    }

    function refreshStopBtn() {
      btnStop.disabled = !SOUNDS.some(s => state[s.id].active);
    }

    // ───────────────────────────────────────── Поделиться
    document.getElementById('btn-share').addEventListener('click', () => {
      const params = new URLSearchParams();
      SOUNDS.forEach(s => {
        if (state[s.id].active) params.set(s.id, Math.round(state[s.id].volume * 100));
      });
      const url = location.origin + location.pathname + (params.toString() ? '?' + params : '');
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(url).then(
          () => showToast('✓ Ссылка скопирована'),
          () => showToast('✓ Ссылка готова')
        );
      } else {
        showToast('✓ Ссылка готова');
      }
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ───────────────────────────────────────── Фоновое воспроизведение
    // Держим «немой» HTMLAudio, чтобы iOS/Android считали таб активным
    // медиаплеером и не глушили Web Audio при свёрнутом Telegram.
    let keepAlive = null;

    function initKeepAlive() {
      if (keepAlive) return;
      // 1-секундная тишина в WAV, data-URI (44 байта заголовок + нули)
      const silence = 'data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQ4AAAAAAAAAAAAAAAAAAAAAAA==';
      keepAlive = new Audio(silence);
      keepAlive.loop = true;
      keepAlive.volume = 0.001;
      keepAlive.play().catch(() => {});
    }

    function updateMediaSession() {
      const playing = SOUNDS.some(s => state[s.id].active);
      if (playing) initKeepAlive();
      else if (keepAlive) { keepAlive.pause(); }

      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
      if (playing) {
        const names = SOUNDS.filter(s => state[s.id].active).map(s => s.name).join(' · ');
        navigator.mediaSession.metadata = new MediaMetadata({
          title: names || 'Тишина',
          artist: 'Тишина',
          album: 'Фоновое спокойствие'
        });
        try {
          navigator.mediaSession.setActionHandler('pause', stopAll);
          navigator.mediaSession.setActionHandler('stop', stopAll);
        } catch (e) {}
      }
    }

    // Возобновляем контекст когда возвращаемся в приложение
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && ctx && ctx.state === 'suspended') ctx.resume();
    });

    // ───────────────────────────────────────── Восстановление микса из URL
    (() => {
      renderCustomPresets();

      // Приоритет: микс из ссылки, иначе последний сохранённый
      const params = new URLSearchParams(location.search);
      let mix = {};
      let fromUrl = false;

      SOUNDS.forEach(s => {
        const val = params.get(s.id);
        if (val === null) return;
        const v = Math.max(0, Math.min(100, parseInt(val, 10) || 0));
        if (v > 0) { mix[s.id] = v; fromUrl = true; }
      });

      if (!fromUrl) {
        const last = loadStore().last;
        if (last && Object.keys(last).length) mix = last;
      }

      if (!Object.keys(mix).length) return;

      // Показываем состояние, но не играем — автозапуск требует жеста
      SOUNDS.forEach(s => {
        const v = (mix[s.id] || 0) / 100;
        if (v <= 0) return;
        state[s.id] = { active: true, volume: v };
        const slider = document.getElementById('slider-' + s.id);
        slider.value = Math.round(v * 100);
        slider.style.setProperty('--val', Math.round(v * 100) + '%');
        setCardActive(s.id, true);
      });
      refreshStopBtn();

      const kick = () => {
        SOUNDS.forEach(s => { if (state[s.id].active) startSound(s.id); });
        refreshStopBtn();
      };
      document.addEventListener('pointerdown', kick, { once: true });
      showToast(fromUrl ? 'Коснитесь экрана для запуска' : 'Ваш последний микс — коснитесь экрана');
    })();

    // Закрываем меню таймера по тапу вне
    document.addEventListener('click', e => {
      if (!e.target.closest('.timer-wrap')) timerMenu.classList.remove('open');
    });

  })();
  </script>
</body>
