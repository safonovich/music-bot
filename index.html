<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Тишина — фоновое спокойствие</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #0c0b09;
      --card-active: #17130a;
      --line: #221d13;
      --accent: #d0a94e;
      --accent-soft: rgba(208, 169, 78, 0.24);
      --text: #ece3cf;
      --text-dim: #7c756a;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 26px 16px 14px;
    }
    header .title {
      font-size: 15px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: lowercase;
    }
    header .slogan {
      margin-top: 6px;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 0.3px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px;
      padding: 10px 14px 0;
      flex: 1;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 16px 9px 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.35s, background 0.35s, box-shadow 0.35s;
      user-select: none;
    }
    .card.active {
      background: var(--card-active);
      border-color: var(--accent);
      box-shadow: 0 0 22px var(--accent-soft);
    }

    .card-icon {
      width: 26px;
      height: 26px;
      color: var(--text-dim);
      transition: color 0.35s, transform 0.35s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-icon svg { width: 100%; height: 100%; }
    .card.active .card-icon { color: var(--accent); transform: scale(1.06); }

    .card-name {
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      font-weight: 500;
      letter-spacing: 0.2px;
      transition: color 0.35s;
      line-height: 1.2;
    }
    .card.active .card-name { color: var(--text); }

    .slider-wrap { width: 100%; padding: 0 2px; }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.35s;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--val, 0%), var(--line) var(--val, 0%), var(--line) 100%);
    }
    .card.active input[type=range] { opacity: 1; }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 6px var(--accent-soft);
    }
    input[type=range]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
    }

    #timer-display {
      text-align: center;
      font-size: 12px;
      color: var(--accent);
      height: 18px;
      margin-top: 12px;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      gap: 9px;
      padding: 8px 14px 26px;
      justify-content: center;
    }

    .btn {
      flex: 1;
      max-width: 120px;
      padding: 12px 0;
      border: 1px solid var(--line);
      border-radius: 13px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2px;
      cursor: pointer;
      background: transparent;
      color: var(--text-dim);
      transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.1s;
    }
    .btn.active { background: var(--accent); color: #000000; border-color: var(--accent); }
    .btn:active { transform: scale(0.95); }

    .timer-wrap { position: relative; flex: 1; max-width: 120px; display: flex; }
    .timer-wrap .btn { width: 100%; }

    .timer-menu {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #0c0b09;
      border: 1px solid var(--line);
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,0.6);
      z-index: 100;
      min-width: 140px;
    }
    .timer-menu.open { display: block; }

    .timer-option {
      padding: 12px 20px;
      font-size: 14px;
      cursor: pointer;
      color: var(--text);
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }
    .timer-option:hover, .timer-option:active { background: var(--accent); color: #000000; }
    .timer-option.cancel-opt { color: var(--text-dim); border-top: 1px solid var(--line); }
    .timer-option.cancel-opt:hover { background: var(--line); color: var(--text); }

    .presets {
      display: flex;
      gap: 8px;
      padding: 8px 14px 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .presets::-webkit-scrollbar { display: none; }

    .preset-btn {
      flex-shrink: 0;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: transparent;
      color: var(--text-dim);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.2px;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .preset-btn:active { transform: scale(0.95); }
    .preset-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    #toast {
      position: fixed;
      bottom: 92px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--accent);
      color: #000000;
      padding: 10px 22px;
      border-radius: 22px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 200;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <div class="title">тишина</div>
    <div class="slogan">Включи фоновое спокойствие</div>
  </header>
  <div class="presets" id="presets">
    <button class="preset-btn" onclick="applyPreset('focus')">🎯 Фокус</button>
    <button class="preset-btn" onclick="applyPreset('sleep')">🌙 Сон</button>
    <button class="preset-btn" onclick="applyPreset('meditation')">🧘 Медитация</button>
    <button class="preset-btn" onclick="applyPreset('cafe')">☕ Кафе</button>
  </div>
  <div class="grid" id="grid"></div>
  <div id="timer-display"></div>
  <div class="controls">
    <button class="btn" id="btn-animate" onclick="toggleAnimate()">Оживить</button>
    <div class="timer-wrap">
      <button class="btn" id="btn-timer" onclick="toggleTimerMenu()">Таймер</button>
      <div class="timer-menu" id="timer-menu">
        <div class="timer-option" onclick="setTimer(15)">15 мин</div>
        <div class="timer-option" onclick="setTimer(30)">30 мин</div>
        <div class="timer-option" onclick="setTimer(45)">45 мин</div>
        <div class="timer-option" onclick="setTimer(60)">60 мин</div>
        <div class="timer-option cancel-opt" onclick="cancelTimer()">Отмена</div>
      </div>
    </div>
    <button class="btn" onclick="shareMix()">Поделиться</button>
  </div>
  <div id="toast"></div>

  <script>
    if (window.Telegram?.WebApp) {
      Telegram.WebApp.expand();
      Telegram.WebApp.setBackgroundColor('#000000');
      Telegram.WebApp.setHeaderColor('#000000');
    }

    const IC = {
      rain:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5a3.8 3.8 0 0 1 .7-7.5A5 5 0 0 1 17 5.2a3.4 3.4 0 0 1 1 6.6"/><path d="M8 16l-1 2.5M12 16l-1 2.5M16 16l-1 2.5"/></svg>',
      thunder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12a3.8 3.8 0 0 1 .7-7.5A5 5 0 0 1 17 4.7a3.4 3.4 0 0 1 1 6.6"/><path d="M12 13l-2.2 3.2h2.8L10.4 20"/></svg>',
      waves: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10c1.8 0 1.8-2 3.7-2s1.9 2 3.7 2 1.8-2 3.7-2 1.9 2 3.7 2"/><path d="M3 15c1.8 0 1.8-2 3.7-2s1.9 2 3.7 2 1.8-2 3.7-2 1.9 2 3.7 2"/></svg>',
      wind:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h9a2.4 2.4 0 1 0-2.4-2.4"/><path d="M4 12h13a2.4 2.4 0 1 1-2.4 2.4"/><path d="M4 16h7"/></svg>',
      fire:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3.2 3.2 4.8 5.8 4.8 8.7A4.8 4.8 0 0 1 7.2 12c0-1.7.8-3 1.9-4 .1 1.3.8 2.2 1.7 2.6.3-2.4-.8-4.9 1.2-7.6z"/></svg>',
      birds: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10c1.6-2.2 3.2-2.2 4.8 0"/><path d="M13 8c1.8-2.4 3.4-2.4 5.2 0"/></svg>',
      handpan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="1.4"/><path d="M12 5.5v1.6M12 16.9v1.6M5.5 12h1.6M16.9 12h1.6"/></svg>',
      didgeridoo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5 16 8a2.1 2.1 0 0 1 3 3L7.5 22.5"/><path d="M13.5 10.5l3 3M15.5 8.5l3 3"/></svg>',
      ambient:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.3"/><circle cx="12" cy="12" r="6.6" opacity="0.5"/></svg>'
    };

    const SOUNDS = [
      { id: 'rain',       name: 'Дождь',      file: 'rain.mp3',       icon: IC.rain,       def: 0.70 },
      { id: 'thunder',    name: 'Гром',       file: 'thunder.mp3',    icon: IC.thunder,    def: 0.50 },
      { id: 'waves',      name: 'Волны',      file: 'waves.mp3',      icon: IC.waves,      def: 0.60 },
      { id: 'wind',       name: 'Ветер',      file: 'wind.mp3',       icon: IC.wind,       def: 0.50 },
      { id: 'fire',       name: 'Огонь',      file: 'fire.mp3',       icon: IC.fire,       def: 0.60 },
      { id: 'birds',      name: 'Птицы',      file: 'birds.mp3',      icon: IC.birds,      def: 0.55 },
      { id: 'handpan',    name: 'Хендпан',    file: 'handpan.mp3',    icon: IC.handpan,    def: 0.50 },
      { id: 'didgeridoo', name: 'Диджериду',  file: 'didgeridoo.mp3', icon: IC.didgeridoo, def: 0.20 },
      { id: 'ambient',    name: 'Эмбиент',    file: 'ambient.mp3',    icon: IC.ambient,    def: 0.25 },
    ];

    const state = {};
    const audios = {};
    let animateInterval = null;
    let timerTimeout = null;
    let timerTick = null;
    let timerEnd = null;

    // Build grid
    const grid = document.getElementById('grid');
    SOUNDS.forEach(s => {
      state[s.id] = { active: false, volume: s.def };

      const audio = new Audio(s.file);
      audio.loop = true;
      audio.volume = s.def;
      audio.preload = 'none';
      audios[s.id] = audio;

      const card = document.createElement('div');
      card.className = 'card';
      card.id = 'card-' + s.id;
      card.innerHTML = `
        <div class="card-icon">${s.icon}</div>
        <div class="card-name">${s.name}</div>
        <div class="slider-wrap">
          <input type="range" min="0" max="100"
            value="${Math.round(s.def * 100)}"
            id="slider-${s.id}"
            style="--val: ${Math.round(s.def * 100)}%"
            oninput="onSlider('${s.id}', this)"
            onclick="event.stopPropagation()"
            ontouchstart="event.stopPropagation()">
        </div>`;
      card.addEventListener('click', () => toggleSound(s.id));
      grid.appendChild(card);
    });

    function toggleSound(id) {
      activePreset = null;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      const s = state[id];
      s.active = !s.active;
      const card = document.getElementById('card-' + id);
      if (s.active) {
        audios[id].volume = s.volume;
        audios[id].play().catch(() => {});
        card.classList.add('active');
      } else {
        audios[id].pause();
        card.classList.remove('active');
      }
    }

    function onSlider(id, el) {
      const v = el.value / 100;
      el.style.setProperty('--val', el.value + '%');
      state[id].volume = v;
      audios[id].volume = v;
      if (!state[id].active && v > 0) {
        state[id].active = true;
        audios[id].play().catch(() => {});
        document.getElementById('card-' + id).classList.add('active');
      }
    }

    // Animate
    function toggleAnimate() {
      const btn = document.getElementById('btn-animate');
      if (animateInterval) {
        clearInterval(animateInterval);
        animateInterval = null;
        btn.classList.remove('active');
      } else {
        animateInterval = setInterval(animateStep, 4000);
        btn.classList.add('active');
        animateStep();
      }
    }

    function animateStep() {
      SOUNDS.forEach(s => {
        if (!state[s.id].active) return;
        const cur = state[s.id].volume;
        const delta = (Math.random() - 0.5) * 0.35;
        const next = Math.min(0.98, Math.max(0.05, cur + delta));
        state[s.id].volume = next;
        audios[s.id].volume = next;
        const el = document.getElementById('slider-' + s.id);
        el.value = Math.round(next * 100);
        el.style.setProperty('--val', Math.round(next * 100) + '%');
      });
    }

    // Timer
    function toggleTimerMenu() {
      document.getElementById('timer-menu').classList.toggle('open');
    }

    function setTimer(min) {
      document.getElementById('timer-menu').classList.remove('open');
      if (timerTimeout) clearTimeout(timerTimeout);
      if (timerTick) clearInterval(timerTick);
      timerEnd = Date.now() + min * 60000;
      timerTimeout = setTimeout(stopAll, min * 60000);
      document.getElementById('btn-timer').classList.add('active');
      updateTimerDisplay();
      timerTick = setInterval(updateTimerDisplay, 1000);
    }

    function cancelTimer() {
      document.getElementById('timer-menu').classList.remove('open');
      if (timerTimeout) clearTimeout(timerTimeout);
      if (timerTick) clearInterval(timerTick);
      timerEnd = null;
      document.getElementById('btn-timer').classList.remove('active');
      document.getElementById('timer-display').textContent = '';
    }

    function updateTimerDisplay() {
      if (!timerEnd) return;
      const left = timerEnd - Date.now();
      if (left <= 0) { document.getElementById('timer-display').textContent = ''; return; }
      const m = Math.floor(left / 60000);
      const s = Math.floor((left % 60000) / 1000);
      document.getElementById('timer-display').textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }

    function stopAll() {
      SOUNDS.forEach(s => {
        if (state[s.id].active) {
          state[s.id].active = false;
          audios[s.id].pause();
          document.getElementById('card-' + s.id).classList.remove('active');
        }
      });
      if (animateInterval) {
        clearInterval(animateInterval);
        animateInterval = null;
        document.getElementById('btn-animate').classList.remove('active');
      }
      cancelTimer();
    }

    // Share
    function shareMix() {
      const params = new URLSearchParams();
      SOUNDS.forEach(s => {
        if (state[s.id].active) params.set(s.id, Math.round(state[s.id].volume * 100));
      });
      const url = location.origin + location.pathname + (params.toString() ? '?' + params.toString() : '');
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(url).then(() => showToast('✓ Ссылка скопирована'));
      } else {
        showToast('✓ Ссылка готова');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // Restore mix from URL
    (() => {
      const params = new URLSearchParams(location.search);
      SOUNDS.forEach(s => {
        const val = params.get(s.id);
        if (val !== null) {
          const v = parseInt(val) / 100;
          state[s.id] = { active: true, volume: v };
          audios[s.id].volume = v;
          audios[s.id].play().catch(() => {});
          const card = document.getElementById('card-' + s.id);
          card.classList.add('active');
          const slider = document.getElementById('slider-' + s.id);
          slider.value = parseInt(val);
          slider.style.setProperty('--val', val + '%');
        }
      });
    })();

    // Presets
    const PRESETS = {
      focus:     { rain: 65, thunder: 0,  waves: 0,  wind: 20, fire: 0,  birds: 30, handpan: 25, didgeridoo: 0,  ambient: 35 },
      sleep:     { rain: 60, thunder: 15, waves: 45, wind: 0,  fire: 0,  birds: 0,  handpan: 0,  didgeridoo: 0,  ambient: 50 },
      meditation:{ rain: 0,  thunder: 0,  waves: 25, wind: 0,  fire: 20, birds: 15, handpan: 60, didgeridoo: 30, ambient: 45 },
      cafe:      { rain: 40, thunder: 0,  waves: 0,  wind: 15, fire: 55, birds: 35, handpan: 20, didgeridoo: 0,  ambient: 25 },
    };

    let activePreset = null;

    function applyPreset(name) {
      // Снимаем подсветку со всех кнопок

      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));

      if (activePreset === name) {
        // Повторный клик — сброс
        activePreset = null;
        stopAll();
        return;
      }

      activePreset = name;
      event.currentTarget.classList.add('active');

      const mix = PRESETS[name];
      SOUNDS.forEach(s => {
        const vol = (mix[s.id] || 0) / 100;
        const slider = document.getElementById('slider-' + s.id);
        const card = document.getElementById('card-' + s.id);

        slider.value = mix[s.id] || 0;
        slider.style.setProperty('--val', (mix[s.id] || 0) + '%');
        state[s.id].volume = vol;
        audios[s.id].volume = vol;

        if (vol > 0 && !state[s.id].active) {
          state[s.id].active = true;
          audios[s.id].play().catch(() => {});
          card.classList.add('active');
        } else if (vol === 0 && state[s.id].active) {
          state[s.id].active = false;
          audios[s.id].pause();
          card.classList.remove('active');
        }
      });
    }

    // Close timer menu on outside tap
    document.addEventListener('click', e => {
      if (!e.target.closest('.timer-wrap')) {
        document.getElementById('timer-menu').classList.remove('open');
      }
    });
  </script>
</body>
</html>
