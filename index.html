    function renderLayers() {
      layersBox.innerHTML = '';
      const act = SOUNDS.filter(s => state[s.id].active);
      act.forEach(s => {
        const base = baseVol[s.id] !== undefined ? baseVol[s.id] : state[s.id].volume;
        const v = Math.max(1, Math.min(100, Math.round(base * atmoMult(s.id) * 100)));
        const row = document.createElement('div');
        row.className = 'layer';
        row.innerHTML =
          '<span class="ic">' + IC[s.id] + '</span>' +
          '<span class="body"><span class="nm"></span>' +
          '<input type="range" min="0" max="100" value="' + v + '" style="--val:' + v + '%"></span>' +
          '<button class="off">×</button>';
        row.querySelector('.nm').textContent = charName(s.id);
        const sl = row.querySelector('input');
        sl.addEventListener('input', e => {
          const val = e.target.value;
          haptics.slider(+val);
          e.target.style.setProperty('--val', val + '%');
          // Пользователь задал итоговую громкость — пересчитываем базу,
          // чтобы быстрые контролы не перетёрли его выбор
          baseVol[s.id] = (val / 100) / atmoMult(s.id);
          setVolume(s.id, val / 100);
          if (paused) resumeAll();
          scheduleSave();
          refreshNow();
        });
        row.querySelector('.off').addEventListener('click', () => toggleSound(s.id));
        layersBox.appendChild(row);
      });
      document.getElementById('head-layers').style.display = act.length ? '' : 'none';
    }

    // Библиотека — вкладки категорий, карточки без ползунков:
    // громкость живёт в слоях, здесь только «есть / нет»
    const tabsBox = document.getElementById('tabs');
    const panesBox = document.getElementById('panes');
    let activeCat = 0;

    CATS.forEach((c, i) => {
      const tab = document.createElement('button');
      tab.className = 'tab' + (i === 0 ? ' active' : '');
      tab.dataset.cat = c.id;
      tab.addEventListener('click', () => { haptics.selection(); showCat(i); });
      tabsBox.appendChild(tab);

      const pane = document.createElement('div');
      pane.className = 'pane' + (i === 0 ? ' active' : '');
      const grid = document.createElement('div');
      grid.className = 'grid';
      pane.appendChild(grid);
      panesBox.appendChild(pane);

      c.sounds.forEach(s => {
        const card = document.createElement('div');
        card.className = 'card' + (allowed(s) ? '' : ' blocked');
        card.id = 'card-' + s.id;
        const badge = !allowed(s) ? LOCK : (s.hp ? HP : '');
        card.innerHTML =
          '<div class="spinner"></div>' + badge +
          '<div class="card-icon">' + IC[s.id] + '</div>' +
          '<div class="card-name" data-name="' + s.id + '"></div>';
        card.addEventListener('click', () => toggleSound(s.id));
        grid.appendChild(card);
      });
    });

    function showCat(i) {
      activeCat = Math.max(0, Math.min(CATS.length - 1, i));
      tabsBox.querySelectorAll('.tab').forEach((el, k) => el.classList.toggle('active', k === activeCat));
      panesBox.querySelectorAll('.pane').forEach((el, k) => el.classList.toggle('active', k === activeCat));
      const tab = tabsBox.children[activeCat];
      if (tab) tab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    let tx = 0, ty = 0;
    panesBox.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
    panesBox.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.8) showCat(activeCat + (dx < 0 ? 1 : -1));
    }, { passive: true });

    const setCardLoading = (id, on) => document.getElementById('card-' + id)?.classList.toggle('loading', on);
    const syncCards = () => SOUNDS.forEach(s =>
      document.getElementById('card-' + s.id)?.classList.toggle('active', state[s.id].active));

    function toggleSound(id) {
      const s = byId(id);
      if (!allowed(s)) { showPaywall('lock'); return; }
      haptics.light();
      const st = state[id];
      st.active = !st.active;
      if (st.active) {
        if (!anyActive()) startedAt = Date.now();
        // Вписываем новый звук в атмосферу: чем плотнее занята его
        // спектральная полоса, тем тише он входит (частотное маскирование)
        const band = PROF[id]?.band;
        const busy = SOUNDS.filter(x => x.id !== id && state[x.id].active &&
          (PROF[x.id]?.band === band || PROF[x.id]?.band === 'broad' || band === 'broad')).length;
        let fit = Math.max(0.45, 1 - 0.16 * busy);
        // Второй тон входит тише и приглушает первый: одна атмосфера,
        // а не два инструмента, спорящих между собой
        if (TONAL.has(id)) {
          const tActive = SOUNDS.filter(x => x.id !== id && state[x.id].active && TONAL.has(x.id));
          if (tActive.length) {
            fit *= 0.6;
            tActive.forEach(x => {
              baseVol[x.id] = (baseVol[x.id] ?? state[x.id].volume) * 0.7;
              setVolume(x.id, Math.min(1, baseVol[x.id] * atmoMult(x.id)), 1.2);
            });
          }
        }
        // Шумовые ковры не должны глушить голоса и объявления
        if (NOISY.has(id) && SOUNDS.some(x => state[x.id].active && VOICE.has(x.id))) fit *= 0.85;
        const v = Math.max(0.12, Math.min(1, s.def * fit));
        baseVol[id] = v;
        state[id].volume = Math.min(1, v * atmoMult(id));
        if (fit < 0.85) showToast(t('fitted'));
        startSound(id);
        if (paused) resumeAll();
      }
      else stopSound(id);
      if (!anyActive()) { current = null; cancelTimer(); }
      clearMixHighlight();
      scheduleSave();
      refreshAll();
    }

    // ═══════════════════════════════════════════════════════════════
    //  Свои миксы и последнее состояние
    // ═══════════════════════════════════════════════════════════════
    const STORE_KEY = 'tishina_v2', OLD_KEY = 'tishina_v1', MAX_MIXES = 8;

    const loadStore = () => {
      try {
        const s = JSON.parse(localStorage.getItem(STORE_KEY));
        if (s) return s;
        // Переезд со старой версии: миксы человека не теряем
        const old = JSON.parse(localStorage.getItem(OLD_KEY));
        if (old) return { presets: old.presets || [], last: old.last ? { mix: old.last, ref: null } : null };
      } catch (e) {}
      return { presets: [], last: null };
    };
    const saveStore = d => { try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch (e) {} };

    function saveLast() {
      const s = loadStore();
      s.last = anyActive() ? { mix: currentMix(), ref: current, atmo: { ...atmo }, ts: Date.now() } : null;
      saveStore(s);
    }
    let saveDebounce = null;
    const scheduleSave = () => { clearTimeout(saveDebounce); saveDebounce = setTimeout(saveLast, 600); };

    let activeMix = null;
    const clearMixHighlight = () => {
      activeMix = null;
      document.querySelectorAll('.mix-btn').forEach(b => b.classList.remove('active'));
    };

    const mixesBox = document.getElementById('mixes');

    function renderMixes() {
      const presets = loadStore().presets;
      mixesBox.innerHTML = '';
      document.getElementById('head-mixes').style.display = presets.length ? '' : 'none';
      mixesBox.style.display = presets.length ? '' : 'none';
      presets.forEach((p, i) => {
        const b = document.createElement('button');
        b.className = 'mix-btn' + (activeMix === i ? ' active' : '');
        b.innerHTML = '<span></span><span class="del">×</span>';
        b.querySelector('span').textContent = p.name;
        b.addEventListener('click', e => {
          if (e.target.classList.contains('del')) {
            e.stopPropagation();
            haptics.light();
            const s = loadStore(); s.presets.splice(i, 1); saveStore(s);
            renderMixes(); showToast(t('deleted')); return;
          }
          if (activeMix === i) { haptics.medium(); stopAll(); renderMixes(); return; }
          haptics.medium();
          activeMix = i;
          startTrialIfNeeded();
          current = { name: p.name };
          startedAt = Date.now();
          memBegin();
          cancelTimer();
          applyMix(p.mix, SCENE_FADE);
          saveLast();
          refreshAll();
          renderMixes();
        });
        mixesBox.appendChild(b);
      });
    }

    const modal = document.getElementById('modal');
    const nameInput = document.getElementById('preset-name');

    document.getElementById('btn-save').addEventListener('click', () => {
      if (!anyActive()) { showToast(t('needSounds')); return; }
      if (loadStore().presets.length >= MAX_MIXES) { showToast(t('maxPresets')); return; }
      document.getElementById('modal-hint').textContent =
        SOUNDS.filter(s => state[s.id].active).map(s => nm(s.id)).join(', ');
      const l = label();
      nameInput.value = l.sub && !current?.name ? l.sub : '';
      modal.classList.add('open');
      setTimeout(() => nameInput.focus(), 50);
    });

    const closeModal = () => modal.classList.remove('open');
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.getElementById('modal-ok').addEventListener('click', doSave);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSave(); });

    function doSave() {
      haptics.success();
      const name = nameInput.value.trim() || (lang === 'ru' ? 'Мой микс' : 'My mix');
      const s = loadStore();
      s.presets.push({ name, mix: currentMix() });
      saveStore(s);
      renderMixes(); closeModal();
      showToast(t('saved') + ': ' + name);
    }

    // ═══════════════════════════════════════════════════════════════
    //  ЖИВОЕ ПРОСТРАНСТВО. Раньше это была кнопка «Оживить» — теперь
    //  свойство среды. Два механизма.
    //
    //  Дыхание: у каждого слоя свой период и своя глубина. Когда все
    //  слои дышали одним тиком и одной амплитудой, пять источников
    //  читались как один общий луп — именно то ощущение дешёвого
    //  зацикливания, от которого надо было уйти.
    //
    //  События: дальняя гроза приходит и уходит, огонь вспыхивает,
    //  ветер идёт порывом. Событие — всегда отклонение уже звучащего
    //  слоя: новых слоёв не появляется, состав среды не меняется,
    //  «изменено» не загорается, микс не портится.
    // ═══════════════════════════════════════════════════════════════
    const BREATH = {
      rain:{p:1,a:0.11}, thunder:{p:4,a:0.16}, waves:{p:1,a:0.15}, wind:{p:1,a:0.17},
      fire:{p:1,a:0.15}, birds:{p:2,a:0.16},
      cafe:{p:2,a:0.10}, office:{p:3,a:0.07}, street:{p:2,a:0.11}, shop:{p:2,a:0.10},
      park:{p:2,a:0.12}, crowd:{p:2,a:0.13}, window:{p:1,a:0.10}, hearth:{p:1,a:0.13},
      highway:{p:2,a:0.09}, airport:{p:3,a:0.09},
      plane:{p:4,a:0.05}, car:{p:2,a:0.10}, train:{p:2,a:0.09}, metro:{p:2,a:0.10},
      bus:{p:2,a:0.09}, boat:{p:2,a:0.11},
    };
    // Тональные слои почти не дышат: качающийся тон слышен как фальшь
    const breathOf = id => TONAL.has(id) ? { p:6, a:0.03 } : (BREATH[id] || { p:3, a:0.08 });
    const breathPhase = {};
    SOUNDS.forEach((s, i) => { breathPhase[s.id] = (i * 5) % 7; });

    const evtBusy = new Set();
    let breathTick = 0;

    setInterval(() => {
      if (paused || !anyActive()) return;
      breathTick++;
      const night = sleepMode ? 0.45 : 1;
      SOUNDS.forEach(s => {
        if (!state[s.id].active || evtBusy.has(s.id)) return;
        const b = breathOf(s.id);
        const per = sleepMode ? b.p * 2 : b.p;
        if ((breathTick + breathPhase[s.id]) % per !== 0) return;
        const step = (Math.random() - 0.5) * b.a * night;
        const next = Math.min(0.98, Math.max(0.04, state[s.id].volume + step));
        setVolume(s.id, next, sleepMode ? 20 : 7);
      });
    }, 9000);

    // peak — насколько слой выходит вперёд; in / hold / out — секунды.
    // Приход всегда медленнее ухода наоборот: событие должно
    // подкрадываться, а не включаться.
    const EVENTS = {
      thunder: { peak:0.24, in:35, hold:25, out:50 },
      rain:    { peak:0.16, in:45, hold:40, out:70 },
      fire:    { peak:0.20, in:10, hold:6,  out:22 },
      hearth:  { peak:0.14, in:12, hold:8,  out:26 },
      waves:   { peak:0.15, in:16, hold:8,  out:28 },
      wind:    { peak:0.18, in:30, hold:20, out:50 },
      birds:   { peak:0.17, in:18, hold:14, out:34 },
      crowd:   { peak:0.11, in:24, hold:16, out:40 },
      street:  { peak:0.11, in:22, hold:14, out:38 },
      cafe:    { peak:0.10, in:26, hold:18, out:44 },
      park:    { peak:0.12, in:22, hold:16, out:40 },
      metro:   { peak:0.10, in:20, hold:10, out:32 },
      car:     { peak:0.10, in:16, hold:8,  out:28 },
      boat:    { peak:0.12, in:20, hold:12, out:34 },
    };

    let evtTimer = null;
    const evtToken = () => current ? (current.st || '') + ':' + (current.env || '') + ':' + (current.name || '') : '';

    function scheduleEvent() {
      clearTimeout(evtTimer);
      // Ночью события реже и слабее, после засыпания их нет вовсе
      const base = sleepMode ? 210000 : 75000;
      evtTimer = setTimeout(runEvent, base + Math.random() * base);
    }

    function runEvent() {
      scheduleEvent();
      if (paused || !anyActive() || (sleepMode && sleepHushed)) return;
      const pool = SOUNDS.filter(s => state[s.id].active && EVENTS[s.id] && !evtBusy.has(s.id));
      if (!pool.length) return;
      const id = pool[Math.floor(Math.random() * pool.length)].id;
      const e = EVENTS[id];
      const base = state[id].volume;
      const lift = e.peak * (sleepMode ? 0.35 : 0.7 + Math.random() * 0.6);
      const token = evtToken();
      const alive = () => state[id].active && !paused && token === evtToken();
      evtBusy.add(id);
      setVolume(id, Math.min(0.98, base + lift), e.in);
      setTimeout(() => {
        if (!alive()) { evtBusy.delete(id); return; }
        setVolume(id, base, e.out);
        setTimeout(() => evtBusy.delete(id), e.out * 1000);
      }, (e.in + e.hold) * 1000);
    }
    // Первый отсчёт откладываем: на старте скрипта sleepMode ещё не объявлен
    setTimeout(scheduleEvent, 20000);

    // Журнал пишется на ходу: приложение могут закрыть в любой момент,
    // и час сна не должен пропасть из-за этого
    setInterval(() => { if (!paused && anyActive()) memAccrue(); }, 30000);
    document.addEventListener('visibilitychange', () => { if (document.hidden) memAccrue(); });
    window.addEventListener('pagehide', () => memAccrue());

    // ═══════════════════════════════════════════════════════════════
    //  Таймер
    // ═══════════════════════════════════════════════════════════════
    let timerTimeout = null, fadeTimeout = null, timerEnd = null;
    const btnTimer = document.getElementById('btn-timer');
    const timerMenu = document.getElementById('timer-menu');

    btnTimer.addEventListener('click', e => { e.stopPropagation(); timerMenu.classList.toggle('open'); });
    timerMenu.querySelectorAll('.timer-option').forEach(o => {
      o.addEventListener('click', () => {
        const m = parseInt(o.dataset.min, 10);
        timerMenu.classList.remove('open');
        if (m === 0) { haptics.light(); cancelTimer(); }
        else { setTimer(m); haptics.success(); }
        refreshNow();
      });
    });

    function setTimer(min) {
      clearTimers();
      const ms = min * 60000;
      timerEnd = Date.now() + ms;
      const night = isSleepEnv();
      sleepArm(night ? min : 0);
      // Днём звук гаснет за полминуты. Ночью гасить нечего:
      // громкость шла вниз всю ночь и к этому моменту уже почти ноль.
      if (!night) {
        fadeTimeout = setTimeout(() => {
          clockEl.classList.add('fading');
          setMasterVolume(0.0001, TIMER_FADE);
        }, Math.max(0, ms - TIMER_FADE * 1000));
      }
      timerTimeout = setTimeout(() => {
        const wasNight = sleepMode;
        stopAll(); masterVol = 1;
        if (!wasNight) showToast(t('timerDone'));   // ночью будить некого
      }, ms);
      btnTimer.classList.add('active');
      updateClock();
    }

    function clearTimers() {
      [timerTimeout, fadeTimeout].forEach(x => x && clearTimeout(x));
      timerTimeout = fadeTimeout = null;
    }

    function cancelTimer() {
      clearTimers();
      sleepDisarm();
      timerEnd = null;
      btnTimer.classList.remove('active');
      clockEl.classList.remove('fading', 'timer');
      // Если звука уже нет, громкость возвращаем молча: иначе на самом
      // конце ночи мастер успел бы подняться и стать слышным
      if (masterVol < 1) { if (anyActive()) setMasterVolume(1, 0.5); else masterVol = 1; }
    }

    // ═══════════════════════════════════════════════════════════════
    //  ГЛУБОКИЙ СОН. Единственный сценарий, где продукт работает
    //  часами без человека. Правило одно: ТИШИНА знает, когда
    //  исчезнуть — и делает это так, что момент невозможно заметить.
    // ═══════════════════════════════════════════════════════════════
    const WAKE_HOUR = 7;
    const NIGHT_FREE_MIN = 90;      // без глубокой тишины ночь короче
    const SLEEP_HUSH_AT = 12;       // мин — когда уходят пиковые слои
    // Слои, которые умеют вздрогнуть: гром, голоса, объявления
    const SPIKY = new Set(['thunder', 'birds', 'crowd', 'airport', 'shop', 'street']);

    let sleepMode = false, sleepStart = 0, sleepEnd = 0, sleepTicker = null, sleepHushed = false;

    const isSleepEnv = () => !!(current && !current.name && stateById(current.st)?.night);
    const nightAllowed = () => accessNow() !== 'free';

    // Сколько на самом деле осталось до утра — не абстрактные «8 часов»
    function tillMorningMin() {
      const now = new Date();
      const w = new Date(now.getTime());
      w.setHours(WAKE_HOUR, 0, 0, 0);
      if (w.getTime() <= now.getTime()) w.setDate(w.getDate() + 1);
      return Math.max(60, Math.min(600, Math.round((w.getTime() - now.getTime()) / 60000)));
    }
    const nightDefaultMin = () => nightAllowed() ? tillMorningMin() : NIGHT_FREE_MIN;

    function morningText() {
      const m = tillMorningMin(), h = Math.floor(m / 60), r = m % 60;
      return h + ' ' + t('hourShort') + (r ? ' ' + r : '');
    }
    const nightDefaultText = () =>
      nightAllowed() ? t('tillMorning').toLowerCase() : NIGHT_FREE_MIN + ' ' + t('min');

    // ── Кривая ночи ──
    // Держим · засыпаем · поддерживаем · растворяемся.
    // Ни одного слышимого перехода: всё квадратично и медленно.
    function sleepGain(elapsed, total) {
      if (elapsed >= total) return 0;
      const dissolve = Math.min(25, total * 0.2);      // хвост растворения
      const endFade = total - dissolve;
      const hold = Math.min(15, total * 0.15);         // пока человек ещё не спит
      const asleep = Math.min(hold + 45, endFade);     // к этому часу он уже спит
      const DEEP = 0.45, FLOOR = 0.22;

      // Уровень до начала растворения
      const level = x => {
        if (x <= hold) return 1;
        if (x <= asleep) {
          const k = (x - hold) / Math.max(0.001, asleep - hold);
          return 1 - (1 - DEEP) * k * k;               // 1.00 → 0.45, начало незаметно
        }
        const k = (x - asleep) / Math.max(0.001, endFade - asleep);
        return DEEP - (DEEP - FLOOR) * k;              // 0.45 → 0.22, почти плато
      };
      if (elapsed < endFade) return level(elapsed);
      // Растворение начинается ровно с той громкости, что была: короткий
      // сон не должен спотыкаться о ступеньку в середине кривой
      const k = (elapsed - endFade) / dissolve;
      return level(endFade) * (1 - k) * (1 - k);
    }

    function sleepArm(totalMin) {
      sleepDisarm();
      if (!totalMin) return;
      sleepMode = true;
      sleepStart = Date.now();
      sleepEnd = sleepStart + totalMin * 60000;
      sleepHushed = false;
      document.body.classList.add('night');
      sleepTicker = setInterval(sleepTick, 15000);
      nightPoke();
      sleepTick();
    }

    function sleepDisarm() {
      if (sleepTicker) clearInterval(sleepTicker);
      sleepTicker = null;
      sleepMode = false;
      sleepHushed = false;
      document.body.classList.remove('night', 'night-deep');
      clearTimeout(nightIdle);
    }

    // Считаем от настенных часов, а не от числа тиков: систему можно
    // свернуть, усыпить и притормозить — ночь всё равно пойдёт по кривой
    function sleepTick() {
      if (!sleepMode || paused || !anyActive()) return;
      const total = (sleepEnd - sleepStart) / 60000;
      const elapsed = (Date.now() - sleepStart) / 60000;
      setMasterVolume(Math.max(0.0001, sleepGain(elapsed, total)), 16);
      if (!sleepHushed && elapsed >= SLEEP_HUSH_AT) { sleepHushed = true; sleepHush(); }
      if (document.body.classList.contains('night-deep')) renderVeil();
    }

    // Гром хорош, пока человек его слушает. Спящего он будит.
    function sleepHush() {
      let gone = false;
      SOUNDS.forEach(s => {
        if (!state[s.id].active || !SPIKY.has(s.id)) return;
        state[s.id].active = false;
        stopSound(s.id, 90);        // полторы минуты — исчезает незаметно
        gone = true;
      });
      if (gone) { renderLayers(); refreshNow(); }
    }

    // ── Ночной экран. Свет — тоже звук, только для глаз ──
    const veil = document.getElementById('night-veil');
    let nightIdle = null;

    function renderVeil() {
      const l = label();
      veil.querySelector('.nv-nm').textContent = l.sub || l.top;
      const left = Math.max(0, sleepEnd - Date.now());
      veil.querySelector('.nv-ds').textContent =
        left > 60000 ? t('left') + ' ' + durText(left / 60000) : '';
      veil.querySelector('.nv-hint').textContent = t('tapToWake');
    }

    function nightPoke() {
      document.body.classList.remove('night-deep');
      clearTimeout(nightIdle);
      if (!sleepMode) return;
      nightIdle = setTimeout(() => {
        if (sleepMode && !paused && anyActive()) { renderVeil(); document.body.classList.add('night-deep'); }
      }, 45000);
    }
    document.addEventListener('pointerdown', () => { if (sleepMode) nightPoke(); }, true);

    document.addEventListener('click', e => {
      if (!e.target.closest('.timer-wrap')) timerMenu.classList.remove('open');
    });

    // ═══════════════════════════════════════════════════════════════
    //  Поделиться, тост, шторка уведомлений
    // ═══════════════════════════════════════════════════════════════
    document.getElementById('btn-share').addEventListener('click', () => {
      const p = new URLSearchParams();
      const cm = currentMix();
      Object.keys(cm).forEach(id => p.set(id, cm[id]));
      if (current && !current.name) { p.set('st', current.st); p.set('env', current.env); }
      const url = location.origin + location.pathname + (p.toString() ? '?' + p : '');
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(url).then(() => showToast(t('copied')), () => showToast(t('linkReady')));
      } else showToast(t('linkReady'));
    });

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2500);
    }

    // Обработчики локскрина регистрируются один раз — без переподписок
    // на каждый апдейт (лишний повод для системы дёргать сессию)
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.setActionHandler('pause', () => pauseAll());
        navigator.mediaSession.setActionHandler('play', () => resumeAll());
        navigator.mediaSession.setActionHandler('stop', () => stopAll());
      } catch (e) {}
    }

    function updateMediaSession() {
      if (!('mediaSession' in navigator)) return;
      const playing = anyActive() && !paused;
      navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
      if (playing) {
        const l = label();
        // На локскрине: «Океан — Тишина — Уснуть»
        navigator.mediaSession.metadata = new MediaMetadata({
          title: l.sub || l.top || t('brand'),
          artist: t('brand'),
          album: l.top || t('brand')
        });
      }
    }

    function wake() {
      if (paused) return;
      if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {});
      let killed = 0;
      SOUNDS.forEach(s => {
        const el = els[s.id];
        if (state[s.id].active && el && el.paused) { killed++; el.play().catch(() => {}); }
      });
      // Система оборвала фон — сами подняли звук и один раз объясняем,
      // где он не прерывается. Пока фон живёт, подсказки нет.
      if (killed > 0) scheduleHint(1500);
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
    window.addEventListener('focus', wake);
    window.addEventListener('pageshow', wake);

    // ═══════════════════════════════════════════════════════════════
    //  Подсказка про фон на iPhone
    // ═══════════════════════════════════════════════════════════════
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
               || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const inTelegram = !!TG?.initData || !!TG?.platform;
    const HINT_KEY = 'tishina_hint_bg';
    const hint = document.getElementById('hint');

    let hintTimer = null, hintDelay = Infinity;
    function scheduleHint(delay = 20000) {
      if (!isIOS || !inTelegram) return;
      try { if (localStorage.getItem(HINT_KEY)) return; } catch (e) {}
      if (hintTimer) {
        if (delay >= hintDelay) return;
        clearTimeout(hintTimer);
      }
      hintDelay = delay;
      hintTimer = setTimeout(() => { if (anyActive()) hint.classList.add('show'); }, delay);
    }
    function hideHint(forever) {
      hint.classList.remove('show');
      if (forever) { try { localStorage.setItem(HINT_KEY, '1'); } catch (e) {} }
    }
    document.getElementById('hint-close').addEventListener('click', () => hideHint(true));
    document.getElementById('hint-open').addEventListener('click', () => {
      const p = new URLSearchParams();
      const cm = currentMix();
      Object.keys(cm).forEach(id => p.set(id, cm[id]));
      if (current && !current.name) { p.set('st', current.st); p.set('env', current.env); }
      if (IS_PRO) p.set('pro', '1');
      p.set('lang', lang);
      const url = location.origin + location.pathname + '?' + p;
      hideHint(true);
      if (TG?.openLink) TG.openLink(url, { try_instant_view: false });
      else window.open(url, '_blank');
    });

    // ═══════════════════════════════════════════════════════════════
    //  Экран подписки
    // ═══════════════════════════════════════════════════════════════
    const INVOICE = QS.get('inv') || '';
    const payBox = document.getElementById('pay');

    function showPaywall(mode) {
      const list = document.getElementById('pay-list');
      list.innerHTML = '';
      t('payRows').forEach(([head, sub]) => {
        const row = document.createElement('div');
        row.className = 'pay-row';
        row.innerHTML = '<span class="dot"></span><span class="rt"></span>';
        const rt = row.querySelector('.rt');
        rt.textContent = head;
        const sm = document.createElement('small');
        sm.textContent = sub;
        rt.appendChild(sm);
        list.appendChild(row);
      });
      document.getElementById('pay-title').textContent = t('payTitle');
      // Язык продукта, не тарифа: контекст замка или мягкое окончание пробного
      document.getElementById('pay-sub').textContent =
        mode === 'expired' ? t('payExpired')
        : mode === 'lock' ? t('payCtx') + ' ' + t('paySub')
        : t('paySub');
      document.getElementById('pay-cta').textContent =
        accessNow() === 'free' ? t('payCtaDeep') : t('payCta');
      document.getElementById('pay-note').textContent  = t('payNote');
      document.getElementById('pay-close').textContent =
        accessNow() === 'free' ? t('payCloseFree') : t('payClose');

      const rb = document.getElementById('pay-ref'), rn = document.getElementById('pay-ref-note');
      rb.textContent = t('refCta');
      rn.textContent = t('refLine');
      rb.classList.toggle('on', canInvite());
      rn.classList.toggle('hide', !canInvite());

      payBox.classList.add('open');
    }

    // ═══════════════════════════════════════════════════════════════
    //  ПРИГЛАСИТЬ. У пейволла всегда два выхода: заплатить или позвать.
    //  Второй честнее продаёт продукт, чем первый: человек ручается
    //  за него своим именем. Дни разные — 14 позвавшему, 7 пришедшему:
    //  тот, кто зовёт, тратит больше, а другу нужно ровно столько,
    //  чтобы прожить неделю и понять, нужна ли ему Тишина.
    // ═══════════════════════════════════════════════════════════════
    const BOT_USER = 'Kingtsugi_music_bot';
    const canInvite = () => !!UID;
    const refLink = () => 'https://t.me/' + BOT_USER + '?start=ref' + UID;

    function invite() {
      if (!canInvite()) return;
      hap('medium');
      const url = 'https://t.me/share/url?url=' + encodeURIComponent(refLink()) +
                  '&text=' + encodeURIComponent(t('refShare'));
      if (TG?.openTelegramLink) { try { TG.openTelegramLink(url); return; } catch (e) {} }
      // Вне Telegram делиться нечем — оставляем ссылку в буфере
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(refLink()).then(() => showToast(t('refCopied')), () => {});
      } else showToast(t('refCopied'));
    }

    ['pay-ref', 'me-ref-btn'].forEach(id =>
      document.getElementById(id).addEventListener('click', invite));

    const hidePaywall = () => payBox.classList.remove('open');
    document.getElementById('pay-close').addEventListener('click', hidePaywall);
    payBox.addEventListener('click', e => { if (e.target === payBox) hidePaywall(); });

    document.getElementById('pay-cta').addEventListener('click', () => {
      if (!INVOICE || !TG?.openInvoice) { showToast(t('payNoLink')); return; }
      TG.openInvoice(INVOICE, status => {
        if (status === 'paid') {
          hidePaywall();
          showToast('✓ Premium');
          try { localStorage.setItem(PRO_KEY, String(UID)); } catch (e) {}
          setTimeout(() => location.reload(), 900);
        }
      });
    });

    // ═══════════════════════════════════════════════════════════════
    //  Язык
    // ═══════════════════════════════════════════════════════════════
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = lang === 'ru' ? 'ТИШИНА' : 'TISHINA';
      ['brand', 'brand2', 'brand3', 'brand4'].forEach(id => { document.getElementById(id).textContent = t('brand'); });

      const lb = document.getElementById('lang');
      lb.textContent = lang === 'ru' ? '🇺🇸' : '🪆';
      lb.title = lang === 'ru' ? 'English' : 'Русский';

      document.getElementById('ask').textContent = t('ask');
      document.getElementById('ask-sub').innerText = t('askSub');
      document.getElementById('head-mixes').textContent = t('headMixes');
      document.getElementById('head-layers').textContent = t('headLayers');
      document.getElementById('head-add').textContent = t('headAdd');
      document.getElementById('head-atmo').textContent = t('headAtmo');
      document.getElementById('lv-soft').textContent = t('atmoSoft');
      document.getElementById('lv-mid').textContent = t('atmoMid');
      document.getElementById('lv-rich').textContent = t('atmoRich');
      document.getElementById('warm-l').textContent = t('warmL');
      document.getElementById('warm-r').textContent = t('warmR');
      document.getElementById('alive-l').textContent = t('aliveL');
      document.getElementById('alive-r').textContent = t('aliveR');
      toggleDetail.textContent = detailOpen ? t('detailClose') : t('detailOpen');

      renderStates();

      tabsBox.querySelectorAll('.tab').forEach(el => { el.textContent = t(el.dataset.cat); });
      document.querySelectorAll('[data-name]').forEach(el => { el.textContent = nm(el.dataset.name); });

      btnTimer.textContent = t('timer');
      btnTune.textContent  = t('tune');
      document.getElementById('btn-save').textContent  = t('save');
      document.getElementById('btn-share').textContent = t('share');

      timerMenu.querySelectorAll('.timer-option').forEach(o => {
        o.textContent = o.dataset.min === '0' ? t('cancel') : o.dataset.min + ' ' + t('min');
      });

      document.getElementById('hint-text').innerHTML    = t('hintText');
      document.getElementById('hint-open').textContent  = t('hintOpen');
      document.getElementById('hint-close').textContent = t('hintClose');

      document.getElementById('modal-title').textContent  = t('saveTitle');
      document.getElementById('modal-cancel').textContent = t('cancel');
      document.getElementById('modal-ok').textContent     = t('save');
      nameInput.placeholder = t('namePh');

      if (openedState && view === 'state') openState(stateById(openedState));
      if (view === 'tune') openTune();
      if (view === 'me') openMe();
      refreshAll();
    }

    document.getElementById('lang').addEventListener('click', () => {
      haptics.selection();
      lang = lang === 'ru' ? 'en' : 'ru';
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
      applyLang();
      updateMediaSession();
    });

    // ═══════════════════════════════════════════════════════════════
    //  Восстановление: ссылка → последнее состояние → пустой экран
    // ═══════════════════════════════════════════════════════════════
    (() => {
      let mix = {}, ref = null, fromUrl = false;

      const qsSt = QS.get('st'), qsEnv = QS.get('env');
      if (qsSt && qsEnv) {
        const st = stateById(qsSt);
        const env = st?.envs.find(e => e.id === qsEnv);
        if (env) { mix = { ...env.mix }; ref = { st: st.id, env: env.id }; fromUrl = true; }
      }
      SOUNDS.forEach(s => {
        const v = QS.get(s.id);
        if (v === null) return;
        const n = Math.max(0, Math.min(100, parseInt(v, 10) || 0));
        if (!fromUrl) mix = {};
        if (n > 0) { mix[s.id] = n; fromUrl = true; }
      });

      // Сессию подхватываем, только если она ещё «та же». Вчерашний
      // океан — это не «Сейчас», это повод предложить вернуться.
      const RESUME_WINDOW = 6 * 3600000;
      let savedAtmo = null;
      if (!fromUrl) {
        const last = loadStore().last;
        const fresh = !!(last && last.ts && Date.now() - last.ts < RESUME_WINDOW);
        if (fresh && last.mix && Object.keys(last.mix).length) {
          mix = last.mix; ref = last.ref || null; savedAtmo = last.atmo || null;
          // «12 минут назад» на карточке — мостик обратно в состояние
          if (last.ts) {
            const d = Date.now() - last.ts;
            if (d < 90 * 1000) agoText = t('agoJust');
            else if (d < 60 * 60000) agoText = Math.round(d / 60000) + ' ' + t('agoMin');
            else if (d < 12 * 3600000) agoText = Math.round(d / 3600000) + ' ' + t('agoH');
          }
        }
      }
      if (!Object.keys(mix).length) return;

      current = ref;
      startedAt = Date.now();
      if (savedAtmo) Object.assign(atmo, savedAtmo);
      SOUNDS.forEach(s => {
        const v = (mix[s.id] || 0) / 100;
        if (v <= 0 || !allowed(s)) return;
        state[s.id] = { active: true, volume: v };
        baseVol[s.id] = v / atmoMult(s.id);
      });
      syncAtmoUI();

      // Браузер не даёт играть без касания. Вместо молчаливой карточки
      // показываем состояние на паузе — кнопка «Продолжить» и есть касание.
      paused = true;
      showToast(t('resumeHint'));
    })();

    // ── Статус доступа: тихо, без обратного отсчёта ──
    function refreshAccessLine() {
      const el = document.getElementById('access-line');
      const a = accessNow();
      if (a !== 'trial') { el.classList.remove('on'); return; }
      const left = trialStartTs() + TRIAL_MS - Date.now();
      el.textContent = left < 6 * 3600000 ? t('accessEnding') : t('accessTrial');
      el.classList.add('on');
    }
    setInterval(refreshAccessLine, 60000);

    applyLang();
    renderMixes();
    showView('now');
    refreshAccessLine();

    // Пробная тишина закончилась — говорим об этом один раз, мягко,
    // и человек остаётся с бесплатными звуками, а не перед стеной
    if (accessNow() === 'free') {
      let seen = null;
      try { seen = localStorage.getItem(TRIALEND_KEY); } catch (e) {}
      if (!seen) {
        try { localStorage.setItem(TRIALEND_KEY, '1'); } catch (e) {}
        setTimeout(() => showPaywall('expired'), 1200);
      }
    }

    // ── Dev-панель: ?dev=1 — новый / trial / истёк / deep ──
    if (QS.get('dev') === '1') {
      // Ночь длится восемь часов — проверять её иначе нечем
      window.TISHINA = {
        sleepGain, sleepTick, tillMorningMin, sleepGainAt: (e, tot) => sleepGain(e, tot),
        get sleepMode() { return sleepMode; },
        get master() { return masterVol; },
        get elapsed() { return (Date.now() - sleepStart) / 60000; },
        get total() { return (sleepEnd - sleepStart) / 60000; },
        rewind(min) { sleepStart -= min * 60000; sleepEnd -= min * 60000; },
        veil() { renderVeil(); document.body.classList.add('night-deep'); },
        nightText: () => nightDefaultText(),
        get layers() { return SOUNDS.filter(x => state[x.id].active).map(x => x.id); },
        runEvent, currentMix, mixMatchesEnv, charName, charOf,
        vol: id => state[id].volume,
        base: id => baseVol[id],
        cutoff: id => nodes[id] && nodes[id].chr ? Math.round(nodes[id].chr.frequency.value) : null,
        busy: () => [...evtBusy],
        breathe(n) { for (let i = 0; i < n; i++) { breathTick++; SOUNDS.forEach(s => {
          if (!state[s.id].active || evtBusy.has(s.id)) return;
          const b = breathOf(s.id), per = sleepMode ? b.p * 2 : b.p;
          if ((breathTick + breathPhase[s.id]) % per !== 0) return;
          setVolume(s.id, Math.min(0.98, Math.max(0.04, state[s.id].volume + (Math.random() - 0.5) * b.a)), 0.05);
        }); } },
      };
    }
    if (QS.get('dev') === '1') {
      const dv = document.createElement('div');
      dv.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:900;display:flex;gap:4px;opacity:0.85';
      [
        ['new',   () => { localStorage.removeItem(TRIAL_KEY); localStorage.removeItem(TRIALEND_KEY); localStorage.removeItem(PRO_KEY); }],
        ['trial', () => { localStorage.setItem(TRIAL_KEY, JSON.stringify({ uid: UID, start: Date.now() })); localStorage.removeItem(PRO_KEY); }],
        ['ended', () => { localStorage.setItem(TRIAL_KEY, JSON.stringify({ uid: UID, start: Date.now() - TRIAL_MS - 1000 })); localStorage.removeItem(TRIALEND_KEY); localStorage.removeItem(PRO_KEY); }],
        ['deep',  () => { localStorage.setItem(PRO_KEY, String(UID)); }],
      ].forEach(([nmx, fn]) => {
        const bb = document.createElement('button');
        bb.textContent = nmx;
        bb.style.cssText = 'padding:6px 10px;font-size:11px;background:#222;color:#d0a94e;border:1px solid #444;border-radius:8px';
        bb.addEventListener('click', () => { fn(); location.href = location.pathname + '?dev=1&lang=' + lang; });
        dv.appendChild(bb);
      });
      document.body.appendChild(dv);
    }

  })();
  </script>

</body>
