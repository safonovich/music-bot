<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ТИШИНА</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #0c0b09;
      --card-active: #17130a;
      --line: #221d13;
      --accent: #d0a94e;
      --accent-soft: rgba(208, 169, 78, 0.24);
      --text: #ece3cf;
      --text-dim: #7c756a;
      --radius: 18px;
      --top: max(env(safe-area-inset-top, 0px), 12px);
      --bottom: max(env(safe-area-inset-bottom, 0px), 10px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─────────────────────────── Экраны ─────────────────────────── */
    .view {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: calc(var(--bottom) + 20px);
      animation: viewIn 0.28s ease;
    }
    .view.on { display: flex; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(var(--top) + 44px) 16px 4px;
      min-height: 30px;
    }
    .topbar .brand {
      font-size: 14px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      flex: 1;
    }
    .topbar.center .brand { text-align: center; }

    #access-line {
      display: none;
      padding: 2px 16px 0;
      font-size: 11px;
      letter-spacing: 0.4px;
      color: var(--accent);
      opacity: 0.75;
    }
    #access-line.on { display: block; }

    .icon-btn {
      width: 40px; height: 40px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text-dim);
      font-size: 15px; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, transform 0.1s, color 0.2s;
    }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn svg { width: 16px; height: 16px; }

    /* ─────────────────────────── Сейчас ─────────────────────────── */
    #now-card {
      display: none;
      position: relative;
      margin: 10px 14px 4px;
      padding: 26px 20px 20px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(180deg, var(--card-active), var(--card));
      text-align: center;
    }
    #now-card.on { display: block; }

    /* Дыхание — медленный пульс за текстом, ритм 11 секунд */
    .breath-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: inherit;
      pointer-events: none;
    }
    .breath {
      position: absolute;
      top: 50%; left: 50%;
      width: 260px; height: 260px;
      margin: -130px 0 0 -130px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-soft) 0%, transparent 68%);
      opacity: 0.55;
      pointer-events: none;
      animation: breathe 11s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(0.78); opacity: 0.32; }
      45%      { transform: scale(1.12); opacity: 0.62; }
    }
    #now-card.paused .breath { animation-play-state: paused; opacity: 0.14; }

    .now-inner { position: relative; z-index: 1; }

    .now-stop {
      position: absolute;
      top: 8px; right: 8px;
      width: 40px; height: 40px;
      z-index: 2;
      border: none; background: transparent;
      color: var(--text-dim);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0.6;
      transition: opacity 0.2s, transform 0.1s;
    }
    .now-stop:active { transform: scale(0.9); opacity: 1; }
    .now-stop svg { width: 14px; height: 14px; }

    .now-eyebrow {
      font-size: 11px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .now-state {
      font-size: 27px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.2px;
      line-height: 1.15;
    }
    .now-env {
      margin-top: 7px;
      font-size: 13.5px;
      color: var(--accent);
      letter-spacing: 0.3px;
    }
    .now-layers {
      margin-top: 5px;
      font-size: 11.5px;
      color: var(--text-dim);
      line-height: 1.45;
    }
    .now-clock {
      margin-top: 14px;
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }
    .now-clock.timer { color: var(--accent); }
    .now-clock.fading { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .now-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .btn {
      flex: 1;
      padding: 12px 4px;
      border: 1px solid var(--line);
      border-radius: 13px;
      font-size: 12.5px;
      font-weight: 500;
      font-family: inherit;
      letter-spacing: 0.2px;
      cursor: pointer;
      background: transparent;
      color: var(--text-dim);
      transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.1s, opacity 0.25s;
    }
    .btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .btn.lead { background: var(--accent); color: #000; border-color: var(--accent); }
    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.35; cursor: default; }

    /* Пустое состояние — вопрос вместо каталога */
    #now-empty { display: none; padding: 22px 22px 4px; text-align: center; }
    #now-empty.on { display: block; }
    #now-empty .ask {
      margin-top: 26px;
      font-size: 16px;
      color: var(--text);
      line-height: 1.3;
      font-weight: 400;
    }
    #now-empty .sub {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    /* ── Приветствие: у приложения есть мягкое мнение ── */
    .greet { text-align: center; }
    .greet .hi {
      font-size: 11px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.85;
    }
    .greet .q {
      margin-top: 12px;
      font-size: 21px;
      line-height: 1.32;
      color: var(--text);
      font-weight: 400;
    }
    .greet .line {
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .greet-go {
      width: 100%;
      margin-top: 20px;
      padding: 15px 14px;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: #000;
      font-family: inherit;
      font-size: 14.5px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 9px;
      transition: transform 0.1s;
    }
    .greet-go:active { transform: scale(0.98); }
    .greet-go .ic { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.8; }
    .greet-go .ic svg { width: 100%; height: 100%; }
    .greet-go .sub2 { font-weight: 500; opacity: 0.6; }
    .greet-alt {
      margin-top: 13px;
      padding: 7px 2px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 12.5px;
      cursor: pointer;
      border-bottom: 1px solid var(--line);
    }
    .greet-alt:active { color: var(--accent); }

    /* ── Возвращение: «продолжить вашу последнюю Тишину» ── */
    #resume-card {
      display: none;
      margin: 26px 0 0;
      padding: 17px 17px 15px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      text-align: left;
    }
    #resume-card.on { display: block; }
    #resume-card .tag {
      font-size: 10px;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    #resume-card .nm { margin-top: 9px; font-size: 16px; font-weight: 500; color: var(--text); }
    #resume-card .ds { margin-top: 4px; font-size: 11.5px; color: var(--text-dim); line-height: 1.4; }
    #resume-card .start {
      width: 100%;
      margin-top: 14px;
      padding: 12px 0;
      border: 1px solid var(--accent-soft);
      border-radius: 12px;
      background: transparent;
      color: var(--accent);
      font-family: inherit;
      font-size: 13.5px; font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    #resume-card .start:active { transform: scale(0.98); background: var(--card-active); }

    /* ── Тихая строка про постоянство. Не достижение, а факт ── */
    #streak {
      display: none;
      margin-top: 20px;
      font-size: 11.5px;
      letter-spacing: 0.3px;
      color: var(--text-dim);
      opacity: 0.8;
    }
    #streak.on { display: block; }

    /* ══ НОЧЬ. Свет — тоже звук, только для глаз ══
       Меняем не яркость через filter (он ломает position:fixed),
       а саму палитру: комната просто становится темнее. */
    body.night {
      --accent: #8b7237;
      --accent-soft: rgba(139, 114, 55, 0.16);
      --text: #a49d8e;
      --text-dim: #57524a;
      --card: #070605;
      --card-active: #0d0a07;
      --line: #161310;
    }
    body.night .breath { animation-duration: 17s; opacity: 0.35; }
    body.night .env.now { box-shadow: none; }

    #night-veil {
      position: fixed; inset: 0; z-index: 850;
      background: #000;
      opacity: 0; pointer-events: none;
      transition: opacity 4s ease;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 40px;
    }
    body.night-deep #night-veil { opacity: 0.99; pointer-events: auto; }
    #night-veil .nv-nm { font-size: 15px; color: #8a8478; letter-spacing: 0.4px; }
    #night-veil .nv-ds { margin-top: 8px; font-size: 12px; color: #4a463f; }
    #night-veil .nv-hint {
      margin-top: 30px;
      font-size: 10px; letter-spacing: 1.8px; text-transform: uppercase;
      color: #2e2b27;
    }

    /* ── Моя Тишина ── */
    .me-total { padding: 2px 20px 0; font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
    .me-bars { padding: 4px 18px 0; display: flex; flex-direction: column; gap: 13px; }
    .me-row .top {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      font-size: 13.5px; color: var(--text);
    }
    .me-row .top .val { font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
    .me-row .bar {
      margin-top: 7px;
      height: 3px;
      border-radius: 2px;
      background: var(--line);
      overflow: hidden;
    }
    .me-row .bar i {
      display: block;
      height: 100%;
      border-radius: 2px;
      background: var(--accent);
      opacity: 0.75;
    }
    .me-empty { padding: 8px 20px 0; font-size: 12.5px; color: var(--text-dim); line-height: 1.55; }
    .me-note { padding: 22px 20px 0; font-size: 11.5px; color: var(--text-dim); opacity: 0.8; line-height: 1.5; }

    .section-head {
      padding: 20px 18px 8px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* ─────────────────────────── Состояния ─────────────────────────── */
    .states { padding: 0 14px; display: flex; flex-direction: column; gap: 8px; }

    .state {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      width: 100%;
      transition: border-color 0.25s, background 0.25s, transform 0.1s;
    }
    .state:active { transform: scale(0.99); }
    .state.now { border-color: var(--accent); background: var(--card-active); }

    .state .ic {
      width: 25px; height: 25px;
      flex-shrink: 0;
      color: var(--text-dim);
      transition: color 0.25s;
    }
    .state.now .ic { color: var(--accent); }
    .state .ic svg { width: 100%; height: 100%; }

    .state .txt { flex: 1; min-width: 0; }
    .state .nm {
      display: block;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.2px;
    }
    .state.now .nm { color: var(--accent); }
    .state .ds {
      display: block;
      font-size: 11.5px;
      color: var(--text-dim);
      margin-top: 3px;
      line-height: 1.35;
    }
    .state .chev { width: 14px; height: 14px; flex-shrink: 0; color: var(--text-dim); opacity: 0.45; }
    .state.suggested { border-color: var(--accent-soft); }
    .state .when {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.2px;
    }

    /* ─────────────────────────── Среды внутри состояния ─────────────────────────── */
    .state-head { padding: 14px 20px 4px; }
    .state-head .eyebrow {
      font-size: 11px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      min-height: 13px;
    }

    .tune-main { padding: 16px 14px 4px; }
    .pp-lead {
      width: 100%;
      padding: 15px 0;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: #000;
      font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer;
      transition: transform 0.1s, background 0.25s, color 0.25s;
    }
    .pp-lead:active { transform: scale(0.98); }
    .pp-lead.paused { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 14px 0; }

    .state-head .h1 {
      font-size: 26px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.15;
    }
    .state-head .mood {
      margin-top: 8px;
      font-size: 12.5px;
      color: var(--text-dim);
      line-height: 1.5;
      letter-spacing: 0.2px;
    }

    .envs { padding: 16px 14px 0; display: flex; flex-direction: column; gap: 9px; }

    .env {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card);
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      width: 100%;
      position: relative;
      transition: border-color 0.25s, background 0.25s, transform 0.1s;
    }
    .env:active { transform: scale(0.99); }
    .env.now { border-color: var(--accent); background: var(--card-active); box-shadow: 0 0 20px var(--accent-soft); }
    .env.blocked { opacity: 0.55; }
    .env .txt { flex: 1; min-width: 0; }
    .env .nm {
      display: block;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text);
    }
    .env.now .nm { color: var(--accent); }
    .env .ds {
      display: block;
      font-size: 11.5px;
      color: var(--text-dim);
      margin-top: 3px;
      line-height: 1.35;
    }
    .env .play {
      width: 30px; height: 30px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-dim);
    }
    .env.now .play { border-color: var(--accent); color: var(--accent); }
    .env .play svg { width: 12px; height: 12px; }
    .env .lk { width: 12px; height: 12px; flex-shrink: 0; color: var(--text-dim); opacity: 0.55; }

    /* ── Рекомендуемая атмосфера ── */
    .rec {
      margin: 16px 14px 0;
      padding: 20px 18px 18px;
      border: 1px solid var(--accent-soft);
      border-radius: 18px;
      background: linear-gradient(180deg, var(--card-active), var(--card));
    }
    .rec .tag {
      font-size: 10px;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .rec .nm { font-size: 20px; font-weight: 500; color: var(--text); }
    .rec .ds { font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.4; }
    .rec .start {
      width: 100%;
      margin-top: 16px;
      padding: 14px 0;
      border: none;
      border-radius: 13px;
      background: var(--accent);
      color: #000;
      font-size: 14.5px; font-weight: 600; font-family: inherit;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .rec .start:active { transform: scale(0.98); }
    .rec .chips { display: flex; gap: 7px; margin-top: 9px; }
    .rec .chip {
      flex: 1;
      padding: 12px 0;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: transparent;
      color: var(--text-dim);
      font-size: 11.5px; font-family: inherit; font-weight: 500;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, transform 0.1s;
    }
    .rec .chip:active { transform: scale(0.95); border-color: var(--accent); color: var(--accent); }

    /* ── Быстрая настройка атмосферы ── */
    .atmo { padding: 10px 14px 0; display: flex; flex-direction: column; gap: 12px; }
    .atmo-presets { display: flex; gap: 7px; }
    .atmo-presets button {
      flex: 1;
      padding: 11px 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px; font-weight: 500; font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .atmo-presets button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .atmo-slider {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--card);
    }
    .atmo-slider span {
      font-size: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
      min-width: 64px;
    }
    .atmo-slider span:last-child { text-align: right; }
    .atmo-slider input { flex: 1; }

    .detail-toggle {
      display: block;
      margin: 16px auto 0;
      padding: 9px 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px; font-family: inherit;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .detail-toggle.open { color: var(--accent); border-color: var(--accent-soft); }

    /* ─────────────────────────── Настройка ─────────────────────────── */
    .layers { padding: 12px 14px 0; display: flex; flex-direction: column; gap: 7px; }

    .layer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
    }
    .layer .ic { width: 20px; height: 20px; flex-shrink: 0; color: var(--accent); }
    .layer .ic svg { width: 100%; height: 100%; }
    .layer .body { flex: 1; min-width: 0; }
    .layer .nm { font-size: 12.5px; color: var(--text); display: block; margin-bottom: 7px; }
    .layer .off {
      width: 26px; height: 26px;
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      border-radius: 50%;
    }
    .layer .off:active { background: rgba(255,255,255,0.06); }

    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 3px;
      border-radius: 2px; outline: none; cursor: pointer;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--val, 0%), var(--line) var(--val, 0%), var(--line) 100%);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); cursor: pointer;
      box-shadow: 0 0 6px var(--accent-soft);
    }
    input[type=range]::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
    }

    .tabs { display: flex; gap: 4px; padding: 4px 14px 0; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      padding: 9px 15px 11px;
      border: none; background: transparent;
      color: var(--text-dim);
      font-size: 13px; font-weight: 500; font-family: inherit;
      letter-spacing: 0.3px; cursor: pointer; position: relative;
      transition: color 0.25s;
    }
    .tab.active { color: var(--accent); }
    .tab::after {
      content: '';
      position: absolute; left: 15px; right: 15px; bottom: 4px;
      height: 1.5px; background: var(--accent); border-radius: 1px;
      opacity: 0; transform: scaleX(0.4);
      transition: opacity 0.25s, transform 0.25s;

    .tabs-line { height: 1px; background: var(--line); margin: 0 14px; }

    .pane { display: none; }
    .pane.active { display: block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 12px 14px 0;

    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 14px 6px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.3s, background 0.3s, box-shadow 0.3s, opacity 0.3s;
      user-select: none;
      position: relative;
    }
    .card.active { background: var(--card-active); border-color: var(--accent); box-shadow: 0 0 20px var(--accent-soft); }
    .card.blocked { opacity: 0.45; }
    .card-icon {
      width: 24px; height: 24px;
      color: var(--text-dim);
      transition: color 0.3s, transform 0.3s;
      display: flex; align-items: center; justify-content: center;

    .card-icon svg { width: 100%; height: 100%; }
    .card.active .card-icon { color: var(--accent); transform: scale(1.06); }
    .card.loading .card-icon { opacity: 0.15; }
    .card .spinner {
      display: none;
      position: absolute; top: 14px;
      width: 20px; height: 20px;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;

    @keyframes spin { to { transform: rotate(360deg); } }
    .card .badge {
      position: absolute; top: 7px; right: 8px;
      width: 11px; height: 11px;
      color: var(--text-dim); opacity: 0.5;

    .card.active .badge { color: var(--accent); opacity: 1; }
    .card-name {
      font-size: 10.5px;
      color: var(--text-dim);
      text-align: center;
      font-weight: 500;
      letter-spacing: 0.2px;
      transition: color 0.3s;
      line-height: 1.25;
      min-height: 26px;
      display: flex; align-items: center;
    }
    .card.active .card-name { color: var(--text); }

    .row-actions { display: flex; gap: 8px; padding: 18px 14px 0; }

    /* ─────────────────────────── Свои миксы ─────────────────────────── */
    .mixes { display: flex; gap: 8px; padding: 0 14px; overflow-x: auto; scrollbar-width: none; }
    .mixes::-webkit-scrollbar { display: none; }
    .mix-btn {
      flex-shrink: 0;
      padding: 8px 30px 8px 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px; font-weight: 500; font-family: inherit;
      cursor: pointer; position: relative;
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;

    .mix-btn:active { transform: scale(0.95); }
    .mix-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .mix-btn .del {
      position: absolute; right: 7px; top: 50%;
      transform: translateY(-50%);

      font-size: 12px; line-height: 1;
      color: var(--text-dim);
      background: rgba(255,255,255,0.05);
    }
    .mix-btn .del:active { background: #7a2c2c; color: #fff; }

    /* ─────────────────────────── Мини-плеер ─────────────────────────── */
    #mini {
      display: none;
      position: fixed;
      left: 12px; right: 12px;
      bottom: calc(var(--bottom) + 8px);

      gap: 12px;
      z-index: 150;

    #mini .nm {

    }
    #mini .ds {

      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

    #mini .pp {

    .mini-dot {
      width: 9px; height: 9px;

    @keyframes miniBreathe {
      0%, 100% { transform: scale(0.7); opacity: 0.5; }
      50%      { transform: scale(1.15); opacity: 1; }
    }
    #mini.paused .mini-dot { animation: none; opacity: 0.25; }

    /* ─────────────────────────── Меню таймера ─────────────────────────── */
    .timer-wrap { position: relative; flex: 1; display: flex; }
    .timer-wrap .btn { width: 100%; }
    .timer-menu {
      display: none;

    .pay-title { font-size: 19px; color: var(--text); font-weight: 500; margin-bottom: 6px; }

    .pay-row .rt { font-size: 13px; color: var(--text); line-height: 1.4; }

    .pay-cta {

    .pay-note { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 11px; line-height: 1.4; }
    .pay-close {

    #toast {

    .pad-mini { height: 76px; }
  </style>
</head>

  <script>
  (() => {
    'use strict';

    const TG = window.Telegram?.WebApp;
    if (TG) {
      TG.expand();
      try { TG.setBackgroundColor('#000000'); TG.setHeaderColor('#000000'); } catch (e) {}
      try { TG.disableVerticalSwipes(); } catch (e) {}
    }

    const QS = new URLSearchParams(location.search);
    const UID = TG?.initDataUnsafe?.user?.id || 0;
    const PRO_KEY = 'tishina_pro';

    const IS_PRO = (() => {
      const f = QS.get('pro');
      if (f === '1') { try { localStorage.setItem(PRO_KEY, String(UID)); } catch (e) {} return true; }
      if (f === '0') { try { localStorage.removeItem(PRO_KEY); } catch (e) {} return false; }
      try { const s = localStorage.getItem(PRO_KEY); if (s !== null && String(UID) === s) return true; } catch (e) {}
      return false;
    })();

    // ═══════════════════════════════════════════════════════════
    //  Доступ: сначала опыт, потом ценность, потом подписка.
    //  fresh — ещё не запускал ничего: всё открыто, замков нет.
    //  trial — 24 часа полной тишины с первого осмысленного запуска.
    //  free  — пробный период прошёл: базовые звуки остаются.
    //  deep  — «Глубокая тишина» оплачена (или pro=1 для тестов).

      try {

        if (d && d.uid === UID && d.start) return d.start;
      } catch (e) {}
      return null;
    }

      if (IS_PRO) return 'deep';
      const ts = trialStartTs();
      if (!ts) return 'fresh';
      return Date.now() < ts + TRIAL_MS ? 'trial' : 'free';
    }

        ]},

      { id:'move', ic:'move', dur:[20, 40],
        ru:['Тренировка', 'энергия · ритм · движение'],
        fx:{ ru:'Ритм и энергия, которые толкают вперёд', en:'Rhythm and energy that push you forward' },
        en:['Training', 'energy · rhythm · movement'],
        envs: [
          { id:'road',  ru:'Трасса',           en:'Highway',       mix:{ highway:46, car:26, wind:22 } },
          { id:'pulse', ru:'Городской ритм',   en:'City Pulse',    mix:{ street:44, crowd:26, metro:20, wind:18 } },
          { id:'storm', ru:'Ветер и гроза',    en:'Wind and Storm',mix:{ wind:46, thunder:32, rain:30 } },
        ]},

      { id:'sleep', ic:'sleep', dur:[45, 90, -1], night:true,
        ru:['Уснуть', 'расслабление · замедление · переход ко сну'],
        fx:{ ru:'Звук замедляется вместе с вами и гаснет сам', en:'The sound slows down with you and fades on its own' },
        en:['Sleep', 'letting go · slowing down · drifting off'],
        envs: [
          { id:'ocean', ru:'Океан',            en:'Ocean',         mix:{ waves:52, rain:26, choir:16 } },
          { id:'storm', ru:'Дождь и гром',     en:'Rain and Thunder', mix:{ rain:52, thunder:24, deepnoise:22 } },
          { id:'night', ru:'Ночной поезд',     en:'Night Train',   mix:{ train:46, rain:30, window:22 } },

      { id:'place', ic:'place',
        ru:['Сменить обстановку', 'другое место · другая комната · другой город'],
        fx:{ ru:'Несколько минут — и комната становится другим местом', en:'A few minutes — and the room becomes another place' },
        en:['Change of Scenery', 'another place · another room · another city'],
        envs: [
          { id:'paris',   ru:'Парижское кафе', en:'Paris Cafe',     mix:{ cafe:52, street:26, rain:34 } },
          { id:'airport', ru:'Зал ожидания',   en:'Airport Lounge', mix:{ airport:48, crowd:22, wind:20 } },
          { id:'metro',   ru:'Метро',          en:'Metro',          mix:{ metro:46, crowd:20, deepnoise:20, rain:18 } },
          { id:'flight',  ru:'Полёт',          en:'In Flight',      mix:{ plane:50, softnoise:24, halo:22 } },
          { id:'shop',    ru:'Городской день', en:'City Day',       mix:{ shop:44, crowd:26, street:20, rain:18 } },
          { id:'sail',    ru:'На воде',        en:'On the Water',   mix:{ boat:48, waves:34, wind:24 } },
          { id:'seahouse',ru:'Дом у моря',     en:'House by the Sea', mix:{ waves:46, wind:26, hearth:24, birds:12 } },
          { id:'raincity',ru:'Дождливый город',en:'Rainy City',     mix:{ street:38, rain:44, window:22, thunder:14 } },
        ]},
    ];

    // Тональные слои — музыкальные элементы. Правило продукта: тон
    // остаётся мягким фоном, никогда не «музыкой поверх атмосферы».
    // Два сильных тона разом не звучат — второй приглушает первый.
    // (Приведение самих файлов к общему тональному центру — офлайн-
    // задача звукорежиссуры; здесь дисциплина громкостей и спектра.)
    const TONAL = new Set(['handpan', 'veil', 'choir', 'glow', 'dusk', 'halo']);
    // Слои с голосами и объявлениями: их нельзя давать замаскировать
    const VOICE = new Set(['cafe', 'crowd', 'airport', 'shop']);
    const NOISY = new Set(['softnoise', 'deepnoise']);
    // Прямые гармонические конфликты. glow это ми, dusk это ми-бемоль —
    // полутон, вместе не звучат ни при каких громкостях. Пары измерены
    // по реальному спектру файлов, а не взяты из нот в MIDI.
    const CLASH = [['glow', 'dusk']];

    const stateById = id => STATES.find(s => s.id === id);
    const envFull = env => Object.keys(env.mix).every(id => { const s = byId(id); return s && allowed(s); });
    // Слои среды, которые реально прозвучат у этого человека
    const envAudible = env => Object.keys(env.mix).filter(id => { const s = byId(id); return s && allowed(s); });
    const envDesc = (env, stId) => envAudible(env).map(id => charName(id, stId)).join(' · ');

    // ═══════════════════════════════════════════════════════════════
    //  ПАМЯТЬ. Человек возвращается не за звуком, а за своим
    //  состоянием — значит, приложение обязано его помнить.
    //  Один журнал сессий, всё остальное считается из него на лету:
    //  привычки по часам, любимые среды, неделя, дни подряд.
    //  Живёт только в localStorage этого устройства, никуда не уходит.
    // ═══════════════════════════════════════════════════════════════
    const MEM_KEY = 'tishina_mem';
    const MEM_DAYS = 45, MEM_MAX = 400;
    const MEM_MIN_REAL = 1.5;   // короче — это «передумал», а не состояние

    function memLoad() {
      try {
        const m = JSON.parse(localStorage.getItem(MEM_KEY));
        if (m && Array.isArray(m.s)) return m;
      } catch (e) {}
      return { v: 1, s: [] };
    }
    function memSave(m) { try { localStorage.setItem(MEM_KEY, JSON.stringify(m)); } catch (e) {} }

    const dayKey = ts => {
      const d = new Date(ts);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    };

    // Текущая сессия: { t — её id и время старта, since — с какого
    // момента ещё не записанное время. Время копится, даже если
    // приложение свернули: аудио продолжает играть.
    let memCur = null;

    function memBegin() {
      if (!current) return;
      memEnd();
      const m = memLoad();
      const rec = {
        t: Date.now(), d: dayKey(Date.now()),
        st: current.st || '', env: current.env || '', mx: current.name || '', m: 0
      };
      m.s.push(rec);
      const edge = Date.now() - MEM_DAYS * 86400000;
      m.s = m.s.filter(r => r.t >= edge);
      if (m.s.length > MEM_MAX) m.s = m.s.slice(-MEM_MAX);
      memSave(m);
      memCur = { t: rec.t, since: Date.now() };
    }

    function memAccrue() {
      if (!memCur) return;
      const now = Date.now();
      const add = (now - memCur.since) / 60000;
      memCur.since = now;
      if (add < 0.05) return;
      const m = memLoad();
      const r = m.s.find(x => x.t === memCur.t);
      if (!r) { memCur = null; return; }
      r.m = Math.round((r.m + add) * 100) / 100;
      memSave(m);
    }

    function memEnd() { memAccrue(); memCur = null; }
    function memResume() { if (memCur) memCur.since = Date.now(); }

    // ── Что из этого следует ──
    function memStats() {
      const m = memLoad();
      const now = Date.now(), weekEdge = now - 7 * 86400000;
      const byState = {}, byEnv = {}, days = new Set();
      let week = 0, real = 0;
      m.s.forEach(r => {
        if (r.m < MEM_MIN_REAL) return;
        real++;
        days.add(r.d);
        if (r.st && r.env) { const k = r.st + ':' + r.env; byEnv[k] = (byEnv[k] || 0) + r.m; }
        if (r.t >= weekEdge) {
          week += r.m;
          if (r.st) byState[r.st] = (byState[r.st] || 0) + r.m;
        }
      });
      return { week, byState, byEnv, days, real, all: m.s };
    }

    // Дни подряд. Сегодня ещё может не начаться — тогда считаем от вчера.
    function memStreak(days) {
      let n = 0;
      const d = new Date();
      if (!days.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);
      while (days.has(dayKey(d.getTime())) && n < 400) { n++; d.setDate(d.getDate() - 1); }
      return n;
    }

    // Привычка этого часа: куда человек обычно попадает примерно сейчас
    function memHabit(hour) {
      const cnt = {};
      memLoad().s.forEach(r => {
        if (!r.st || r.m < 4 || !stateById(r.st)) return;
        let diff = Math.abs(new Date(r.t).getHours() - hour);
        if (diff > 12) diff = 24 - diff;
        if (diff <= 2) cnt[r.st] = (cnt[r.st] || 0) + 1;
      });
      let best = null, bn = 0;
      Object.keys(cnt).forEach(k => { if (cnt[k] > bn) { bn = cnt[k]; best = k; } });
      return bn >= 2 ? best : null;
    }

    // Любимая среда внутри состояния — с ней и открываем состояние
    function memFavEnv(stId) {
      const st = stateById(stId);
      if (!st) return null;
      const acc = {};
      memLoad().s.forEach(r => {
        if (r.st !== stId || !r.env || r.m < MEM_MIN_REAL) return;
        acc[r.env] = (acc[r.env] || 0) + r.m;
      });
      let best = null, bv = 0;
      Object.keys(acc).forEach(k => { if (acc[k] > bv && st.envs.some(e => e.id === k)) { bv = acc[k]; best = k; } });
      return best;
    }

    // Последняя настоящая сессия — для карточки возвращения
    function memLast() {
      const s = memLoad().s;
      for (let i = s.length - 1; i >= 0; i--) {
        const r = s[i];
        if (r.st && r.env && r.m >= MEM_MIN_REAL) {
          const st = stateById(r.st);
          if (st && st.envs.some(e => e.id === r.env)) return r;
        }
      }
      return null;
    }

    // ── Человеческие форматы ──
    function plural(n, forms) {
      if (lang !== 'ru') return forms[n === 1 ? 0 : 1].replace('%n', n);
      const a = n % 100, b = n % 10;
      const i = (a > 10 && a < 20) ? 2 : b === 1 ? 0 : (b >= 2 && b <= 4) ? 1 : 2;
      return forms[i].replace('%n', n);
    }

    function durText(min) {
      const m = Math.round(min);
      if (m < 60) return m + ' ' + t('minShort');
      const h = Math.floor(m / 60), r = m % 60;
      return h + ' ' + t('hourShort') + (r ? ' ' + r + ' ' + t('minShort') : '');
    }

    function whenText(ts) {
      const today = dayKey(Date.now());
      const k = dayKey(ts);
      if (k === today) return t('dayToday');
      const y = new Date(); y.setDate(y.getDate() - 1);
      if (k === dayKey(y.getTime())) return t('dayYest');
      const d = Math.round((Date.now() - ts) / 86400000);
      return d + ' ' + t('dayAgo');
    }

    const FADE = 0.4, SCENE_FADE = 2.5, TIMER_FADE = 30;

    // ═══════════════════════════════════════════════════════════════
    //  Аудиодвижок — без изменений, он и так работает бесшовно
    // ═══════════════════════════════════════════════════════════════
    const els = {}, state = {}, fades = {};
    let masterVol = 1;
    let paused = false;

    SOUNDS.forEach(s => { state[s.id] = { active: false, volume: s.def }; });

    const canAAC = (() => {
      const a = document.createElement('audio');
      return !!a.canPlayType('audio/mp4; codecs="mp4a.40.2"');
    })();

    const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
             || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    // ═════════════════════════════════════════════════════════════
    //  Web Audio: слои идут через общий граф.
    //  Каждый слой: источник → спектральная расчистка → громкость.
    //  Дальше два пути: сухой в мастер и посыл в общий реверб —
    //  одно «помещение» на все слои и склеивает их в пространство.
    //  На мастере мягкий компрессор: «Полное погружение» не клипует.
    //  Если Web Audio недоступен — тихий фолбэк на el.volume.
    // ═════════════════════════════════════════════════════════════
    let ctx = null, masterGain = null, wetGain = null;
    const nodes = {};

    function makeImpulse(seconds, decay) {
      const rate = ctx.sampleRate, len = Math.floor(rate * seconds);
      const buf = ctx.createBuffer(2, len, rate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        }
      }
      return buf;
    }

    function ensureCtx() {
      if (ctx) return ctx;
      // iOS замораживает AudioContext при блокировке экрана — граф
      // замолкает даже в Safari. Прямые <audio> играют под блокировкой.
      // Ночной звук важнее реверба: на iOS работаем без Web Audio.
      if (IOS) return null;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try {
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -12; comp.knee.value = 10;
        comp.ratio.value = 6; comp.attack.value = 0.012; comp.release.value = 0.3;
        masterGain = ctx.createGain();
        masterGain.gain.value = 1;
        const convolver = ctx.createConvolver();
        convolver.buffer = makeImpulse(1.6, 2.4);
        wetGain = ctx.createGain();
        wetGain.gain.value = 0.10;
        masterGain.connect(comp);
        convolver.connect(wetGain);
        wetGain.connect(comp);
        comp.connect(ctx.destination);
        ensureCtx._conv = convolver;
        // Система прервала контекст (звонок, другое медиа) — поднимаем
        ctx.onstatechange = () => {
          if (ctx.state !== 'running' && !paused && anyActive()) ctx.resume().catch(() => {});
        };
      } catch (e) { ctx = null; }
      return ctx;
    }

    function connectWA(id, el) {
      if (!ctx || nodes[id]) return;
      try {
        const src = ctx.createMediaElementSource(el);
        const g = ctx.createGain();
        g.gain.value = 0;
        let head = src;
        // Спектральная расчистка: каждый слой уступает чужую полосу.
        // Склоны мягкие — на слух звук остаётся естественным.
        const band = PROF[id]?.band;
        if (band === 'high') {
          const f = ctx.createBiquadFilter();
          f.type = 'highpass'; f.frequency.value = 200; f.Q.value = 0.5;
          head.connect(f); head = f;
        } else if (band === 'low') {
          const f = ctx.createBiquadFilter();
          f.type = 'lowpass'; f.frequency.value = 3400; f.Q.value = 0.5;
          head.connect(f); head = f;
        }
        // Характер: глухость = расстояние. Меняется вместе со средой,
        // поэтому фильтр стоит всегда, просто по умолчанию открыт.
        const chr = ctx.createBiquadFilter();
        chr.type = 'lowpass'; chr.frequency.value = 20000; chr.Q.value = 0.4;
        head.connect(chr); head = chr;
        head.connect(g);
        g.connect(masterGain);
        g.connect(ensureCtx._conv);
        el.volume = 1;
        nodes[id] = { src, gain: g, chr };
      } catch (e) {}
    }

    function ensureEl(id) {
      if (els[id]) return els[id];
      const s = byId(id);
      const el = new Audio();
      // Имена файлов не меняются, поэтому Telegram и iOS отдают старые
      // звуки из кэша сколько угодно долго. Пробивает это только версия
      // в адресе — её поднимает «ОБНОВИТЬ ЗВУКИ.command» при каждой заливке.
      el.src = (canAAC ? id + '.m4a' : s.file) + '?v=' + SND_V;
      el.loop = true;
      el.preload = 'auto';
      el.volume = 0;
      el.setAttribute('playsinline', '');
      if (ensureCtx()) { connectWA(id, el); applyChars(0.01); }
      el.addEventListener('playing', () => setCardLoading(id, false));
      el.addEventListener('canplaythrough', () => setCardLoading(id, false));
      el.addEventListener('error', () => {
        if (!el.dataset.fb && el.src.endsWith('.m4a')) {
          el.dataset.fb = '1'; el.src = s.file; el.load();
          if (state[id].active) el.play().catch(() => {});
          return;
        }
        setCardLoading(id, false); haptics.error(); showToast(t('loadFail'));
      });
      els[id] = el;
      return el;
    }

    function fadeTo(id, target, seconds, onDone) {
      const el = els[id];
      if (!el) return;
      clearInterval(fades[id]); delete fades[id];
      clearTimeout(fadeTo['_d' + id]);
      if (nodes[id]) {
        // Web Audio: сэмпл-точный ramp вместо шагов таймера
        const g = nodes[id].gain.gain, now = ctx.currentTime;
        try {
          g.cancelScheduledValues(now);
          g.setValueAtTime(g.value, now);
          g.linearRampToValueAtTime(Math.max(0, Math.min(1, target)), now + Math.max(0.02, seconds));
        } catch (e) {}
        if (onDone) fadeTo['_d' + id] = setTimeout(onDone, seconds * 1000 + 30);
        return;
      }
      const from = el.volume, steps = Math.max(1, Math.round(seconds * 20));
      let i = 0;
      fades[id] = setInterval(() => {
        i++;
        try { el.volume = Math.max(0, Math.min(1, from + (target - from) * (i / steps))); } catch (e) {}
        if (i >= steps) { clearInterval(fades[id]); delete fades[id]; if (onDone) onDone(); }
      }, seconds * 1000 / steps);
    }

    // Итоговая громкость слоя: в Web Audio мастер-фейды делает masterGain
    const volTarget = id => state[id].volume * (ctx ? 1 : masterVol);

    async function startSound(id, fade = FADE) {
      const el = ensureEl(id);
      setCardLoading(id, true);
      try {
        if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
        if (!nodes[id]) el.volume = 0;
        await el.play();
        setCardLoading(id, false);
        fadeTo(id, volTarget(id), fade);
      } catch (e) { setCardLoading(id, false); }
      updateMediaSession();
    }

    function stopSound(id, fade = FADE) {
      const el = els[id];
      if (!el) return;
      fadeTo(id, 0, fade, () => { try { el.pause(); el.currentTime = 0; } catch (e) {} });
      updateMediaSession();
    }

    function setVolume(id, v, ramp = 0.08) {
      state[id].volume = v;
      if (els[id] && !els[id].paused) fadeTo(id, volTarget(id), ramp);
    }

    function setMasterVolume(v, seconds) {
      if (ctx && masterGain) {
        masterVol = v;
        const g = masterGain.gain, now = ctx.currentTime;
        try {
          g.cancelScheduledValues(now);
          g.setValueAtTime(g.value, now);
          g.linearRampToValueAtTime(Math.max(0.0001, v), now + Math.max(0.05, seconds));
        } catch (e) {}
        return;
      }
      const from = masterVol, steps = Math.max(1, Math.round(seconds * 10));
      let i = 0;
      clearInterval(setMasterVolume._t);
      setMasterVolume._t = setInterval(() => {
        i++;
        masterVol = from + (v - from) * (i / steps);
        SOUNDS.forEach(s => {
          const el = els[s.id];
          if (el && !el.paused && !fades[s.id]) {
            try { el.volume = Math.max(0, Math.min(1, state[s.id].volume * masterVol)); } catch (e) {}
          }
        });
        if (i >= steps) clearInterval(setMasterVolume._t);
      }, seconds * 1000 / steps);
    }

    // Сторож: Telegram и iOS иногда глушат элемент — поднимаем обратно.
    // На паузе не трогаем, иначе пауза не держится.
    setInterval(() => {
      if (paused) return;
      SOUNDS.forEach(s => {
        const el = els[s.id];
        if (state[s.id].active && el && el.paused) el.play().catch(() => {});
      });
    }, 3000);

    const anyActive = () => SOUNDS.some(s => state[s.id].active);

    // Микс человека, а не мгновенный снимок динамика. Пространство
    // всё время дышит и живёт событиями — если сохранять живое
    // значение, микс запомнит случайный порыв ветра, а карточка
    // «Сейчас» будет вечно писать «изменено». Считаем от базы.
    function currentMix() {
      const m = {};
      SOUNDS.forEach(s => {
        if (!state[s.id].active) return;
        const base = baseVol[s.id] !== undefined ? baseVol[s.id] : state[s.id].volume;
        m[s.id] = Math.max(1, Math.min(100, Math.round(base * atmoMult(s.id) * 100)));
      });
      return m;
    }

    // Быстрая настройка атмосферы. Громкости слоёв считаются от базы:
    // base × пресет насыщенности × (тепло/простор) × (покой/жизнь).
    // Сложность здесь, а не в голове пользователя.
    const atmo = { level: 1, warm: 0, alive: 0 };
    let baseVol = {};

    function atmoMult(id) {
      const p = PROF[id] || { warm: 0, alive: 0 };
      const m = atmo.level
        * (1 + 0.45 * atmo.warm * p.warm)
        * (1 + 0.45 * atmo.alive * p.alive);
      // Тональные слои не разгоняются «Полным погружением»:
      // громкий тон превращает атмосферу в музыку
      return Math.max(0.15, Math.min(TONAL.has(id) ? 1.1 : 1.7, m));
    }

    function applyAtmo(ramp = 0.6) {
      SOUNDS.forEach(s => {
        if (!state[s.id].active) return;
        const v = Math.max(0.03, Math.min(1, (baseVol[s.id] ?? state[s.id].volume) * atmoMult(s.id)));
        setVolume(s.id, v, ramp);
      });
      if (view === 'tune') renderLayers();
    }

    function resetAtmo() {
      atmo.level = 1; atmo.warm = 0; atmo.alive = 0;
      syncAtmoUI();
    }

    // Глухость характера. На iOS Web Audio нет — там характер слышен
    // только громкостью, и это нормально: главный сценарий там сон.
    function applyChars(ramp = 2.5) {
      if (!ctx) return;
      SOUNDS.forEach(s => {
        const n = nodes[s.id];
        if (!n || !n.chr) return;
        const c = charProf(s.id);
        const f = Math.min(20000, c ? 800 * Math.pow(24, c.tone) : 20000);
        try {
          const now = ctx.currentTime, p = n.chr.frequency;
          p.cancelScheduledValues(now);
          p.setValueAtTime(p.value, now);
          p.linearRampToValueAtTime(f, now + Math.max(0.01, ramp));
        } catch (e) {}
      });
    }

    function applyMix(mix, fade = FADE) {
      paused = false;
      resetAtmo();
      baseVol = {};
      applyChars(fade);
      SOUNDS.forEach(s => {
        const vol = allowed(s) ? (mix[s.id] || 0) / 100 * charGain(s.id) : 0;
        if (vol > 0) {
          baseVol[s.id] = vol;
          state[s.id].volume = vol;
          if (!state[s.id].active) { state[s.id].active = true; startSound(s.id, fade); }
          else setVolume(s.id, vol, fade);
        } else if (state[s.id].active) {
          state[s.id].active = false; stopSound(s.id, fade);
        }
      });
    }

    // ═══════════════════════════════════════════════════════════════
    //  Что сейчас происходит — единственное «состояние приложения»
    // ═══════════════════════════════════════════════════════════════
    // current: { st, env } — среда из состояния
    //          { name }    — свой микс
    //          null        — тишина
    let current = null;
    let startedAt = 0;
    let openedState = null;
    let agoText = '';

    function label() {
      if (!current) return { top: '', sub: '' };
      if (current.name) return { top: current.name, sub: t('customMood') };
      const st = stateById(current.st);
      const env = st?.envs.find(e => e.id === current.env);
      if (!st || !env) return { top: t('custom'), sub: '' };
      return { top: st[lang][0], sub: env[lang] };
    }

    // «Изменено» — про человека. Дыхание среды и события — не изменения.
    function mixMatchesEnv() {
      if (!current || current.name) return true;
      const st = stateById(current.st);
      const env = st?.envs.find(e => e.id === current.env);
      if (!env) return true;
      if (atmo.level !== 1 || atmo.warm !== 0 || atmo.alive !== 0) return false;
      const want = envAudible(env).slice().sort();
      const have = SOUNDS.filter(x => state[x.id].active).map(x => x.id).sort();
      if (want.join() !== have.join()) return false;
      return want.every(id =>
        Math.abs((baseVol[id] !== undefined ? baseVol[id] : 0) * 100 - env.mix[id] * charGain(id)) <= 1);
    }

    // ═══════════════════════════════════════════════════════════════
    //  Навигация между тремя экранами
    // ═══════════════════════════════════════════════════════════════
    const views = {
      now: document.getElementById('v-now'),
      state: document.getElementById('v-state'),
      tune: document.getElementById('v-tune'),
      me: document.getElementById('v-me'),
    };
    let view = 'now';

    function showView(v) {
      view = v;
      Object.entries(views).forEach(([k, el]) => el.classList.toggle('on', k === v));
      window.scrollTo(0, 0);
      refreshMini();
      if (TG?.BackButton) {
        try { v === 'now' ? TG.BackButton.hide() : TG.BackButton.show(); } catch (e) {}
      }
    }
    document.querySelectorAll('.back').forEach(b => b.addEventListener('click', () => showView('now')));
    if (TG?.BackButton) { try { TG.BackButton.onClick(() => showView('now')); } catch (e) {} }

    // ═══════════════════════════════════════════════════════════════
    //  Экран 1. Список состояний
    // ═══════════════════════════════════════════════════════════════
    const statesBox = document.getElementById('states');

    // ═══════════════════════════════════════════════════════════════
    //  МНЕНИЕ ПРИЛОЖЕНИЯ. Час суток — только первая догадка.
    //  Если человек уже показал, куда он ходит в это время,
    //  привычка сильнее расписания. Мнение всегда мягкое:
    //  предложение, а не указание, и рядом всегда есть «или».
    // ═══════════════════════════════════════════════════════════════
    const MOMENTS = [
      { from: 0, st:'sleep', alt:'meditate',
        ru:{ hi:'Тихая ночь', q:'Помочь уснуть?', line:'Ночь идёт своим ходом — можно ей не мешать.', when:'ночь — поможем уснуть' },
        en:{ hi:'Quiet night', q:'Help you fall asleep?', line:'The night goes its own way — no need to fight it.', when:'night — we will help you sleep' } },
      { from: 5, st:'breath', alt:'focus',
        ru:{ hi:'Доброе утро', q:'Начать день спокойно?', line:'Тело ещё просыпается — можно его не торопить.', when:'утро — мягко разбудить тело' },
        en:{ hi:'Good morning', q:'Start the day calmly?', line:'The body is still waking up — no need to rush it.', when:'morning — gently wake the body' } },
      { from: 9, st:'focus', alt:'read',
        ru:{ hi:'Доброе утро', q:'Куда направить внимание?', line:'Самое ясное время дня — им легко распорядиться.', when:'самое ясное время дня' },
        en:{ hi:'Good morning', q:'Where should your attention go?', line:'The clearest hours of the day — easy to spend well.', when:'the clearest hours of the day' } },
      { from: 12, st:'focus', alt:'unwind',
        ru:{ hi:'Середина дня', q:'Что нужно сейчас?', line:'Можно углубиться в работу — или дать себе паузу.', when:'середина дня' },
        en:{ hi:'Midday', q:'What do you need now?', line:'You can go deeper into work — or take a pause.', when:'midday' } },
      { from: 15, st:'focus', alt:'unwind',
        ru:{ hi:'День идёт', q:'Собрать внимание обратно?', line:'К этому часу оно обычно рассеивается.', when:'к этому часу внимание рассеивается' },
        en:{ hi:'Afternoon', q:'Gather your attention back?', line:'By this hour it usually starts to scatter.', when:'attention scatters around this hour' } },
      { from: 17, st:'unwind', alt:'read',
        ru:{ hi:'Добрый вечер', q:'Можно выдохнуть.', line:'Рабочая часть дня позади.', when:'вечер — можно выдохнуть' },
        en:{ hi:'Good evening', q:'You can exhale now.', line:'The working part of the day is behind you.', when:'evening — time to exhale' } },
      { from: 20, st:'read', alt:'sleep',
        ru:{ hi:'Добрый вечер', q:'Тихий вечер для чтения?', line:'День почти закончился — резких переходов лучше не делать.', when:'тихий вечер для чтения' },
        en:{ hi:'Good evening', q:'A quiet evening to read?', line:'The day is nearly over — better without sharp turns.', when:'a quiet evening to read' } },
      { from: 22, st:'sleep', alt:'meditate',
        ru:{ hi:'Поздний вечер', q:'Хотите мягко перейти ко сну?', line:'Похоже, день подходит к концу.', when:'уже поздно — поможем уснуть' },
        en:{ hi:'Late evening', q:'Would you like to drift toward sleep?', line:'It looks like the day is coming to an end.', when:'it is late — we will help you sleep' } },
    ];

    const GRT = {
      ru: { habitQ: 'Вернуться туда, где вы обычно в это время?', habitLine: 'Похоже, этот час у вас занят именно этим.' },
      en: { habitQ: 'Back to where you usually are at this hour?', habitLine: 'This hour seems to belong to it.' },
    };

    function momentNow() {
      const hr = new Date().getHours();
      let m = MOMENTS[0];
      MOMENTS.forEach(x => { if (hr >= x.from) m = x; });
      return m;
    }

    // Который час — такое и предложение. Приложение угадывает,
    // а не заставляет выбирать даже состояние.
    function suggestNow() {
      const mo = momentNow();
      const habit = memHabit(new Date().getHours());
      const id = habit && stateById(habit) ? habit : mo.st;
      const when = habit && habit !== mo.st
        ? (lang === 'ru' ? 'обычно вы здесь в это время' : 'usually where you are at this hour')
        : mo[lang].when;
      return { id, ru: when, en: when, mo, habit: habit && habit !== mo.st ? habit : null };
    }

    // ═══════════════════════════════════════════════════════════════
    //  Пустой экран — не каталог, а начало путешествия
    // ═══════════════════════════════════════════════════════════════
    const greetGo = document.getElementById('greet-go');
    const greetAlt = document.getElementById('greet-alt');
    let greetPick = null, greetAltId = null;

    function renderGreet() {
      const sug = suggestNow();
      const mo = sug.mo, c = mo[lang];
      const st = stateById(sug.id) || stateById(mo.st);
      const alt = stateById(sug.habit ? mo.st : mo.alt) || stateById(mo.alt);

      document.getElementById('greet-hi').textContent = c.hi;
      document.getElementById('greet-q').textContent = sug.habit ? GRT[lang].habitQ : c.q;
      document.getElementById('greet-line').textContent = sug.habit ? GRT[lang].habitLine : c.line;

      // Одно касание — и человек уже внутри. Среда: любимая, иначе рекомендованная.
      const envId = memFavEnv(st.id);
      const env = st.envs.find(e => e.id === envId) || st.envs[0];
      greetPick = { st, env };
      greetGo.innerHTML = '<span class="ic">' + SIC[st.ic] + '</span><span>' +
        '<span class="nmx"></span> <span class="sub2"></span></span>';
      greetGo.querySelector('.nmx').textContent = st[lang][0];
      greetGo.querySelector('.sub2').textContent = '· ' + env[lang];

      greetAltId = alt && alt.id !== st.id ? alt.id : null;
      if (greetAltId) {
        greetAlt.style.display = '';
        greetAlt.textContent = t('or') + ' ' + alt[lang][0].toLowerCase();
      } else greetAlt.style.display = 'none';
    }

    greetGo.addEventListener('click', () => {
      if (!greetPick) return;
      playEnv(greetPick.st, greetPick.env, envFull(greetPick.env));
    });
    greetAlt.addEventListener('click', () => {
      const st = stateById(greetAltId);
      if (st) { hap('light'); openState(st, true); }
    });

    // ── Возвращение. Человек приходит не за звуком, а за своим состоянием ──
    const resumeCard = document.getElementById('resume-card');
    let resumePick = null;

    function renderResume() {
      const r = memLast();
      const st = r && stateById(r.st);
      const env = st && st.envs.find(e => e.id === r.env);
      // Первый опыт не загромождаем: карточка появляется, когда есть что продолжать
      if (!env || memStats().real < 2) { resumeCard.classList.remove('on'); resumePick = null; return; }
      resumePick = { st, env };
      document.getElementById('resume-tag').textContent = t('resumeTag');
      document.getElementById('resume-nm').textContent = env[lang];
      document.getElementById('resume-ds').textContent =
        st[lang][0] + ' · ' + whenText(r.t) + ' · ' + durText(r.m);
      document.getElementById('resume-go').textContent = t('resumeGo');
      resumeCard.classList.add('on');
    }
    document.getElementById('resume-go').addEventListener('click', () => {
      if (resumePick) playEnv(resumePick.st, resumePick.env, envFull(resumePick.env));
    });

    // ── Постоянство. Факт, а не награда: ни очков, ни серий, ни огоньков ──
    function renderStreak() {
      const el = document.getElementById('streak');
      const n = memStreak(memStats().days);
      if (n < 3) { el.classList.remove('on'); return; }
      el.textContent = plural(n, t('streak'));
      el.classList.add('on');
    }

    function renderIdle() {
      renderGreet();
      renderResume();
      renderStreak();
      renderStates();   // приложение открыто с утра — к вечеру порядок другой
    }

    // ═══════════════════════════════════════════════════════════════
    //  Моя Тишина. Не геймификация: ни очков, ни целей, ни серий,
    //  которые «нельзя прерывать». Только зеркало — где человек
    //  бывает и сколько. И вход обратно в любимое место.
    // ═══════════════════════════════════════════════════════════════
    const meBarsBox = document.getElementById('me-bars');
    const meFavBox = document.getElementById('me-fav');

    function openMe() {
      const s = memStats();
      document.getElementById('me-title').textContent = t('meTitle');
      document.getElementById('me-sub').textContent = t('meSub');
      document.getElementById('head-week').textContent = t('headWeek');
      document.getElementById('me-note').textContent = t('meNote');

      const rows = Object.keys(s.byState)
        .map(id => ({ st: stateById(id), min: s.byState[id] }))
        .filter(r => r.st && r.min >= 1)
        .sort((a, b) => b.min - a.min);

      meBarsBox.innerHTML = '';
      const emptyEl = document.getElementById('me-empty');
      if (!rows.length) {
        emptyEl.textContent = t('meEmpty');
        emptyEl.style.display = '';
      } else {
        emptyEl.style.display = 'none';
        const max = rows[0].min;
        rows.forEach(r => {
          const el = document.createElement('div');
          el.className = 'me-row';
          el.innerHTML = '<div class="top"><span class="nm"></span><span class="val"></span></div>' +
                         '<div class="bar"><i></i></div>';
          el.querySelector('.nm').textContent = r.st[lang][0];
          el.querySelector('.val').textContent = durText(r.min);
          el.querySelector('.bar i').style.width = Math.max(4, Math.round(r.min / max * 100)) + '%';
          meBarsBox.appendChild(el);
        });
        const tot = document.createElement('div');
        tot.className = 'me-row';
        tot.style.marginTop = '4px';
        tot.innerHTML = '<div class="top" style="color:var(--text-dim);font-size:12px">' +
                        '<span class="a"></span><span class="val" style="color:var(--accent)"></span></div>';
        tot.querySelector('.a').textContent = t('meTotal');
        tot.querySelector('.val').textContent = durText(s.week);
        meBarsBox.appendChild(tot);
      }

      // Любимые атмосферы — не список файлов, а двери обратно
      const favs = Object.keys(s.byEnv)
        .map(k => {
          const [stId, envId] = k.split(':');
          const st = stateById(stId);
          const env = st && st.envs.find(e => e.id === envId);
          return env ? { st, env, min: s.byEnv[k] } : null;
        })
        .filter(Boolean)
        .sort((a, b) => b.min - a.min)
        .slice(0, 3);

      meFavBox.innerHTML = '';
      const favHead = document.getElementById('head-fav');
      favHead.textContent = t('headFav');
      favHead.style.display = favs.length ? '' : 'none';
      favs.forEach(f => {
        const b = document.createElement('button');
        b.className = 'env';
        b.innerHTML = '<span class="txt"><span class="nm"></span><span class="ds"></span></span>' +
                      '<span class="play">' + PLAY_IC + '</span>';
        b.querySelector('.nm').textContent = f.env[lang];
        b.querySelector('.ds').textContent = f.st[lang][0] + ' · ' + durText(f.min);
        b.addEventListener('click', () => playEnv(f.st, f.env, envFull(f.env)));
        meFavBox.appendChild(b);
      });

      // Позвать уместно тому, у кого уже получилось: он видит свою неделю
      const mr = document.getElementById('me-ref');
      mr.classList.toggle('on', canInvite());
      document.getElementById('me-ref-tag').textContent = t('refTag');
      document.getElementById('me-ref-ds').textContent = t('refDs');
      document.getElementById('me-ref-btn').textContent = t('refCta');

      showView('me');
    }

    document.getElementById('me-btn').addEventListener('click', () => { hap('light'); openMe(); });

    function renderStates() {
      statesBox.innerHTML = '';
      const sug = suggestNow();
      const order = [...STATES].sort((a, b) =>
        (a.id === sug.id ? -1 : 0) - (b.id === sug.id ? -1 : 0));
      order.forEach(st => {
        const b = document.createElement('button');
        b.className = 'state' + (st.id === sug.id ? ' suggested' : '');
        b.dataset.st = st.id;
        // Подсказку «почему именно это» несёт приветствие наверху —
        // здесь она бы просто повторилась. Остаётся только порядок.
        b.innerHTML =
          '<span class="ic">' + SIC[st.ic] + '</span>' +
          '<span class="txt"><span class="nm"></span><span class="ds"></span></span>' +
          '<span class="chev">' + CHEV + '</span>';
        b.querySelector('.nm').textContent = st[lang][0];
        b.querySelector('.ds').textContent = st[lang][1];
        b.addEventListener('click', () => { hap('light'); openState(st, true); });
        statesBox.appendChild(b);
      });
    }

    // ═════════════════════════════════════════════════════════════
    //  Хаптика. Правило: подтверждение, не украшение.
    //  — вне Telegram все вызовы тихо превращаются в no-op;
    //  — глобальный зазор 80 мс: два события подряд не жужжат дважды;
    //  — в тихих состояниях (сон, медитация, расслабление, дыхание)
    //    сила автоматически на ступень мягче;
    //  — слайдеры троттлятся отдельно (не чаще раза в 90 мс);
    //  — автоматика (фейды, дрейф, таймер, восстановление) не вибрирует
    //    никогда: вызовы стоят только в обработчиках касаний.
    // ═════════════════════════════════════════════════════════════
    const haptics = (() => {
      const hf = () => TG?.HapticFeedback;
      const QUIET = new Set(['sleep', 'meditate', 'unwind', 'breath']);
      const quiet = () => !!(current && !current.name && QUIET.has(current.st));
      let last = 0;
      function fire(fn) {
        const now = Date.now();
        if (now - last < 80) return;
        last = now;
        try { fn(hf()); } catch (e) {}
      }
      let slLast = 0;
      return {
        selection: () => fire(x => x?.selectionChanged()),
        light:  () => fire(x => x?.impactOccurred(quiet() ? 'soft' : 'light')),
        medium: () => fire(x => x?.impactOccurred(quiet() ? 'light' : 'medium')),
        success:() => fire(x => x?.notificationOccurred('success')),
        error:  () => fire(x => x?.notificationOccurred('error')),
        slider: v => {
          const now = Date.now();
          const edge = v !== undefined && (v <= 0 || v >= 100);
          if (!edge && now - slLast < 90) return;
          slLast = now;
          try { edge ? hf()?.impactOccurred(quiet() ? 'soft' : 'light') : hf()?.selectionChanged(); } catch (e) {}
        },
      };
    })();
    const hap = kind => kind === 'medium' ? haptics.medium() : kind === 'select' ? haptics.selection() : haptics.light();

    // ═══════════════════════════════════════════════════════════════
    //  Экран 2. Среды выбранного состояния
    // ═══════════════════════════════════════════════════════════════
    const envsBox = document.getElementById('envs');

    const recBox = document.getElementById('rec-box');
    let recBtn = null, recEnvRef = null;

    function openState(st, autoplay) {
      openedState = st.id;
      document.getElementById('st-title').textContent = st[lang][0];
      document.getElementById('st-mood').textContent = st[lang][1];

      // Первая среда — рекомендация: мы уже знаем, что нужно.
      // Просто нажми «Начать» (или сразу с таймером).
      const rec = st.envs[0];
      const recFull = envFull(rec);
      recBox.innerHTML = '';
      const card = document.createElement('div');
      card.className = 'rec';
      let chips = '';
      if (st.dur) {
        chips = '<div class="chips">' + st.dur.map(d =>
          '<button class="chip" data-d="' + d + '">' +
          (d === 0 ? t('noTimer') : d === -1 ? t('tillMorning') + ' · ' + morningText() : d + ' ' + t('min')) +
          '</button>').join('') + '</div>';
      }
      card.innerHTML =
        '<div class="tag">' + t('rec') + '</div>' +
        '<div class="nm"></div><div class="ds"></div>' +
        '<button class="start">' + t('start') + '</button>' + chips;
      card.querySelector('.nm').textContent = rec[lang];
      card.querySelector('.ds').textContent = envDesc(rec, st.id);
      recBtn = card.querySelector('.start');
      recEnvRef = { st, env: rec };
      recBtn.addEventListener('click', () => {
        // Кнопка живёт вместе с состоянием: Начать → Пауза → Продолжить
        if (current && !current.name && current.st === st.id && current.env === rec.id && anyActive()) {
          hap('light');
          paused ? resumeAll() : pauseAll();
          return;
        }
        playEnv(st, rec, recFull, true);
        if (st.night) setTimer(nightDefaultMin());
        refreshAll();
      });
      card.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
        const d = parseInt(c.dataset.d, 10);
        // «До утра» — обещание, которое стоит денег: всю ночь без обрывов
        if (d === -1 && !nightAllowed()) { showPaywall('lock'); return; }
        // Если рекомендация уже звучит — чип просто ставит таймер,
        // а не перезапускает и тем более не останавливает атмосферу
        const same = current && !current.name && current.st === st.id && current.env === rec.id && anyActive();
        if (!same) playEnv(st, rec, recFull, true);
        else if (paused) resumeAll();
        if (d === -1) { setTimer(tillMorningMin()); haptics.success(); }
        else if (d > 0) { setTimer(d); haptics.success(); }
        else cancelTimer();
        refreshAll();
      }));
      recBox.appendChild(card);

      // Остальные атмосферы
      const rest = st.envs.slice(1);
      document.getElementById('head-others').textContent = t('others');
      document.getElementById('head-others').style.display = rest.length ? '' : 'none';
      envsBox.innerHTML = '';
      rest.forEach(env => {
        const full = envFull(env);
        const b = document.createElement('button');
        b.className = 'env' + (full ? '' : ' blocked') + (current && current.st === st.id && current.env === env.id ? ' now' : '');
        b.innerHTML =
          '<span class="play">' + PLAY_IC + '</span>' +
          '<span class="txt"><span class="nm"></span><span class="ds"></span></span>' +
          (full ? '' : LOCK.replace('class="badge"', 'class="lk"'));
        b.querySelector('.nm').textContent = env[lang];
        b.querySelector('.ds').textContent = envDesc(env, st.id);
        b.addEventListener('click', () => playEnv(st, env, full));
        envsBox.appendChild(b);
      });
      showView('state');

      // Один тап — и состояние уже звучит. Настройка потом, если захочется.
      if (autoplay && !(current && !current.name && current.st === st.id && anyActive())) {
        playEnv(st, rec, recFull, true);
        if (st.night) setTimer(nightDefaultMin());
        refreshAll();
      }
      refreshRecBtn();
    }

    function refreshRecBtn() {
      if (!recBtn || !recEnvRef) return;
      const { st, env } = recEnvRef;
      const here = current && !current.name && current.st === st.id && current.env === env.id && anyActive();
      if (here) recBtn.textContent = paused ? t('resume') : t('pause');
      else recBtn.textContent = t('start') + (st.night ? ' · ' + nightDefaultText() : '');
    }

    function playEnv(st, env, full, stay) {
      hap('medium');
      startTrialIfNeeded();
      // Уже играет эта же среда — второй тап останавливает
      if (current && current.st === st.id && current.env === env.id && !paused) { stopAll(); showView('now'); return; }
      current = { st: st.id, env: env.id };
      startedAt = Date.now();
      memBegin();
      cancelTimer();
      applyMix(env.mix, SCENE_FADE);
      if (env.timer) setTimer(env.timer);
      // В «Уснуть» заходят не для того, чтобы потом что-то выключать
      else if (st.night && !stay) setTimer(nightDefaultMin());
      clearMixHighlight();
      saveLast();
      refreshAll();
      if (!stay) showView('now');
      if (!full && !IS_PRO) {
        // Сначала человек слышит урезанную версию и понимает, чего не хватает
        setTimeout(() => { if (current && current.st === st.id && current.env === env.id) showPaywall('lock'); }, 2500);
      }
    }

    // ═══════════════════════════════════════════════════════════════
    //  Карточка «Сейчас»
    // ═══════════════════════════════════════════════════════════════
    const nowCard = document.getElementById('now-card');
    const nowEmpty = document.getElementById('now-empty');
    const btnPP = document.getElementById('btn-pp');
    const btnTune = document.getElementById('btn-tune');
    const clockEl = document.getElementById('now-clock');

    function refreshNow() {
      const on = anyActive();
      nowCard.classList.toggle('on', on);
      nowEmpty.classList.toggle('on', !on);
      nowCard.classList.toggle('paused', paused);
      // Играет — состояния уходят на второй план: «Другие состояния».
      // На пустом экране заголовок дублировал бы вопрос — прячем.
      document.getElementById('head-states').textContent = t('otherStates');
      document.getElementById('head-states').style.display = on ? '' : 'none';
      // «Моя Тишина» появляется, только когда ей есть что показать
      document.getElementById('me-btn').style.display = memStats().real >= 3 ? '' : 'none';
      if (!on) renderIdle();

      if (on) {
        const l = label();
        document.getElementById('now-eyebrow').textContent = t('eyebrow');
        document.getElementById('now-state').textContent = l.top;
        document.getElementById('now-env').textContent =
          l.sub + (mixMatchesEnv() || sleepMode ? '' : ' · ' + t('edited'));
        document.getElementById('now-layers').textContent =
          SOUNDS.filter(s => state[s.id].active).map(s => charName(s.id)).join(' · ');
        btnPP.textContent = paused ? t('resume') : t('pause');
      }

      btnPP.classList.toggle('lead', !paused);
      document.querySelectorAll('.state').forEach(b => {
        b.classList.toggle('now', !!current && !current.name && current.st === b.dataset.st && on);
      });
      updateClock();
    }

    function updateClock() {
      if (!anyActive()) { clockEl.textContent = ''; return; }
      // Вернулись после перерыва: показываем не 0:00, а «12 мин назад»
      if (paused && agoText) { clockEl.classList.remove('timer'); clockEl.textContent = agoText; return; }
      if (timerEnd) {
        const left = Math.max(0, timerEnd - Date.now());
        clockEl.classList.add('timer');
        // Ночь меряется часами: «439:12» — это не про сон
        if (left >= 3600000) { clockEl.textContent = durText(left / 60000); return; }
        const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
        clockEl.textContent = m + ':' + String(s).padStart(2, '0');
        return;
      }
      clockEl.classList.remove('timer');
      const e = Math.max(0, Date.now() - startedAt);
      const h = Math.floor(e / 3600000), m = Math.floor((e % 3600000) / 60000), s = Math.floor((e % 60000) / 1000);
      clockEl.textContent = (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(s).padStart(2, '0');
    }
    setInterval(() => { updateClock(); if (mini.classList.contains('on')) refreshMini(); }, 1000);

    btnPP.addEventListener('click', () => { hap('light'); paused ? resumeAll() : pauseAll(); });
    document.getElementById('now-stop').addEventListener('click', () => { haptics.medium(); stopAll(); });
    btnTune.addEventListener('click', openTune);

    function pauseAll() {
      if (!anyActive()) return;
      memAccrue();
      paused = true;
      if (sleepMode) nightPoke();   // на паузе ночной экран держать незачем
      SOUNDS.forEach(s => {
        if (state[s.id].active && els[s.id]) fadeTo(s.id, 0, 0.45, () => { try { els[s.id].pause(); } catch (e) {} });
      });
      updateMediaSession();
      refreshAll();
    }

    function resumeAll() {
      paused = false;
      agoText = '';
      startedAt = startedAt || Date.now();
      // Сессия из прошлого запуска: журнал ещё не знает про неё
      if (memCur) memResume(); else memBegin();
      SOUNDS.forEach(s => { if (state[s.id].active) startSound(s.id, 0.7); });
      refreshAll();
    }

    function stopAll() {
      memEnd();
      SOUNDS.forEach(s => { if (state[s.id].active) { state[s.id].active = false; stopSound(s.id); } });
      current = null;
      paused = false;
      clearMixHighlight();
      cancelTimer();
      saveLast();
      refreshAll();
    }

    // Мини-плеер: на втором и третьем экране всегда видно, что играет
    const mini = document.getElementById('mini');
    const miniPP = document.getElementById('mini-pp');

    function refreshMini() {
      const on = anyActive() && view !== 'now';
      mini.classList.toggle('on', on);
      mini.classList.toggle('paused', paused);
      if (!on) return;
      const l = label();
      // Человек видит состояние, в котором находится, а не список файлов
      document.getElementById('mini-nm').textContent = t('eyebrow') + ' · ' + l.top;
      const m = paused && agoText ? agoText
        : Math.floor(Math.max(0, Date.now() - startedAt) / 60000);
      document.getElementById('mini-ds').textContent =
        l.sub + (typeof m === 'string' ? ' · ' + m : (m >= 1 ? ' · ' + m + ' ' + t('min') : ''));
      miniPP.innerHTML = paused ? PLAY_IC : PAUSE_IC;
    }
    mini.addEventListener('click', e => {
      if (e.target.closest('#mini-pp')) { paused ? resumeAll() : pauseAll(); return; }
      showView('now');
    });

    function refreshAll() { refreshNow(); refreshMini(); refreshTunePP(); refreshRecBtn(); renderLayers(); syncCards(); }

    // ═══════════════════════════════════════════════════════════════
    //  Экран 3. Настройка среды
    // ═══════════════════════════════════════════════════════════════
    const layersBox = document.getElementById('layers');

    function openTune() {
      const eb = document.getElementById('tune-eyebrow');
      const ti = document.getElementById('tune-title');
      const su = document.getElementById('tune-sub');
      if (current && !current.name) {
        // Пространство состояния: Сосредоточиться → Глубокая работа → эффект
        const st = stateById(current.st);
        const env = st?.envs.find(e => e.id === current.env);
        eb.textContent = st ? st[lang][0] : '';
        ti.textContent = env ? env[lang] : t('tuneTitle');
        su.textContent = st?.fx ? st.fx[lang] : t('tuneSub');
      } else if (current && current.name) {
        eb.textContent = t('custom');
        ti.textContent = current.name;
        su.textContent = t('customMood');
      } else {
        eb.textContent = '';
        ti.textContent = t('tuneTitle');
        su.textContent = t('tuneSub');
      }
      refreshTunePP();
      renderLayers();
      showView('tune');
    }

    // Главное действие экрана — продолжить или поставить на паузу
    const tunePP = document.getElementById('tune-pp');
    tunePP.addEventListener('click', () => { hap('light'); paused ? resumeAll() : pauseAll(); });
    function refreshTunePP() {
      tunePP.textContent = paused ? t('resume') : t('pause');
      tunePP.classList.toggle('paused', paused);
      tunePP.style.display = anyActive() ? '' : 'none';
    }

    // ── Быстрые контролы атмосферы ──
    const lvBtns = [document.getElementById('lv-soft'), document.getElementById('lv-mid'), document.getElementById('lv-rich')];
    lvBtns.forEach(b => b.addEventListener('click', () => {
      haptics.selection();
      atmo.level = parseFloat(b.dataset.lv);
      lvBtns.forEach(x => x.classList.toggle('on', x === b));
      if (paused) resumeAll();
      applyAtmo();
      scheduleSave();
    }));

    const slWarm = document.getElementById('sl-warm');
    const slAlive = document.getElementById('sl-alive');
    function bindAtmoSlider(sl, key) {
      sl.addEventListener('input', e => {
        const v = parseInt(e.target.value, 10);
        haptics.slider((v + 100) / 2);
        e.target.style.setProperty('--val', ((v + 100) / 2) + '%');
        atmo[key] = v / 100;
        if (paused) resumeAll();
        applyAtmo(0.4);
        scheduleSave();
      });
    }
    bindAtmoSlider(slWarm, 'warm');
    bindAtmoSlider(slAlive, 'alive');

    function syncAtmoUI() {
      lvBtns.forEach(b => b.classList.toggle('on', parseFloat(b.dataset.lv) === atmo.level));
      slWarm.value = Math.round(atmo.warm * 100);
      slWarm.style.setProperty('--val', ((atmo.warm * 100 + 100) / 2) + '%');
      slAlive.value = Math.round(atmo.alive * 100);
      slAlive.style.setProperty('--val', ((atmo.alive * 100 + 100) / 2) + '%');
    }

    // ── Спойлер деталей: слои и библиотека — advanced-слой ──
    const detailWrap = document.getElementById('detail-wrap');
    const toggleDetail = document.getElementById('toggle-detail');
    let detailOpen = false;
    toggleDetail.addEventListener('click', () => {
      haptics.selection();
      detailOpen = !detailOpen;
      detailWrap.style.display = detailOpen ? '' : 'none';
      toggleDetail.classList.toggle('open', detailOpen);
      toggleDetail.textContent = detailOpen ? t('detailClose') : t('detailOpen');
      if (detailOpen) renderLayers();
    });
